tro del proxy web","tipo":"log","texto":"09:14:02  m.ortiz      GET  pegaso-formacion.co/factura   200\n09:14:31  m.ortiz      POST pegaso-formacion.co/login     302\n09:15:10  j.salas      GET  pegaso-formacion.co/factura   200\n09:31:44  (filtro web) dominio añadido a la lista de bloqueo\n09:47:12  m.ortiz      inicio de sesión en el correo desde 185.x.x.x (país no habitual)"},{"titulo":"Buzón de incidentes","tipo":"nota","texto":"Primer aviso de un empleado al buzón de seguridad: 10:05, por J. Salas.\nM. Ortiz: «No avisé porque pensé que si era malo ya lo vería informática».\nÚltima formación de concienciación: hace 26 meses."}],"flags":[{"id":"m-phishing-f1","tipo":"user","nombre":"Flag de usuario · La trampa","t":"multiple","d":1,"q":"¿Qué señales del correo indican que es un phishing?","o":["El dominio del remitente es .co y no el .es corporativo","La urgencia y la amenaza («perderemos el contrato»)","El enlace pide el usuario corporativo en un dominio ajeno","Que esté dirigido a todo el personal"],"c":[0,1,2],"x":"Dominio parecido pero distinto (typosquatting), urgencia artificial y una página que pide credenciales fuera del dominio propio son las señales clásicas. Que vaya a toda la plantilla no es, por sí solo, una señal: muchos correos legítimos también lo hacen.","ref":"ISO/IEC 27001:2022, anexo A 6.3 · RD 311/2022, mp.per.3","pista":"Compara letra a letra el dominio del remitente con el del destinatario."},{"id":"m-phishing-f2","tipo":"user","nombre":"Flag de usuario · El silencio","t":"unica","d":1,"q":"M. Ortiz introdujo su contraseña y no avisó. ¿Qué control de personas falló?","o":["6.8 Notificación de eventos de seguridad de la información","6.1 Investigación de antecedentes","6.6 Acuerdos de confidencialidad","6.5 Responsabilidades tras la baja"],"c":0,"x":"El 6.8 exige que el personal pueda notificar los eventos de seguridad, y sepa hacerlo, por los canales adecuados y a tiempo. «Ya lo verá informática» es justo lo que el control quiere evitar: el primer aviso llegó 53 minutos después y no fue de la persona afectada.","ref":"ISO/IEC 27001:2022, anexo A 6.8","pista":"¿Qué control del tema 6 trata que las personas avisen?"},{"id":"m-phishing-f3","tipo":"user","nombre":"Flag de usuario · Lo que sí funcionó","t":"unica","d":2,"q":"¿Qué control técnico contuvo la campaña a las 09:31?","o":["8.23 Filtrado web","8.13 Copias de seguridad","8.24 Uso de la criptografía","7.4 Monitorización de la seguridad física"],"c":0,"x":"Añadir el dominio a la lista de bloqueo del proxy impide que más personas lleguen a la página falsa: es filtrado web (8.23, nuevo en 2022). Llegó a los 19 minutos; con inteligencia de amenazas (5.7) o con un filtro de correo más estricto podría haberse evitado antes.","ref":"ISO/IEC 27001:2022, anexo A 8.23 y 5.7","pista":"Mira la línea de las 09:31 del proxy."},{"id":"m-phishing-f4","tipo":"root","nombre":"Flag de root · Contención","t":"multiple","d":2,"q":"A las 09:47 alguien entra en el correo de M. Ortiz desde otro país. ¿Qué acciones inmediatas proceden?","o":["Restablecer la contraseña y cerrar las sesiones activas de la cuenta","Revisar reglas de reenvío y correos enviados desde la cuenta comprometida","Activar el doble factor para la cuenta y priorizarlo para toda la plantilla","Esperar al lunes siguiente para no alarmar"],"c":[0,1,2],"x":"Hay que cortar el acceso (contraseña y sesiones), buscar persistencia y daño (reglas de reenvío, envíos maliciosos a terceros) y cerrar la causa (doble factor). Es la respuesta a incidentes del control 5.26; después, el aprendizaje del 5.27.","ref":"ISO/IEC 27001:2022, anexo A 5.26, 5.27 y 8.5","pista":"Piensa en cortar, investigar y evitar que se repita."},{"id":"m-phishing-f5","tipo":"root","nombre":"Flag de root · La causa","t":"unica","d":2,"q":"Como acción correctiva de fondo, ¿qué atacaría mejor la causa raíz?","o":["Despedir a M. Ortiz","Un programa de concienciación periódico con simulaciones de phishing y un canal de aviso sencillo y conocido, más doble factor en el correo","Bloquear todos los dominios .co","Prohibir el correo electrónico"],"c":1,"x":"La formación tenía 26 meses y nadie sabía que debía avisar: la causa es organizativa. Concienciación periódica (6.3), un canal de notificación claro (6.8) y doble factor (8.5) reducen la probabilidad y el impacto. Culpar a la persona no corrige el proceso.","ref":"ISO/IEC 27001:2022, cláusula 10.2 y anexo A 6.3, 6.8 y 8.5","pista":"Una acción correctiva elimina la causa, no al afectado."}]},{"id":"m-puesto","nombre":"Puesto despejado","dificultad":"Fácil","icono":"monitor","marcos":["ENS","27001"],"empresa":"Hespéride Servicios Digitales, S.L. (ficticia)","brief":"Haces una ronda por la oficina de Hespéride a las 14:30, cuando la mitad del equipo está comiendo. El sistema es de categoría MEDIA y su autenticidad es de nivel MEDIO. Anota lo que ves y relaciónalo con las medidas que aplican.","evidencias":[{"titulo":"Notas de la ronda","tipo":"nota","texto":"1. Tres equipos con la sesión abierta y sin bloquear; uno muestra un expediente de un ciudadano.\n2. Pósit en un monitor: «admin / Hesperide2025!».\n3. Una persona desconocida, sin tarjeta de visitante, camina hacia la sala de servidores.\n4. En la impresora, cinco copias de un informe marcado «DIFUSIÓN LIMITADA» desde hace dos horas.\n5. Un portátil sin candado en una mesa junto a la entrada."},{"titulo":"Configuración de los equipos","tipo":"tabla","texto":"Directiva                          Valor\nBloqueo automático por inactividad  Desactivado\nProtector de pantalla con contraseña No\nCifrado de disco en portátiles      Sí"}],"flags":[{"id":"m-puesto-f1","tipo":"user","nombre":"Flag de usuario · Pantallas abiertas","t":"unica","d":1,"q":"Con autenticidad de nivel MEDIO, ¿qué medida del ENS exige que el puesto se bloquee tras un tiempo de inactividad?","o":["mp.eq.2 Bloqueo de puesto de trabajo","mp.eq.3 Protección de dispositivos portátiles","op.exp.2 Configuración de seguridad","mp.if.1 Áreas separadas"],"c":0,"x":"mp.eq.2 depende de la autenticidad: no aplica en nivel BAJO, aplica en MEDIO y suma R1 en ALTO. Con el bloqueo automático desactivado, cualquiera que pase puede actuar con la identidad de quien dejó la sesión abierta. En la ISO/IEC 27001, lo cubre el 7.7 (pantalla limpia).","ref":"RD 311/2022, anexo II, mp.eq.2 · ISO/IEC 27001:2022, anexo A 7.7","pista":"Busca en la familia mp.eq la medida que depende de la dimensión A."},{"id":"m-puesto-f2","tipo":"user","nombre":"Flag de usuario · El pósit","t":"multiple","d":1,"q":"¿Qué controles incumple el pósit con la contraseña de administración?","o":["5.17 Información de autenticación","7.7 Puesto despejado y pantalla limpia","8.2 Derechos de acceso privilegiados","8.23 Filtrado web"],"c":[0,1,2],"x":"La información de autenticación debe protegerse (5.17), no debe quedar nada a la vista en el puesto (7.7) y una cuenta de administración compartida y expuesta contradice la gestión de accesos privilegiados (8.2). El filtrado web no tiene relación.","ref":"ISO/IEC 27001:2022, anexo A 5.17, 7.7 y 8.2","pista":"Es una contraseña, está a la vista y es de administrador."},{"id":"m-puesto-f3","tipo":"user","nombre":"Flag de usuario · El visitante","t":"unica","d":2,"q":"Una persona sin identificar se dirige a la sala de servidores. ¿Qué medidas del ENS se ven afectadas?","o":["mp.if.1 Áreas separadas y con control de acceso, y mp.if.2 Identificación de las personas","mp.s.1 Protección del correo electrónico","op.cont.4 Medios alternativos","mp.info.3 Firma electrónica"],"c":0,"x":"Las dos se aplican en todas las categorías: las áreas con equipamiento deben estar separadas y con acceso controlado (mp.if.1) y debe identificarse a todas las personas que acceden (mp.if.2). En la ISO/IEC 27001, los controles 7.1, 7.2 y 7.3.","ref":"RD 311/2022, anexo II, mp.if.1 y mp.if.2 · ISO/IEC 27001:2022, anexo A 7.2","pista":"Familia mp.if: instalaciones e infraestructuras."},{"id":"m-puesto-f4","tipo":"root","nombre":"Flag de root · Lo que está bien","t":"unica","d":2,"q":"De todo lo observado, ¿qué está correctamente resuelto?","o":["El cifrado de disco de los portátiles, que protege la información si alguien se lleva el de la entrada","La impresora","El bloqueo de pantalla","El control del visitante"],"c":0,"x":"Un buen auditor también registra lo que funciona. Con cifrado de disco, el robo del portátil desatendido expone el equipo, pero no la información (mp.eq.3 en el ENS; 8.1 y 8.24 en la ISO). Aun así, el puesto despejado pide no dejarlo a la vista sin anclaje.","ref":"RD 311/2022, anexo II, mp.eq.3 · ISO/IEC 27001:2022, anexo A 8.1","pista":"Mira la tabla de configuración: hay un «Sí»."},{"id":"m-puesto-f5","tipo":"root","nombre":"Flag de root · Prioridad","t":"unica","d":2,"q":"Tienes una hora con el responsable de seguridad. ¿Por dónde empiezas?","o":["Por la impresora","Por la cuenta de administración expuesta: cambiar la contraseña ya, retirar cuentas compartidas y revisar quién la ha usado","Por el portátil cifrado","Por redactar una nueva política de escritorio"],"c":1,"x":"Prioriza por riesgo: una credencial de administración a la vista da control total del sistema y puede estar ya comprometida. Se cambia, se revisan los registros de uso y se sustituye la cuenta compartida por cuentas nominales. Después vienen el bloqueo automático, el control de visitantes y la impresión segura.","ref":"ISO/IEC 27001:2022, anexo A 5.17 y 8.2 · RD 311/2022, op.acc.6","pista":"¿Qué hallazgo da más poder a un atacante?"}]},{"id":"m-nube","nombre":"El contrato de nube","dificultad":"Fácil","icono":"handshake","marcos":["ENS","27001"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"Arcadia va a contratar a NimboCloud (ficticio) para alojar su plataforma de ayudas, de categoría MEDIA. Te piden revisar el borrador del contrato antes de firmarlo.","evidencias":[{"titulo":"Borrador del contrato (extracto)","tipo":"doc","texto":"Cláusula 4. Disponibilidad: «El proveedor hará sus mejores esfuerzos por mantener el servicio disponible».\nCláusula 7. Subcontratación: «El proveedor podrá subcontratar libremente parte del servicio».\nCláusula 9. Ubicación de los datos: no se indica.\nCláusula 11. Incidentes: «El proveedor informará de los incidentes que considere relevantes».\nCláusula 13. Fin del contrato: no se regula la devolución ni el borrado de los datos.\nNo se menciona el ENS."},{"titulo":"Ficha del proveedor","tipo":"nota","texto":"NimboCloud declara tener certificación ISO/IEC 27001 (alcance: «servicios corporativos internos»). No aporta declaración ni certificación de conformidad con el ENS. No ha designado un punto de contacto de seguridad."}],"flags":[{"id":"m-nube-f1","tipo":"user","nombre":"Flag de usuario · La obligación","t":"unica","d":1,"q":"¿Qué debe exigir el pliego o el contrato al proveedor, según el ENS?","o":["Nada: el ENS solo obliga a la Administración","Los requisitos necesarios para asegurar la conformidad con el ENS del sistema que presta el servicio, como su declaración o certificación de conformidad","Solo un precio cerrado","Que el proveedor sea español"],"c":1,"x":"El artículo 2.3 obliga a incluir en los pliegos los requisitos para asegurar la conformidad con el ENS de los sistemas de los contratistas, como las declaraciones o certificaciones de conformidad, y a extenderlo a su cadena de suministro según el análisis de riesgos.","ref":"RD 311/2022, art. 2.3","cita":"Los pliegos de prescripciones administrativas o técnicas de los contratos que celebren las entidades del sector público incluidas en el ámbito de aplicación de este real decreto contemplarán todos aquellos requisitos necesarios para asegurar la conformidad con el ENS de los sistemas de información en los que se sustenten los servicios prestados por los contratistas","pista":"Lee el artículo 2.3, párrafo de los pliegos."},{"id":"m-nube-f2","tipo":"user","nombre":"Flag de usuario · El certificado","t":"unica","d":2,"q":"¿Por qué la certificación ISO/IEC 27001 de NimboCloud no basta aquí?","o":["Porque la ISO no vale en España","Porque su alcance son «servicios corporativos internos», no el servicio de nube que se contrata, y además no cubre la conformidad con el ENS","Porque caduca cada año","Sí basta"],"c":1,"x":"Lo primero que se mira de un certificado es el alcance: si no incluye el servicio contratado, no aporta garantías sobre él. Y aunque lo incluyera, la ISO no sustituye la conformidad con el ENS (CCN-STIC 825), que es lo que exige el artículo 2.3.","ref":"CCN-STIC 825, apdo. 4.2 · ISO/IEC 27001:2022, cláusula 4.3","pista":"Lee con calma la palabra entre paréntesis de la ficha."},{"id":"m-nube-f3","tipo":"user","nombre":"Flag de usuario · El contacto","t":"unica","d":1,"q":"¿Qué figura debe designar NimboCloud, salvo causa justificada y documentada?","o":["Un auditor interno","Un POC (punto o persona de contacto) para la seguridad del servicio","Un delegado sindical","Un responsable de la información"],"c":1,"x":"El artículo 13.5 exige al prestatario de servicios externalizados un POC de seguridad con apoyo de la dirección, que canalice el cumplimiento, las comunicaciones de seguridad y la gestión de incidentes del servicio.","ref":"RD 311/2022, art. 13.5","pista":"Artículo 13, servicios externalizados."},{"id":"m-nube-f4","tipo":"root","nombre":"Flag de root · Las cláusulas","t":"multiple","d":2,"q":"¿Qué cláusulas hay que reescribir antes de firmar?","o":["Disponibilidad: un ANS medible, con penalizaciones","Subcontratación: con autorización previa y los mismos requisitos para los subcontratistas","Incidentes: notificación de todos los incidentes que afecten al servicio, con plazos","Fin del contrato: devolución en formato utilizable y borrado certificado de los datos","Ninguna: «mejores esfuerzos» e «incidentes que considere relevantes» son fórmulas habituales y suficientes"],"c":[0,1,2,3],"x":"Las cuatro cláusulas del borrador son deficientes, por habituales que sean esas fórmulas. Un ANS medible (op.ext.1), el control de la cadena de suministro (art. 2.3; ISO 5.21), la notificación de incidentes con plazos (op.ext.2; ISO 5.20) y la salida ordenada del servicio en la nube (ISO 5.23) son contenidos básicos de un contrato de servicio TIC.","ref":"RD 311/2022, op.ext.1 y art. 2.3 · ISO/IEC 27001:2022, anexo A 5.20, 5.21 y 5.23","pista":"Ninguna de las cuatro cláusulas del borrador protege a Arcadia."},{"id":"m-nube-f5","tipo":"root","nombre":"Flag de root · La ubicación","t":"unica","d":2,"q":"La plataforma trata datos personales de solicitantes de ayudas. ¿Por qué importa la cláusula 9 vacía?","o":["No importa","Porque hay que saber dónde se tratan los datos: las transferencias fuera del Espacio Económico Europeo tienen requisitos específicos del RGPD, y el proveedor actúa como encargado del tratamiento con su contrato","Porque el ENS prohíbe la nube","Porque encarece el servicio"],"c":1,"x":"Sin ubicación pactada no se puede valorar si hay transferencias internacionales (RGPD, capítulo V) ni cumplir el contrato de encargo del tratamiento (art. 28 RGPD). El ENS no prohíbe la nube: op.nub.1 regula cómo protegerla.","ref":"Reglamento (UE) 2016/679, arts. 28 y 44 · RD 311/2022, op.nub.1","pista":"Datos personales + nube + ubicación desconocida."}]},{"id":"m-categoria","nombre":"La categoría de Arcadia","dificultad":"Media","icono":"scale","marcos":["ENS"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"El Consorcio Digital de Arcadia gestiona la sede electrónica y la plataforma de ayudas sociales de varios municipios. Los responsables han valorado la información y los servicios. Tu misión es determinar la categoría y las consecuencias que tiene.","evidencias":[{"titulo":"Valoración de la información","tipo":"tabla","texto":"Información                     C       I       T       A\nSolicitudes de ayudas sociales  ALTO    MEDIO   MEDIO   MEDIO\nPublicaciones del tablón        —       MEDIO   BAJO    MEDIO\nEstadísticas anónimas           BAJO    BAJO    —       BAJO"},{"titulo":"Valoración de los servicios","tipo":"tabla","texto":"Servicio                        D       RTO acordado\nSede electrónica                MEDIO   12 horas\nPlataforma de ayudas            MEDIO   18 horas (plazo legal de resolución no crítico)\nPortal de transparencia         BAJO    3 días"},{"titulo":"Acta del comité de seguridad","tipo":"nota","texto":"«El responsable del sistema propone rebajar la confidencialidad de las solicitudes de ayuda a MEDIO \"para ahorrar costes\". Se acuerda que la categoría del sistema sea MEDIA.»"}],"flags":[{"id":"m-categoria-f1","tipo":"user","nombre":"Flag de usuario · La categoría","t":"unica","d":1,"q":"Con la valoración tal y como está en las tablas, ¿qué categoría tiene el sistema?","o":["BÁSICA","MEDIA","ALTA","No se puede determinar"],"c":2,"x":"La confidencialidad de las solicitudes de ayudas es ALTO y basta una dimensión en ALTO para que el sistema sea de categoría ALTA. El acta acordó MEDIA sin cambiar formalmente la valoración, lo cual es incoherente.","ref":"RD 311/2022, anexo I.4","pista":"Busca el nivel más alto de cualquier dimensión en las dos tablas."},{"id":"m-categoria-f2","tipo":"user","nombre":"Flag de usuario · ¿Quién decide?","t":"unica","d":2,"q":"¿Qué problema de facultades hay en el acta del comité?","o":["Ninguno: el comité decide todo","Rebajar la confidencialidad corresponde al responsable de la información, no al responsable del sistema, y no se puede hacer por motivos de coste sin cambiar la valoración del impacto","Debería haberlo decidido el auditor","Debería haberlo decidido el CCN"],"c":1,"x":"Valorar (y modificar la valoración) corresponde al responsable de la información o del servicio (art. 41.1). Además, la valoración se basa en el impacto de un incidente, no en el coste de protegerse. Abaratar la categoría bajando la valoración sin justificación es un hallazgo grave.","ref":"RD 311/2022, art. 41 y anexo I.3","pista":"Lee el artículo 41: quién valora y quién determina la categoría."},{"id":"m-categoria-f3","tipo":"user","nombre":"Flag de usuario · Disponibilidad","t":"unica","d":2,"q":"Con la disponibilidad tal como está valorada (máximo MEDIO), ¿qué medidas op.cont son exigibles?","o":["Ninguna","Solo op.cont.1 (análisis de impacto)","op.cont.1 a op.cont.4","op.cont.2 y op.cont.3"],"c":1,"x":"Las medidas op.cont dependen del nivel de disponibilidad, no de la categoría. Con D en MEDIO solo aplica op.cont.1. Aunque el sistema sea de categoría ALTA por confidencialidad, no se exigen op.cont.2 a 4.","ref":"RD 311/2022, anexo II, op.cont · anexo I.4.2","pista":"La tercera columna de op.cont indica «D»: ¿qué nivel de D hay?"},{"id":"m-categoria-f4","tipo":"root","nombre":"Flag de root · Coherencia del RTO","t":"unica","d":3,"q":"Según la tabla orientativa de la CCN-STIC 803, ¿qué nivel corresponde a un RTO de 12 horas para la sede electrónica?","o":["BAJO","MEDIO (entre 4 horas y 1 día)","ALTO","No hay relación entre RTO y nivel"],"c":1,"x":"La 803 propone: menos de 4 horas, ALTO; entre 4 horas y 1 día, MEDIO; entre 1 y 5 días, BAJO. Las 12 horas encajan con D MEDIO, de modo que la valoración de la sede es coherente. El portal de transparencia, con 3 días, encaja con BAJO.","ref":"CCN-STIC 803, apdo. 2.2.2","pista":"Recuerda los cortes de la tabla: 4 horas, 1 día y 5 días."},{"id":"m-categoria-f5","tipo":"root","nombre":"Flag de root · Consecuencias","t":"multiple","d":3,"q":"Si el sistema es de categoría ALTA, ¿qué consecuencias tiene?","o":["Necesita una auditoría de certificación de conformidad, no basta la autoevaluación","El análisis de riesgos de op.pl.1 debe ser formal (R2), con asunción formal del riesgo residual","Su disponibilidad pasa automáticamente a nivel ALTO","Ante deficiencias graves, el responsable del sistema puede suspender temporalmente su operación"],"c":[0,1,3],"x":"Categoría ALTA: certificación por auditoría (art. 38), análisis de riesgos formal (op.pl.1 R2) y posibilidad de suspender la operación ante deficiencias graves (art. 31.6). La categoría no eleva los niveles de las dimensiones que no influyeron en ella (anexo I.4.2).","ref":"RD 311/2022, arts. 31.6 y 38 · anexo I.4.2 · op.pl.1","pista":"Una de las cuatro confunde categoría con nivel de una dimensión."}]},{"id":"m-ransom","nombre":"Noche de ransomware","dificultad":"Media","icono":"zap","marcos":["ENS","27001","BCM"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"Viernes, 23:10. El SOC de Arcadia detecta cifrado masivo en los servidores de la plataforma de ayudas. Sigues la cronología del incidente y decides en cada punto como miembro del comité de crisis.","evidencias":[{"titulo":"Cronología","tipo":"log","texto":"23:10  Alerta del EDR: cifrado de ficheros en 14 servidores.\n23:25  El técnico de guardia apaga dos servidores. No queda registro de cuáles.\n00:40  El responsable de seguridad confirma ransomware. Nadie avisa a la dirección «para no despertarles».\n03:00  Se descubre que las copias de la NAS también están cifradas.\n09:00  El comité de crisis se reúne por primera vez.\n09:30  Sistemas propone restaurar desde la copia offline del miércoles y volver a producción «cuanto antes».\n11:00  Una periodista pregunta en redes sociales por la caída de la plataforma."},{"titulo":"BIA de la plataforma de ayudas","tipo":"tabla","texto":"Función                 MTPD     RTO      RPO\nPlataforma de ayudas    48 h     24 h     24 h\nSede electrónica        24 h     12 h     4 h"},{"titulo":"Plan de continuidad (extracto)","tipo":"doc","texto":"Criterio de activación: interrupción de un servicio crítico que previsiblemente supere el 50 % de su RTO.\nAutoridad para activar: director general o, en su ausencia, director de operaciones.\nComunicación externa: solo portavoz designado, con mensajes aprobados por el comité."}],"flags":[{"id":"m-ransom-f1","tipo":"user","nombre":"Flag de usuario · La activación","t":"unica","d":2,"q":"Según el criterio del propio plan, ¿cuándo debió activarse como muy tarde para la plataforma de ayudas?","o":["Nunca: el RTO es de 24 horas","En cuanto fue previsible superar 12 horas de interrupción (el 50 % del RTO), es decir, en la madrugada, al confirmarse el ransomware y caer las copias","Solo al llegar la periodista","A las 09:00, como se hizo"],"c":1,"x":"Con un ransomware confirmado (00:40) y las copias en línea perdidas (03:00), era previsible superar 12 horas. Esperar a las 09:00 y no avisar a quien puede activar el plan fue un fallo del proceso, no de la tecnología.","ref":"ISO 22301:2019, cláusula 8.4.2","pista":"Calcula el 50 % del RTO de la plataforma de ayudas."},{"id":"m-ransom-f2","tipo":"user","nombre":"Flag de usuario · Pérdida de datos","t":"unica","d":2,"q":"Si se restaura desde la copia offline del miércoles, ¿se cumple el RPO de 24 horas de la plataforma?","o":["Sí, de sobra","No: se pierden más de 48 horas de datos (miércoles a viernes), el doble del RPO","El RPO no aplica a ransomware","Depende del RTO"],"c":1,"x":"Del miércoles al viernes por la noche son más de 48 horas de solicitudes. El RPO era de 24 horas. Habrá que reconstruir datos por otras vías (registros de entrada, correos, papel) y la estrategia de copias debe revisarse.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 8.13","pista":"Cuenta las horas entre la copia y el incidente."},{"id":"m-ransom-f3","tipo":"user","nombre":"Flag de usuario · Evidencias","t":"unica","d":2,"q":"¿Qué error forense se cometió a las 23:25?","o":["Ninguno: apagar es lo correcto siempre","Apagar servidores sin registrarlo puede destruir evidencias volátiles y rompe la cadena de custodia; las acciones deben registrarse y seguir el procedimiento","No haber formateado los servidores","No haber llamado a la periodista"],"c":1,"x":"Contener es correcto, pero el control 5.28 pide procedimientos para identificar, recopilar y conservar evidencias. El ENS (art. 25.2 y op.exp.9) exige registrar las actuaciones. Aislar de la red suele preferirse a apagar, y siempre dejando constancia.","ref":"ISO/IEC 27001:2022, anexo A 5.28 · RD 311/2022, art. 25.2 y op.exp.9","pista":"¿Qué se pierde al apagar una máquina y qué no quedó escrito?"},{"id":"m-ransom-f4","tipo":"root","nombre":"Flag de root · Antes de volver a producción","t":"unica","d":3,"q":"Sistemas quiere volver a producción «cuanto antes» tras restaurar. ¿Qué es imprescindible antes?","o":["Nada: el tiempo apremia","Comprobar la integridad del sistema, el firmware y la configuración, cerrar el vector de entrada y, en el sector público, seguir las indicaciones del CCN-CERT sobre el riesgo de reconexión","Pagar el rescate para obtener la clave","Cambiar el nombre de los servidores"],"c":1,"x":"Restaurar sin cerrar el vector de entrada invita a un segundo cifrado. op.cont.2 R2 pide comprobar la integridad tras una caída, y el art. 33.6 del ENS atribuye al CCN-CERT determinar el riesgo de reconexión de los sistemas afectados.","ref":"RD 311/2022, art. 33.6 y op.cont.2 r2","pista":"El ENS dice quién determina técnicamente el riesgo de reconexión."},{"id":"m-ransom-f5","tipo":"root","nombre":"Flag de root · La periodista","t":"unica","d":2,"q":"¿Quién responde a la periodista y cómo?","o":["El técnico de guardia, contando lo que sabe","El portavoz designado, con un mensaje aprobado por el comité de crisis, sin especular sobre causas ni datos no confirmados","Nadie, se borra el mensaje","Cualquier empleado con redes sociales"],"c":1,"x":"El plan lo dice: solo el portavoz designado, con mensajes aprobados. Comunicar mal en una crisis amplifica el daño reputacional y puede comprometer la investigación. La ISO 22301 (8.4.3) pide procedimientos de comunicación con las partes interesadas, incluidos los medios.","ref":"ISO 22301:2019, cláusula 8.4.3","pista":"El extracto del plan ya responde a esta pregunta."}]},{"id":"m-soa","nombre":"La SoA sospechosa","dificultad":"Media","icono":"fileCheck","marcos":["ENS"],"empresa":"Hespéride Servicios Digitales, S.L. (ficticia)","brief":"Hespéride prepara su recertificación ENS de categoría MEDIA. Sus dimensiones son: C MEDIO, I MEDIO, T MEDIO, A MEDIO y D BAJO. Revisa la Declaración de Aplicabilidad antes de que llegue el auditor.","evidencias":[{"titulo":"Declaración de Aplicabilidad (extracto)","tipo":"tabla","texto":"Medida      Aplica  Justificación\nop.exp.5    No      «Nuestro sistema es estable, no hacemos cambios importantes»\nop.acc.6    No      «Usamos VPN, que ya es segura»\nmp.info.4   No      «No usamos sellos de tiempo»\nop.cont.2   No      «Disponibilidad de nivel BAJO»\nmp.eq.2     Compensada por «política verbal de bloquear el equipo al levantarse»\n\nFirmado: Responsable del Sistema"}],"flags":[{"id":"m-soa-f1","tipo":"user","nombre":"Flag de usuario · Exclusiones inválidas","t":"multiple","d":2,"q":"¿Qué exclusiones NO son válidas para este sistema?","o":["op.exp.5 Gestión de cambios","op.acc.6 Mecanismo de autenticación (usuarios de la organización)","mp.info.4 Sellos de tiempo","op.cont.2 Plan de continuidad"],"c":[0,1],"x":"op.exp.5 se exige desde la categoría MEDIA y op.acc.6 en todos los niveles: no se pueden excluir. mp.info.4 solo aplica con trazabilidad ALTA (aquí es MEDIA) y op.cont.2 solo con disponibilidad ALTA (aquí es BAJA): esas dos exclusiones sí son correctas.","ref":"RD 311/2022, anexo II, tabla de medidas","pista":"Usa la tabla del anexo II: para cada medida, mira si va por categoría o por dimensión."},{"id":"m-soa-f2","tipo":"user","nombre":"Flag de usuario · La firma","t":"unica","d":1,"q":"¿Quién debe firmar la Declaración de Aplicabilidad?","o":["El responsable del sistema","El responsable de la seguridad","El director general","El auditor"],"c":1,"x":"El artículo 28.2 indica que la Declaración de Aplicabilidad la firma el responsable de la seguridad. Que la firme el responsable del sistema contradice además la diferenciación de responsabilidades.","ref":"RD 311/2022, art. 28.2","cita":"La relación de medidas de seguridad seleccionadas se formalizará en un documento denominado Declaración de Aplicabilidad, firmado por el responsable de la seguridad.","pista":"Busca en el artículo 28 quién firma ese documento."},{"id":"m-soa-f3","tipo":"user","nombre":"Flag de usuario · La VPN","t":"unica","d":2,"q":"La justificación de op.acc.6 dice «usamos VPN». ¿Qué falla en ese razonamiento?","o":["Nada, la VPN sustituye la autenticación","La VPN cifra el canal, pero no sustituye la autenticación de los usuarios; además, el acceso por VPN desde Internet exige doble factor (op.acc.6 R8)","La VPN está prohibida en el ENS","Solo falla si la VPN es gratuita"],"c":1,"x":"Cifrar el túnel protege la confidencialidad del tráfico, pero no identifica ni autentica a la persona. Precisamente para el acceso desde zonas no controladas como Internet, op.acc.6 R8 exige doble factor en todos los niveles.","ref":"RD 311/2022, anexo II, op.acc.6 r8","pista":"¿Qué protege una VPN y qué no?"},{"id":"m-soa-f4","tipo":"root","nombre":"Flag de root · La medida compensatoria","t":"unica","d":3,"q":"¿Es válida la «política verbal» como medida compensatoria de mp.eq.2?","o":["Sí, si todos la conocen","No: una medida compensatoria debe justificarse documentalmente demostrando que protege igual o mejor, reflejarse en la Declaración de Aplicabilidad con su correspondencia y aprobarla formalmente el responsable de la seguridad","Sí, porque mp.eq.2 es opcional","No, porque las medidas compensatorias están prohibidas"],"c":1,"x":"El artículo 28.3 permite medidas compensatorias con condiciones. Una costumbre verbal no se puede evidenciar, no protege igual que un bloqueo automático y no tiene aprobación formal. Además, mp.eq.2 aplica con autenticidad MEDIO, como aquí.","ref":"RD 311/2022, art. 28.3 y anexo II, mp.eq.2","pista":"Artículo 28.3: tres condiciones."},{"id":"m-soa-f5","tipo":"root","nombre":"Flag de root · Gestión de cambios","t":"unica","d":3,"q":"Para cumplir op.exp.5, ¿qué debe tener Hespéride como mínimo?","o":["Un único administrador que haga todos los cambios","Un procedimiento de gestión de cambios con evaluación de su impacto en la seguridad, aprobación y registro antes de aplicarlos","Una herramienta de tickets cualquiera","Congelar el sistema para no hacer cambios"],"c":1,"x":"La gestión de cambios exige que los cambios se planifiquen, se valore su efecto en la seguridad, se autoricen y se registren. «No hacemos cambios importantes» no es una justificación: hasta un parche es un cambio. En la ISO/IEC 27001 equivale al control 8.32.","ref":"RD 311/2022, anexo II, op.exp.5 · ISO/IEC 27001:2022, anexo A 8.32","pista":"¿Qué debe ocurrir antes de tocar producción?"}]},{"id":"m-despliegue","nombre":"Viernes de despliegue","dificultad":"Media","icono":"sliders","marcos":["27001","ENS"],"empresa":"Instituto Pegaso de Formación, S.L. (ficticio)","brief":"Viernes, 18:40. Un desarrollador de Pegaso sube a producción una nueva versión del campus virtual. A las 19:05 la plataforma cae justo antes de un examen con 2.300 alumnos conectados. Reconstruye qué falló.","evidencias":[{"titulo":"Historial del despliegue","tipo":"log","texto":"18:38  dev.aruiz   git push origin main\n18:40  dev.aruiz   ssh prod-campus-01   (acceso con su usuario de desarrollo)\n18:41  dev.aruiz   ./deploy.sh --skip-tests\n18:44  dev.aruiz   ALTER TABLE examenes ... (migración manual)\n19:05  monitor     HTTP 500 en el 98 % de las peticiones\n19:40  sistemas    intento de vuelta atrás: «no hay copia previa de la base de datos»"},{"titulo":"Procedimiento de cambios (vigente)","tipo":"doc","texto":"Todo cambio en producción requiere: petición registrada, evaluación de riesgo, pruebas en preproducción, aprobación del responsable de sistemas y plan de vuelta atrás.\nNo se despliega los viernes después de las 15:00 ni durante exámenes."},{"titulo":"Matriz de accesos","tipo":"tabla","texto":"Rol             Desarrollo  Preproducción  Producción\nDesarrollador   Total       Total          Total\nSistemas        Lectura     Total          Total"}],"flags":[{"id":"m-despliegue-f1","tipo":"user","nombre":"Flag de usuario · El procedimiento","t":"multiple","d":2,"q":"¿Qué pasos del procedimiento de cambios se saltaron?","o":["Pruebas en preproducción (se usó --skip-tests)","Aprobación del responsable de sistemas","Plan de vuelta atrás con copia previa","El registro de la petición en el repositorio"],"c":[0,1,2],"x":"El procedimiento existía y era bueno: lo que falló fue su cumplimiento. No hubo pruebas, ni aprobación, ni copia previa para volver atrás, y además se desplegó en una ventana prohibida. Un push a Git no es una petición de cambio registrada y evaluada.","ref":"ISO/IEC 27001:2022, anexo A 8.32 · RD 311/2022, op.exp.5","pista":"Compara el historial con los cinco requisitos del procedimiento."},{"id":"m-despliegue-f2","tipo":"user","nombre":"Flag de usuario · La matriz","t":"unica","d":2,"q":"¿Qué problema de fondo muestra la matriz de accesos?","o":["Que sistemas tiene demasiado acceso a desarrollo","Que los desarrolladores tienen acceso total a producción, sin segregación de funciones ni separación de entornos","Que falta un entorno de pruebas","Ninguno"],"c":1,"x":"Quien desarrolla no debería poder desplegar ni tocar la base de datos de producción sin control. Lo exigen la segregación de funciones (ISO 5.3; ENS op.acc.3 desde el nivel MEDIO), la separación de entornos (8.31) y la gestión de accesos privilegiados (8.2).","ref":"ISO/IEC 27001:2022, anexo A 5.3, 8.2 y 8.31 · RD 311/2022, op.acc.3","pista":"Mira la fila del desarrollador, columna de producción."},{"id":"m-despliegue-f3","tipo":"user","nombre":"Flag de usuario · Sin vuelta atrás","t":"unica","d":2,"q":"A las 19:40 no hay copia previa. ¿Qué control debió garantizarla?","o":["8.13 Copias de seguridad de la información, junto con el plan de vuelta atrás del cambio (8.32)","7.7 Puesto despejado","5.7 Inteligencia de amenazas","6.1 Investigación de antecedentes"],"c":0,"x":"Antes de una migración irreversible hay que tener una copia restaurable y un plan de vuelta atrás probado. Sin ella, el cambio convierte un fallo de despliegue en una pérdida de disponibilidad, y quizá de datos.","ref":"ISO/IEC 27001:2022, anexo A 8.13 y 8.32","pista":"¿Qué necesitas para deshacer un ALTER TABLE?"},{"id":"m-despliegue-f4","tipo":"root","nombre":"Flag de root · ¿Incidente?","t":"unica","d":3,"q":"¿Debe gestionarse la caída como un incidente de seguridad de la información?","o":["No: es un fallo técnico, no un ataque","Sí: ha afectado a la disponibilidad de un servicio, y la seguridad de la información incluye la disponibilidad; se gestiona, registra y analiza como tal","Solo si hubo robo de datos","Solo si lo pide un alumno"],"c":1,"x":"Un incidente no requiere atacante: basta con que comprometa la confidencialidad, la integridad o la disponibilidad. Debe registrarse y gestionarse (5.24 a 5.27) para aprender de él. Si afectara a datos personales, habría que valorar además el RGPD.","ref":"ISO/IEC 27001:2022, anexo A 5.24 a 5.27","pista":"C, I y… ¿cuál se ha visto afectada?"},{"id":"m-despliegue-f5","tipo":"root","nombre":"Flag de root · Lección aprendida","t":"multiple","d":3,"q":"¿Qué acciones correctivas atacan las causas y no solo el efecto?","o":["Retirar el acceso de escritura a producción a los desarrolladores y desplegar solo mediante un pipeline con aprobación","Hacer obligatorias las pruebas y la copia previa en el propio pipeline, sin opción de saltarlas","Bloquear técnicamente los despliegues en las ventanas prohibidas","Restaurar el servicio y volver a abrir el examen"],"c":[0,1,2],"x":"Restaurar el servicio es la corrección. Las acciones correctivas convierten el procedimiento en controles técnicos que no dependan de la buena voluntad: segregación de funciones, pipeline con aprobación y pruebas obligatorias, y ventanas de cambio forzadas.","ref":"ISO/IEC 27001:2022, cláusula 10.2 y anexo A 5.3, 8.31 y 8.32","pista":"Un procedimiento que se puede saltar con un parámetro no es un control."}]},{"id":"m-bia","nombre":"El BIA de Pegaso","dificultad":"Media","icono":"hourglass","marcos":["BCM","27001"],"empresa":"Instituto Pegaso de Formación, S.L. (ficticio)","brief":"Pegaso ha hecho su primer análisis de impacto (BIA) y quiere saber si su infraestructura actual cumple los objetivos. Cruza las tablas y encuentra los huecos.","evidencias":[{"titulo":"BIA · funciones","tipo":"tabla","texto":"Función                 MTPD    RTO     RPO     Depende de\nCampus virtual          24 h    8 h     1 h     BBDD alumnos, servidor web\nMatrícula               72 h    24 h    4 h     BBDD alumnos, pasarela de pago\nEmisión de títulos      10 días 5 días  24 h    BBDD alumnos, firma electrónica\nCorreo corporativo      48 h    48 h    24 h    servicio de correo en la nube"},{"titulo":"Recursos · capacidades reales","tipo":"tabla","texto":"Recurso                 Recuperación probada   Copias\nBBDD alumnos            12 h                   cada 24 h\nServidor web            2 h                    imagen diaria\nPasarela de pago        proveedor (ANS 4 h)    —\nFirma electrónica       proveedor (ANS 24 h)   —\nCorreo en la nube       proveedor (ANS 8 h)    retención 30 días"}],"flags":[{"id":"m-bia-f1","tipo":"user","nombre":"Flag de usuario · El campus","t":"unica","d":2,"q":"¿Cumple el campus virtual su RTO de 8 horas?","o":["Sí, el servidor web se recupera en 2 horas","No: depende de la base de datos de alumnos, que tarda 12 horas en recuperarse","Sí, porque el MTPD es de 24 horas","No se puede saber"],"c":1,"x":"Una función no se recupera antes que su dependencia más lenta. La base de datos tarda 12 horas y el RTO es de 8: no se cumple. Que siga por debajo del MTPD (24 horas) evita lo inaceptable, pero el objetivo comprometido no se alcanza.","ref":"ISO 22301:2019, cláusulas 8.2.2 y 8.3","pista":"Busca la dependencia más lenta."},{"id":"m-bia-f2","tipo":"user","nombre":"Flag de usuario · Los datos","t":"multiple","d":2,"q":"¿Qué funciones NO cumplen su RPO con copias de la base de datos cada 24 horas?","o":["Campus virtual (RPO 1 h)","Matrícula (RPO 4 h)","Emisión de títulos (RPO 24 h)","Ninguna"],"c":[0,1],"x":"Con copias diarias se pueden perder hasta 24 horas de datos. Eso cumple el RPO de 24 horas de la emisión de títulos, pero no los de 1 y 4 horas del campus y la matrícula. Hace falta replicación o copias mucho más frecuentes de la base de datos.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 8.13","pista":"Compara la frecuencia de copia con cada RPO."},{"id":"m-bia-f3","tipo":"user","nombre":"Flag de usuario · Coherencia","t":"unica","d":2,"q":"¿Qué fila del BIA tiene un problema de coherencia interna?","o":["Campus virtual","Matrícula","Emisión de títulos","Correo corporativo: su RTO es igual a su MTPD, sin ningún margen"],"c":3,"x":"El RTO debe quedar por debajo del MTPD, con margen para imprevistos. Un RTO de 48 horas con un MTPD de 48 horas significa recuperar justo cuando el impacto se vuelve inaceptable: cualquier retraso lo supera.","ref":"ISO 22301:2019, cláusula 8.2.2","pista":"Recuerda la regla RTO < MTPD."},{"id":"m-bia-f4","tipo":"root","nombre":"Flag de root · La estrategia","t":"unica","d":3,"q":"¿Qué estrategia resuelve a la vez los dos huecos del campus (RTO y RPO)?","o":["Copias semanales en cinta","Replicación de la base de datos de alumnos a un sitio secundario (warm o hot) con conmutación probada, que baje la recuperación por debajo de 8 horas y la pérdida por debajo de 1 hora","Pedir a los alumnos que no se conecten","Ampliar el RTO a 12 horas sin consultar"],"c":1,"x":"La base de datos es el cuello de botella de tiempo y de datos. La replicación a un sitio secundario reduce a la vez el tiempo de recuperación y la pérdida de datos. La elección entre warm y hot depende del coste frente al impacto del BIA. Ampliar el RTO solo es legítimo si lo decide la dirección con el BIA en la mano.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 8.14","pista":"Ataca el recurso compartido por ambos huecos."},{"id":"m-bia-f5","tipo":"root","nombre":"Flag de root · Los proveedores","t":"unica","d":3,"q":"La emisión de títulos depende de una firma electrónica con un ANS de 24 horas. ¿Es un riesgo para su RTO de 5 días?","o":["Sí, es grave","No para el RTO, que tiene margen; pero conviene verificar que el proveedor cumple su ANS y tiene su propio plan de continuidad","No, los proveedores no forman parte del BIA","Sí, hay que cambiar de proveedor"],"c":1,"x":"Un ANS de 24 horas cabe holgadamente en un RTO de 5 días. Aun así, la ISO 22301 pide considerar los proveedores en la estrategia: un ANS sin evidencias de continuidad del proveedor es una promesa, no una capacidad (ISO/IEC 27001 5.22).","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 5.22","pista":"Compara 24 horas con 5 días, y luego piensa en las evidencias."}]},{"id":"m-auditoria","nombre":"Auditoría de certificación","dificultad":"Difícil","icono":"clipboard","marcos":["27001","ENS"],"empresa":"Hespéride Servicios Digitales, S.L. (ficticia)","brief":"Eres auditora jefe en la etapa 2 de la certificación ISO/IEC 27001 de Hespéride, que también quiere usar el trabajo para su certificación ENS de categoría MEDIA. Tienes cinco evidencias sobre la mesa. Clasifica y decide.","evidencias":[{"titulo":"E1 · Revisión por la dirección","tipo":"nota","texto":"No hay acta de revisión por la dirección. El director dice: «Lo hablamos en el comité de dirección, pero no se levanta acta de esos temas»."},{"titulo":"E2 · Declaración de Aplicabilidad","tipo":"tabla","texto":"Control  Aplica  Justificación\n8.28     No      «No aplica»\n7.4      No      «No aplica»\n5.23     Sí      Implantado\n(Hespéride desarrolla internamente su gestor de expedientes y aloja copias en un proveedor de nube.)"},{"titulo":"E3 · Auditoría interna","tipo":"doc","texto":"Programa 2025: auditoría interna completa realizada en mayo por el responsable de seguridad, que también diseñó e implantó la mayoría de los controles."},{"titulo":"E4 · Riesgos","tipo":"tabla","texto":"Riesgo R-12 (fuga por proveedor de nube): nivel ALTO. Tratamiento: aceptar. Aprobado por: técnico de sistemas. Dueño del riesgo según el registro: director de operaciones."},{"titulo":"E5 · Formación","tipo":"nota","texto":"Plan de concienciación anual. Asistencia: 92 % de la plantilla, con registros firmados. Dos personas de nueva incorporación aún no lo han recibido (incorporadas hace 3 semanas; el procedimiento da 2 meses)."}],"flags":[{"id":"m-auditoria-f1","tipo":"user","nombre":"Flag de usuario · E1","t":"unica","d":2,"q":"¿Cómo se clasifica E1?","o":["Conformidad","Observación","No conformidad mayor: no hay evidencia de revisión por la dirección (9.3), que debe conservarse como información documentada","No conformidad menor"],"c":2,"x":"La 9.3 exige revisar el SGSI a intervalos planificados con unas entradas mínimas y conservar evidencias de los resultados. Sin ningún registro, para el auditor no ha ocurrido: falta un requisito completo, así que es mayor.","ref":"ISO/IEC 27001:2022, cláusula 9.3","pista":"«Lo hablamos» no es información documentada."},{"id":"m-auditoria-f2","tipo":"user","nombre":"Flag de usuario · E2","t":"multiple","d":3,"q":"¿Qué problemas tiene la SoA de E2?","o":["Excluir 8.28 (codificación segura) no tiene sentido: la organización desarrolla software","Las exclusiones solo dicen «No aplica», sin justificación","Incluir 5.23 es correcto: usa servicios en la nube","Excluir 7.4 está prohibido siempre"],"c":[0,1,2],"x":"Las exclusiones deben justificarse (6.1.3 d) y ser coherentes con la realidad: si desarrollan su gestor, 8.28 aplica. 5.23 está bien incluido. 7.4 podría excluirse con una justificación razonable (por ejemplo, sin instalaciones propias de tratamiento), pero no con un simple «No aplica».","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 d)","pista":"Una de las afirmaciones es demasiado absoluta."},{"id":"m-auditoria-f3","tipo":"user","nombre":"Flag de usuario · E3","t":"unica","d":2,"q":"¿Qué falla en E3?","o":["Nada: se hizo la auditoría","La objetividad e imparcialidad: el auditor interno auditó controles que él mismo diseñó e implantó","Que se hiciera en mayo","Que sea completa"],"c":1,"x":"La 9.2 exige auditores objetivos e imparciales, y la ISO 19011 incluye la independencia entre sus principios. Auditar el propio trabajo resta valor a los resultados. Suele clasificarse como no conformidad menor si el resto del programa existe.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2 · ISO 19011:2018, cap. 4","pista":"¿Quién auditó y qué había hecho antes?"},{"id":"m-auditoria-f4","tipo":"root","nombre":"Flag de root · E4","t":"unica","d":3,"q":"¿Qué requisito incumple E4 y por qué es especialmente grave?","o":["Ninguno: aceptar es una opción válida","6.1.3 f): el riesgo residual debe aceptarlo su dueño (director de operaciones), no un técnico; y aceptar un riesgo ALTO de un proveedor de nube sin más contradice los criterios de aceptación habituales y deja sin tratar 5.23","Que el riesgo esté en una tabla","Que el dueño sea un director"],"c":1,"x":"La aceptación del riesgo residual corresponde al dueño del riesgo. Que la firme un técnico vacía de sentido la gobernanza. Además, aceptar un riesgo ALTO exige que los criterios de aceptación lo permitan y una decisión consciente de quien tiene autoridad.","ref":"ISO/IEC 27001:2022, cláusulas 6.1.2 y 6.1.3 f)","pista":"Compara quién aprobó con quién es el dueño."},{"id":"m-auditoria-f5","tipo":"root","nombre":"Flag de root · E5 y la decisión","t":"unica","d":3,"q":"E5 muestra dos personas sin formar dentro del plazo del procedimiento. Con todo lo anterior, ¿qué recomiendas a la entidad de certificación?","o":["Certificar ya: E5 está bien y el resto son detalles","E5 es conforme. No recomendar la certificación hasta verificar la corrección y la acción correctiva de la no conformidad mayor (E1); las menores, con plan de acción aceptado","Denegar para siempre","Certificar solo en el ENS"],"c":1,"x":"E5 cumple el procedimiento (plazo de 2 meses no vencido). Con una no conformidad mayor abierta (E1), la entidad debe verificar su corrección antes de decidir. Las menores (E3 y, según el criterio, E2 y E4) requieren un plan de acción aceptado. E4 podría considerarse mayor si se viera sistémico.","ref":"ISO/IEC 17021-1 (decisión de certificación) · ISO/IEC 27001:2022, cláusulas 9.3 y 10.2","pista":"Una no conformidad mayor abierta bloquea la decisión de certificación."}]},{"id":"m-magerit","nombre":"Riesgo en euros","dificultad":"Difícil","icono":"gauge","marcos":["ENS","27001"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"El comité de seguridad de Arcadia quiere decidir con números. Con un modelo cuantitativo al estilo del libro III de MAGERIT (impacto = valor × degradación; riesgo = impacto × frecuencia anual), calcula y decide.","evidencias":[{"titulo":"Activos y amenazas","tipo":"tabla","texto":"Activo                      Valor       Amenaza                         Degradación   Frecuencia anual\nBBDD de ayudas [D]          400.000 €   [A.24] Denegación de servicio   10 %          2\nBBDD de ayudas [D]          400.000 €   [A.11] Acceso no autorizado     50 %          0,2\nSede electrónica [S]        150.000 €   [E.2] Errores del administrador 20 %          1\nPortátiles [HW]              20.000 €   [A.25] Robo                     100 %         0,5"},{"titulo":"Salvaguarda propuesta","tipo":"doc","texto":"Doble factor y monitorización de accesos para la BBDD de ayudas.\nCoste anual: 30.000 €.\nEfecto estimado: reduce la frecuencia del acceso no autorizado de 0,2 a 0,04 al año.\nCriterio de aceptación de Arcadia: riesgo residual por amenaza ≤ 10.000 € al año, aceptado por el responsable de la información."}],"flags":[{"id":"m-magerit-f1","tipo":"user","nombre":"Flag de usuario · El mayor riesgo","t":"unica","d":2,"q":"¿Qué pareja activo-amenaza tiene el mayor riesgo anual?","o":["BBDD de ayudas · denegación de servicio (80.000 €)","BBDD de ayudas · acceso no autorizado (40.000 €)","Sede · errores del administrador (30.000 €)","Portátiles · robo (10.000 €)"],"c":0,"x":"Riesgo = valor × degradación × frecuencia. Denegación: 400.000 × 0,10 × 2 = 80.000 €. Acceso no autorizado: 400.000 × 0,50 × 0,2 = 40.000 €. Errores: 150.000 × 0,20 × 1 = 30.000 €. Robo: 20.000 × 1 × 0,5 = 10.000 €.","ref":"MAGERIT v3, libro III, apdo. 2.2.2 (modelo cuantitativo)","pista":"Multiplica las tres columnas numéricas de cada fila."},{"id":"m-magerit-f2","tipo":"user","nombre":"Flag de usuario · Impacto frente a riesgo","t":"unica","d":2,"q":"¿Qué amenaza tiene el mayor impacto por cada vez que ocurre?","o":["Denegación de servicio (40.000 € por ocurrencia)","Acceso no autorizado a la BBDD (200.000 € por ocurrencia)","Errores del administrador (30.000 €)","Robo de portátiles (20.000 €)"],"c":1,"x":"Impacto = valor × degradación: el acceso no autorizado causa 200.000 € cada vez que ocurre, aunque su frecuencia es baja. Por eso un riesgo medio puede esconder un impacto catastrófico: el comité debe mirar las dos cifras, no solo el riesgo anual.","ref":"MAGERIT v3, libro I y libro III, apdo. 2.2.2","pista":"El impacto no tiene en cuenta la frecuencia."},{"id":"m-magerit-f3","tipo":"user","nombre":"Flag de usuario · La salvaguarda","t":"unica","d":3,"q":"Tras el doble factor, ¿cuál es el riesgo residual del acceso no autorizado y cuánto se ahorra al año frente a su coste?","o":["Residual 8.000 €; reduce 32.000 € de riesgo por 30.000 € de coste: compensa por poco","Residual 0 €","Residual 40.000 €: no cambia","Residual 32.000 €"],"c":0,"x":"Residual = 400.000 × 0,50 × 0,04 = 8.000 €. La reducción es 40.000 − 8.000 = 32.000 € al año, por un coste de 30.000 €. Compensa económicamente, y además deja el residual dentro del criterio de aceptación (≤ 10.000 €).","ref":"MAGERIT v3, libro III, apdos. 2.2.2 y 2.2.4","pista":"Recalcula con la nueva frecuencia."},{"id":"m-magerit-f4","tipo":"root","nombre":"Flag de root · Aceptar o tratar","t":"multiple","d":3,"q":"Con el criterio de aceptación de 10.000 € por amenaza, ¿qué riesgos deben tratarse sí o sí?","o":["Denegación de servicio sobre la BBDD (80.000 €)","Acceso no autorizado sin salvaguarda (40.000 €)","Errores del administrador (30.000 €)","Robo de portátiles (10.000 €)"],"c":[0,1,2],"x":"Los tres primeros superan el umbral y deben tratarse. El robo de portátiles (10.000 €) está justo en el límite (≤ 10.000 €), así que puede aceptarlo formalmente quien corresponde, el responsable de la información, dejando constancia.","ref":"MAGERIT v3, libro I · ISO/IEC 27001:2022, cláusula 6.1.3","pista":"Compara cada riesgo con el umbral, ojo con el «menor o igual»."},{"id":"m-magerit-f5","tipo":"root","nombre":"Flag de root · Lo que exige el ENS","t":"unica","d":3,"q":"Si el sistema de Arcadia es de categoría ALTA, ¿qué tipo de análisis exige op.pl.1 y qué debe hacerse con el riesgo residual?","o":["Un análisis informal en lenguaje natural","Un análisis formal (R2) con fundamento matemático reconocido internacionalmente, que valore y priorice las salvaguardas y asuma formalmente el riesgo residual","Ninguno: basta la Declaración de Aplicabilidad","Uno semiformal, sin aceptación del residual"],"c":1,"x":"Categoría ALTA: op.pl.1 + R2, análisis formal con fundamento matemático, que valore y priorice salvaguardas y asuma formalmente el riesgo residual. El modelo cuantitativo de este caso va en esa línea.","ref":"RD 311/2022, anexo II, op.pl.1 r2","pista":"Busca los refuerzos de op.pl.1."}]},{"id":"m-interna","nombre":"La auditoría interna","dificultad":"Difícil","icono":"listChecks","marcos":["27001","ENS"],"empresa":"Instituto Pegaso de Formación, S.L. (ficticio)","brief":"Te contratan para revisar cómo hace Pegaso sus auditorías internas antes del seguimiento anual de su certificación ISO/IEC 27001. Tienes el programa, el último informe y el estado de las acciones.","evidencias":[{"titulo":"Programa de auditoría 2025","tipo":"doc","texto":"Alcance: «todo el SGSI».\nFecha: una única jornada en noviembre.\nAuditor: responsable de sistemas (también responsable de las copias, los accesos y la red).\nCriterios: no indicados.\nNo se tienen en cuenta los resultados de la auditoría de 2024."},{"titulo":"Informe de auditoría 2025 (extracto)","tipo":"doc","texto":"Hallazgo 1: «Las copias funcionan bien». Evidencia: entrevista al auditor (él mismo).\nHallazgo 2: «Algunos usuarios tienen accesos de más». Sin muestra ni cifras.\nHallazgo 3: «No conformidad: el plan de concienciación está desactualizado (cláusula 7.3)». Evidencia: plan de 2022.\nConclusión: «El SGSI es eficaz»."},{"titulo":"Acciones correctivas de 2024","tipo":"tabla","texto":"NC     Acción                        Estado      Eficacia verificada\nNC-1   Revisar accesos trimestral    Cerrada     No\nNC-2   Formar al equipo de soporte   Cerrada     No\nNC-3   Actualizar el inventario      Abierta     —"}],"flags":[{"id":"m-interna-f1","tipo":"user","nombre":"Flag de usuario · El auditor","t":"unica","d":2,"q":"¿Cuál es el problema principal en la elección del auditor?","o":["Que sea interno","Que audita procesos de los que él mismo es responsable, lo que rompe la objetividad y la imparcialidad","Que no tenga una certificación de auditor jefe","Que trabaje en noviembre"],"c":1,"x":"La cláusula 9.2.2 exige objetividad e imparcialidad. El hallazgo 1 lo demuestra: la única evidencia de que las copias funcionan es la palabra del propio responsable de las copias. Los auditores internos sirven, pero no deben auditar su propio trabajo.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2 · ISO 19011:2018, cap. 4","pista":"Lee qué más responsabilidades tiene el auditor."},{"id":"m-interna-f2","tipo":"user","nombre":"Flag de usuario · El programa","t":"multiple","d":2,"q":"¿Qué le falta al programa de auditoría según la cláusula 9.2.2?","o":["Definir los criterios de auditoría","Tener en cuenta los resultados de auditorías anteriores","Un alcance y una duración proporcionados a la importancia de los procesos","Incluir auditorías sorpresa obligatorias"],"c":[0,1,2],"x":"El programa debe fijar los criterios y el alcance de cada auditoría y considerar la importancia de los procesos y los resultados anteriores. Una sola jornada para «todo el SGSI» difícilmente es proporcionada. Las auditorías sorpresa no son un requisito.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2","pista":"Uno de los cuatro no aparece en la norma."},{"id":"m-interna-f3","tipo":"user","nombre":"Flag de usuario · Hallazgos","t":"unica","d":3,"q":"¿Cuál de los tres hallazgos está bien construido?","o":["El 1, porque es positivo","El 2, porque detecta un problema real","El 3: tiene criterio (cláusula 7.3), evidencia verificable (el plan de 2022) y una clasificación","Ninguno"],"c":2,"x":"Un hallazgo resulta de comparar evidencias con criterios (ISO 19011). El 1 no tiene evidencia independiente y el 2 es vago, sin muestra ni cifras: nadie puede verificarlo ni corregirlo. El 3 cumple la estructura.","ref":"ISO 19011:2018, cap. 3 (hallazgos y evidencias)","pista":"Busca criterio y evidencia en cada uno."},{"id":"m-interna-f4","tipo":"root","nombre":"Flag de root · Acciones cerradas","t":"unica","d":3,"q":"Las NC-1 y NC-2 están cerradas sin verificar su eficacia. ¿Qué incumple?","o":["Nada, cerrarlas basta","La cláusula 10.2, que exige revisar la eficacia de las acciones correctivas, no solo ejecutarlas","La cláusula 4.3","El control 7.7"],"c":1,"x":"Cerrar una acción sin comprobar que eliminó la causa es habitual y es un hallazgo. Si la revisión trimestral de accesos funcionara, el hallazgo 2 de este año no existiría: es una pista de que la NC-1 no fue eficaz.","ref":"ISO/IEC 27001:2022, cláusula 10.2 d)","pista":"Relaciona la NC-1 con el hallazgo 2 de 2025."},{"id":"m-interna-f5","tipo":"root","nombre":"Flag de root · La conclusión","t":"unica","d":3,"q":"¿Se sostiene la conclusión «El SGSI es eficaz»?","o":["Sí, solo hay una no conformidad","No: la auditoría carece de imparcialidad, criterios y evidencias suficientes, y las acciones previas no se verificaron; la conclusión no está respaldada por los hallazgos","Sí, si lo firma la dirección","No se puede auditar una auditoría"],"c":1,"x":"Las conclusiones deben derivar de los hallazgos y de evidencias suficientes y fiables. Con un auditor no imparcial, sin criterios, con hallazgos no verificables y acciones sin comprobar, la conclusión carece de base. En el seguimiento, la entidad de certificación probablemente lo señalará.","ref":"ISO 19011:2018 · ISO/IEC 27001:2022, cláusulas 9.2 y 10.2","pista":"Una conclusión vale lo que valen sus evidencias."}]},{"id":"m-region","nombre":"Caída del proveedor crítico","dificultad":"Difícil","icono":"cloud","marcos":["BCM","ENS","27001"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"Martes, 10:15. La región de nube donde Arcadia aloja su sede electrónica (disponibilidad de nivel ALTO) cae por completo. El proveedor no da fecha de recuperación. El plan de continuidad prevé conmutar a un centro alternativo. Dirige la respuesta.","evidencias":[{"titulo":"Plan de continuidad · sede electrónica","tipo":"doc","texto":"RTO: 4 h · RPO: 1 h · MTPD: 24 h.\nMedio alternativo: CPD propio de respaldo, con réplica de datos cada hora.\nTiempo previsto de conmutación: 2 h.\nÚltima prueba completa: hace 3 años (resultado: «parcial»)."},{"titulo":"Estado del centro alternativo","tipo":"tabla","texto":"Elemento                       Estado\nRéplica de datos               Última sincronización: 09:55\nParches del sistema            14 meses de retraso\nCortafuegos                    Reglas permisivas «temporales» desde 2023\nDoble factor de administración No configurado\nCertificados TLS               Caducan dentro de 9 días"},{"titulo":"Mensajes recibidos","tipo":"nota","texto":"10:40  El jefe de sistemas propone conmutar ya «aunque el respaldo no esté al día en seguridad».\n10:55  Un periodista pregunta si los datos de los ciudadanos están a salvo.\n11:10  El proveedor publica: «investigando, sin fecha estimada»."}],"flags":[{"id":"m-region-f1","tipo":"user","nombre":"Flag de usuario · Activar","t":"unica","d":2,"q":"Con un RTO de 4 horas, una conmutación de 2 horas y sin fecha del proveedor, ¿cuándo debe decidirse la activación?","o":["Esperar a que el proveedor dé fecha","Cuanto antes: cada minuto de espera reduce el margen y a las 12:15 ya no daría tiempo a conmutar dentro del RTO","Al final del día","Solo si el periodista publica la noticia"],"c":1,"x":"Si la caída empezó a las 10:15 y la conmutación tarda 2 horas, la decisión debe estar tomada antes de las 12:15 para cumplir el RTO, y mejor bastante antes por si surgen imprevistos. Esperar a un proveedor sin fecha es la forma más común de incumplir el RTO.","ref":"ISO 22301:2019, cláusula 8.4.2 · RD 311/2022, op.cont.2","pista":"Resta el tiempo de conmutación al RTO."},{"id":"m-region-f2","tipo":"user","nombre":"Flag de usuario · El respaldo","t":"unica","d":3,"q":"¿Qué requisito del ENS incumple el estado del centro alternativo?","o":["Ninguno","op.cont.4: los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales","mp.info.4: sellos de tiempo","op.pl.5: componentes certificados"],"c":1,"x":"Parches atrasados, reglas permisivas, sin doble factor y certificados a punto de caducar: el respaldo no tiene las mismas garantías que el original, como exige op.cont.4.3. En una crisis, el respaldo débil se convierte en la puerta de entrada.","ref":"RD 311/2022, anexo II, op.cont.4.3","cita":"Los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales.","pista":"Lee los requisitos de op.cont.4."},{"id":"m-region-f3","tipo":"user","nombre":"Flag de usuario · Los datos","t":"unica","d":2,"q":"La última sincronización fue a las 09:55 y la caída a las 10:15. ¿Se cumple el RPO de 1 hora?","o":["Sí: se pierden como máximo 20 minutos de datos","No: se pierden 2 horas","No se puede saber","Solo si el proveedor recupera la región"],"c":0,"x":"Entre las 09:55 y las 10:15 hay 20 minutos: dentro del RPO de 1 hora. Las transacciones de esos 20 minutos habrá que reconciliarlas cuando vuelva la región, o comunicarlo a los afectados.","ref":"ISO 22301:2019, cláusula 8.3","pista":"Calcula la distancia entre la sincronización y la caída."},{"id":"m-region-f4","tipo":"root","nombre":"Flag de root · ¿Conmutar ya?","t":"unica","d":3,"q":"El jefe de sistemas propone conmutar «aunque no esté al día en seguridad». ¿Qué decide el comité?","o":["Conmutar sin más: la disponibilidad manda","No conmutar nunca","Conmutar aplicando antes las mitigaciones críticas que se puedan hacer en el margen (doble factor de administración, cerrar las reglas permisivas y restringir la exposición), asumiendo y registrando formalmente el riesgo restante, y corregir el resto después","Pedir permiso al periodista"],"c":2,"x":"Es una decisión de riesgo, no técnica. El margen del RTO permite aplicar las mitigaciones más críticas antes de exponer el respaldo. Lo que no se pueda corregir se asume de forma explícita y registrada (decision log) y queda una acción correctiva para que el respaldo cumpla op.cont.4.3 y se pruebe de verdad.","ref":"ISO/IEC 27001:2022, anexo A 5.29 · RD 311/2022, op.cont.4.3","pista":"Disponibilidad y seguridad: ¿hay una opción que no renuncie a ninguna?"},{"id":"m-region-f5","tipo":"root","nombre":"Flag de root · La causa de fondo","t":"multiple","d":3,"q":"¿Qué hallazgos estructurales debe recoger el informe posterior al incidente?","o":["El plan no se ha probado por completo en 3 años, y la última prueba fue parcial","El centro alternativo no se mantuvo con las mismas garantías de seguridad","Falta una alternativa probada a la dependencia de una sola región del proveedor","El periodista preguntó demasiado pronto"],"c":[0,1,2],"x":"Las pruebas periódicas (op.cont.3; ISO/IEC 27001 5.30) habrían revelado el estado del respaldo. Su mantenimiento debía igualar al original (op.cont.4.3). Y la concentración en una sola región es un riesgo de proveedor que la estrategia de continuidad debe tratar.","ref":"RD 311/2022, op.cont.3 y op.cont.4 · ISO/IEC 27001:2022, anexo A 5.30","pista":"Busca causas, no síntomas."}]},{"id":"m-ensalta","nombre":"Certificación ENS de Arcadia","dificultad":"Difícil","icono":"shieldCheck","marcos":["ENS","27001"],"empresa":"Consorcio Digital de Arcadia (ficticio)","brief":"Arcadia, con su sistema de categoría ALTA, se enfrenta a su certificación ENS. Tiene la ISO/IEC 27001 desde hace años y cree que eso le ahorra trabajo. Hace seis meses migró la sede a la nube. Asesora al comité.","evidencias":[{"titulo":"Historial de auditorías","tipo":"tabla","texto":"Fecha        Tipo                                   Resultado\nmar 2023     Auditoría ENS ordinaria                Conformidad\nmar 2024     Seguimiento ISO/IEC 27001              Sin no conformidades\nsep 2024     Migración de la sede a la nube         (sin auditoría)\nmar 2025     Seguimiento ISO/IEC 27001              1 no conformidad menor"},{"titulo":"Acta del comité","tipo":"nota","texto":"«Como tenemos la ISO, la certificación ENS será un trámite. El auditor puede reutilizar el certificado ISO como evidencia de todas las medidas. El informe de auditoría se lo daremos solo a la dirección. No hace falta publicar nada en la sede.»"}],"flags":[{"id":"m-ensalta-f1","tipo":"user","nombre":"Flag de usuario · La migración","t":"unica","d":2,"q":"La migración de la sede a la nube en septiembre de 2024, ¿qué obligación activaba?","o":["Ninguna","Una auditoría extraordinaria, por tratarse de una modificación sustancial que puede repercutir en las medidas de seguridad","Una nueva certificación ISO","Solo informar al proveedor"],"c":1,"x":"El artículo 31.1 exige auditoría extraordinaria ante modificaciones sustanciales. Mover la sede a la nube cambia la arquitectura, los proveedores y las medidas aplicables (op.nub.1, op.ext). Esa auditoría habría marcado además la fecha para contar los dos años hasta la siguiente ordinaria.","ref":"RD 311/2022, art. 3  del sistema y al de la seguridad; el de la seguridad lo analiza y eleva conclusiones al del sistema","Las certificaciones de conformidad deben publicarse en el portal o la sede electrónica","El CCN puede requerir los informes de auditoría","El informe debe entregarse a todos los ciudadanos"],"c":[0,1,2],"x":"El circuito del informe lo fija el artículo 31.5; los informes pueden ser requeridos por los responsables con competencias en seguridad TIC y por el CCN (31.7); y las certificaciones se publican en los portales o sedes (38.2). No hay obligación de entregar el informe a la ciudadanía.","ref":"RD 311/2022, arts. 31.5, 31.7 y 38.2","pista":"Uno de los cuatro va demasiado lejos."},{"id":"m-ensalta-f5","tipo":"root","nombre":"Flag de root · Deficiencias graves","t":"unica","d":3,"q":"Si el dictamen revela deficiencias graves en el sistema de categoría ALTA, ¿qué puede hacer el responsable del sistema?","o":["Nada hasta la siguiente auditoría","Suspender temporalmente el tratamiento de información, la prestación de servicios o la operación completa del sistema hasta subsanar o mitigar las deficiencias","Bajar la categoría a MEDIA","Pedir al auditor que cambie el dictamen"],"c":1,"x":"El artículo 31.6 lo prevé expresamente para la categoría ALTA. Bajar la categoría no es una opción: depende de la valoración del impacto (art. 41 y anexo I), no de lo que convenga en la auditoría.","ref":"RD 311/2022, art. 31.6","cita":"En el caso de los sistemas de categoría ALTA, visto el dictamen de auditoría y atendiendo a una eventual gravedad de las deficiencias encontradas, el responsable del sistema podrá suspender temporalmente el tratamiento de informaciones, la prestación de servicios o la total operación del sistema, hasta su adecuada subsanación o mitigación.","pista":"El artículo 31 tiene un apartado solo para la categoría ALTA."}]}],"simulacros":[{"id":"sim-ens","nombre":"Simulacro ENS","rutas":["ens"],"n":30,"minutos":45,"aprobado":0.7,"descripcion":"30 preguntas de las siete salas del ENS en 45 minutos. Se aprueba con un 70 %."},{"id":"sim-iso","nombre":"Simulacro ISO/IEC 27001","rutas":["iso27001"],"n":40,"minutos":60,"aprobado":0.7,"descripcion":"40 preguntas de las ocho salas de la 27001 en 60 minutos. Se aprueba con un 70 %."},{"id":"sim-grc","nombre":"Simulacro GRC integral","rutas":["ens","iso27001","continuidad"],"n":50,"minutos":75,"aprobado":0.7,"descripcion":"50 preguntas de las tres rutas en 75 minutos. El examen final del laboratorio."}]};

<script>

 *  - Corrección de respuestas y puntos de experiencia (XP).

 *  - Simulacros con barajado determinista por semilla.
 *  - Validación del banco de preguntas (lo usan la construcción y las pruebas). */
(function (root) {
  'use strict';

  /* ---------- Rangos: los cien ojos de Argos ---------- */
  const RANGOS = [
    { ojos: 1, xp: 0, nombre: 'Primer ojo', lema: 'Empiezas a mirar el sistema.' },
    { ojos: 5, xp: 150, nombre: '5 ojos', lema: 'Reconoces los marcos y su vocabulario.' },
    { ojos: 10, xp: 450, nombre: '10 ojos', lema: 'Relacionas requisitos con controles.' },
    { ojos: 25, xp: 1000, nombre: '25 ojos', lema: 'Sabes qué evidencia pedir.' },
    { ojos: 50, xp: 1800, nombre: '50 ojos', lema: 'Detectas no conformidades a la primera.' },
    { ojos: 75, xp: 3000, nombre: '75 ojos', lema: 'Auditas con criterio y lo justificas.' },
    { ojos: 100, xp: 4500, nombre: 'Panoptes', lema: 'Los cien ojos abiertos. Nada se te escapa.' }
  ];
  function rangoDe(xp) {
    const x = Math.max(0, Number(xp) || 0);
    let i = 0;
    while (i + 1 < RANGOS.length && x >= RANGOS[i + 1].xp) i++;
    const r = RANGOS[i]; const sig = RANGOS[i + 1] || null;
    // Ojos abiertos dentro del tramo: interpolación lineal hasta el siguiente rango
    const tramo = sig ? (x - r.xp) / (sig.xp - r.xp) : 1;
    const ojos = sig ? Math.min(sig.ojos - 1, r.ojos + Math.floor(tramo * (sig.ojos - r.ojos))) : 100;
    return { indice: i, nivel: i + 1, rango: r, siguiente: sig, progreso: sig ? tramo : 1, faltan: sig ? sig.xp - x : 0, ojos };
  }

  /* ---------- Puntos ---------- */
  const XP = {
    pregunta: { 1: 10, 2: 15, 3: 20 },
    repaso: 4,
    sala: 50, salaPerfecta: 25,
    flag: { user: 40, root: 80 },
    dificultad: { 'Fácil': 1, 'Media': 1.5, 'Difícil': 2 },
    simulacro: 150
  };
  const xpPregunta = (q) => XP.pregunta[q.d] || XP.pregunta[1];
  function xpFlag(flag, dificultad, conPista) {
    const base = (XP.flag[flag.tipo] || XP.flag.user) * (XP.dificultad[dificultad] || 1);
    return Math.round(conPista ? base / 2 : base);
  }

  /* ---------- Corrección ---------- */
  const correctas = (q) => (q.t === 'multiple' ? [...q.c].sort((a, b) => a - b) : [q.c]);
  function evaluar(q, resp) {
    if (q.t === 'vf') return resp === q.c;
    if (q.t === 'multiple') {
      const r = Array.isArray(resp) ? [...new Set(resp)].sort((a, b) => a - b) : [];
      const c = correctas(q);
      return r.length === c.length && r.every((v, i) => v === c[i]);
    }
    return resp === q.c;
  }

  /* ---------- Fechas (día local en formato AAAA-MM-DD) ---------- */
  const dia = (d = new Date()) => { const z = new Date(d); return `${z.getFullYear()}-${String(z.getMonth() + 1).padStart(2, '0')}-${String(z.getDate()).padStart(2, '0')}`; };
  function sumarDias(iso, n) { const [y, m, d] = iso.split('-').map(Number); return dia(new Date(y, m - 1, d + n)); }
  function diasEntre(a, b) { const f = (s) => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((f(b) - f(a)) / 86400000); }

  /* ---------- Repaso espaciado (Leitner) ----------
   * Caja 1: mañana · 2: en 3 días · 3: en 7 · 4: en 14 · 5: en 30. Un fallo devuelve la pregunta a la caja 1 para hoy. */
  const INTERVALOS = [0, 1, 3, 7, 14, 30];
  function repasar(estado, acierto, hoy) {
    const e = estado ? { ...estado } : { caja: 0, aciertos: 0, fallos: 0 };
    if (acierto) { e.caja = Math.min(5, (e.caja || 0) + 1); e.aciertos = (e.aciertos || 0) + 1; e.due = sumarDias(hoy, INTERVALOS[e.caja]); }
    else { e.caja = 1; e.fallos = (e.fallos || 0) + 1; e.due = hoy; }
    e.ultima = hoy;
    return e;
  }
  /* Pendientes: preguntas ya vistas cuya fecha de repaso ha llegado, las más atrasadas y de caja más baja primero */
  function pendientes(respuestas, hoy) {
    return Object.entries(respuestas || {})
      .filter(([, e]) => e && e.due && e.due <= hoy && e.caja < 5 + 1)
      .sort((a, b) => (a[1].due < b[1].due ? -1 : a[1].due > b[1].due ? 1 : a[1].caja - b[1].caja))
      .map(([id]) => id);
  }

  /* ---------- Racha ---------- */
  function racha(dias, hoy) {
    const activo = (d) => dias && dias[d] && (dias[d].preguntas || 0) > 0;
    let n = 0; let d = activo(hoy) ? hoy : sumarDias(hoy, -1);
    while (activo(d)) { n++; d = sumarDias(d, -1); }
    return n;
  }
  function mejorRacha(dias) {
    const ds = Object.keys(dias || {}).filter((d) => (dias[d].preguntas || 0) > 0).sort();
    let best = 0; let cur = 0; let prev = null;
    for (const d of ds) { cur = prev && diasEntre(prev, d) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = d; }
    return best;
  }

  /* ---------- Barajado determinista ---------- */
  function semillaDe(texto) { let h = 2166136261; for (const ch of String(texto)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
  function prng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function barajar(lista, seed) { const r = prng(typeof seed === 'number' ? seed : semillaDe(seed)); const a = [...lista]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  /* Orden de presentación de las opciones (índices originales). Las de verdadero/falso no se barajan. */
  function ordenOpciones(q, seed) { return q.t === 'vf' ? [0, 1] : barajar(q.o.map((_, i) => i), `${seed}|${q.id}`); }

  /* ---------- Índice del banco ---------- */
  function indexar(rutas) {
    const preguntas = new Map(); const salaDe = new Map(); const rutaDe = new Map();
    for (const r of rutas) for (const s of r.salas) for (const q of s.preguntas) { preguntas.set(q.id, q); salaDe.set(q.id, s.id); rutaDe.set(q.id, r.id); }
    return { preguntas, salaDe, rutaDe };
  }

  /* ---------- Simulacros ----------
   * Toma n preguntas repartidas entre las salas de las rutas indicadas (al menos una por sala si caben) y las baraja. */
  function generarSimulacro(rutas, sim, seed) {
    const salas = rutas.filter((r) => sim.rutas.includes(r.id)).flatMap((r) => r.salas);
    const porSala = salas.map((s) => barajar(s.preguntas.map((q) => q.id), `${seed}|${s.id}`));
    const elegidas = []; let ronda = 0;
    while (elegidas.length < sim.n && porSala.some((l) => l.length > ronda)) {
      for (const l of porSala) { if (elegidas.length >= sim.n) break; if (l[ronda]) elegidas.push(l[ronda]); }
      ronda++;
    }
    return barajar(elegidas, `${seed}|orden`);
  }
  function corregirSimulacro(idx, ids, respuestas, sim) {
    const porSala = {}; let ok = 0;
    for (const id of ids) {
      const q = idx.preguntas.get(id); const bien = respuestas[id] !== undefined && evaluar(q, respuestas[id]);
      const s = idx.salaDe.get(id); porSala[s] = porSala[s] || { ok: 0, total: 0 }; porSala[s].total++;
      if (bien) { ok++; porSala[s].ok++; }
    }
    const nota = ids.length ? ok / ids.length : 0;
    return { ok, total: ids.length, nota, aprobado: nota >= sim.aprobado, porSala };
  }

  /* ---------- Logros ---------- */
  const LOGROS = [
    { id: 'primer-acierto', nombre: 'Primer ojo abierto', desc: 'Aciertas tu primera pregunta.', icono: 'eye' },
    { id: 'sala-1', nombre: 'Primera sala', desc: 'Superas una sala con al menos un 80 %.', icono: 'door' },
    { id: 'sala-perfecta', nombre: 'Sin un fallo', desc: 'Completas una sala con el 100 %.', icono: 'target' },
    { id: 'ruta-ens', nombre: 'Guardián del ENS', desc: 'Superas todas las salas de la ruta ENS.', icono: 'landmark' },
    { id: 'ruta-iso27001', nombre: 'Arquitecto del SGSI', desc: 'Superas todas las salas de la ruta ISO/IEC 27001.', icono: 'layers' },
    { id: 'ruta-continuidad', nombre: 'Resiliente', desc: 'Superas todas las salas de la ruta de continuidad.', icono: 'lifebuoy' },
    { id: 'maquina-1', nombre: 'Primera máquina', desc: 'Capturas todas las flags de un caso práctico.', icono: 'flag' },
    { id: 'ojo-halcon', nombre: 'Ojo de halcón', desc: 'Completas un caso práctico sin abrir ninguna pista.', icono: 'scan' },
    { id: 'maquinas-todas', nombre: 'Auditor de campo', desc: 'Completas todos los casos prácticos.', icono: 'briefcase' },
    { id: 'simulacro-ok', nombre: 'Examen superado', desc: 'Apruebas un simulacro.', icono: 'graduation' },
    { id: 'simulacro-90', nombre: 'Matrícula', desc: 'Sacas un 90 % o más en un simulacro.', icono: 'award' },
    { id: 'racha-3', nombre: 'Constancia', desc: 'Practicas tres días seguidos.', icono: 'flame' },
    { id: 'racha-7', nombre: 'Semana completa', desc: 'Practicas siete días seguidos.', icono: 'flame' },
    { id: 'racha-30', nombre: 'Vigilancia continua', desc: 'Practicas treinta días seguidos (ENS, art. 10).', icono: 'flame' },
    { id: 'repaso-25', nombre: 'Memoria de auditor', desc: 'Aciertas 25 preguntas en el repaso espaciado.', icono: 'refresh' },
    { id: 'cien', nombre: 'Cien aciertos', desc: 'Aciertas 100 preguntas distintas.', icono: 'check' },
    { id: 'panoptes', nombre: 'Panoptes', desc: 'Abres los cien ojos: alcanzas el rango máximo.', icono: 'sparkles' }
  ];
  /* Devuelve los ids de logros que el progreso cumple (los ya obtenidos incluidos) */
  function logrosCumplidos(p, banco, hoy) {
    const s = new Set();
    const resp = p.respuestas || {}; const aciertos = Object.values(resp).filter((e) => (e.aciertos || 0) > 0).length;
    const salas = p.salas || {}; const superada = (id) => salas[id] && salas[id].mejor >= 0.8;
