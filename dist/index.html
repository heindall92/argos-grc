d y disponibilidad"],"c":1,"x":"La 27002 asigna cinco atributos a cada control. El tipo es preventivo, detectivo o correctivo. Los conceptos de ciberseguridad (identificar, proteger, detectar, responder, recuperar) y las propiedades (C, I, D) son otros atributos distintos.","ref":"ISO/IEC 27002:2022, anexo A (atributos) · CCN-STIC 825, apdo. 4.1.2"},{"id":"iso-1-08","t":"vf","d":1,"q":"Una organización puede certificarse en la ISO/IEC 27002.","c":false,"x":"La 27002 es una guía de buenas prácticas con orientación para implantar los controles; no contiene requisitos y no es certificable. Lo que se certifica es el SGSI conforme a la 27001.","ref":"ISO/IEC 27002:2022 · CCN-STIC 825, apdo. 4.1.2"},{"id":"iso-1-09","t":"unica","d":1,"q":"¿Qué tres propiedades de la información protege un SGSI según la ISO/IEC 27001?","o":["Confidencialidad, integridad y disponibilidad","Autenticidad, trazabilidad y disponibilidad","Privacidad, legalidad y resiliencia","Confidencialidad, autenticidad y no repudio"],"c":0,"x":"La 27001 se centra en confidencialidad, integridad y disponibilidad (la «tríada CID»). El ENS añade autenticidad y trazabilidad, y por eso una certificación 27001 no cubre por sí sola todas las dimensiones del ENS.","ref":"ISO/IEC 27001:2022, cláusula 6.1.2 · CCN-STIC 825, apdo. 4.2"},{"id":"iso-1-10","t":"unica","d":2,"q":"¿Qué ciclo de mejora subyace en la estructura de la ISO/IEC 27001?","o":["DMAIC","Planificar-Hacer-Verificar-Actuar (PDCA)","Kill chain","ITIL"],"c":1,"x":"Aunque la 2022 no lo nombra expresamente, la estructura responde al ciclo PDCA: planificar (6), hacer (7 y 8), verificar (9) y actuar (10), sobre la base del contexto (4) y el liderazgo (5).","ref":"ISO/IEC 27001:2022, cláusulas 4 a 10"}]},{"id":"iso-2","nombre":"Contexto y liderazgo","resumen":"Cláusulas 4 y 5: cuestiones internas y externas, partes interesadas, alcance, compromiso de la dirección, política y roles.","preguntas":[{"id":"iso-2-01","t":"unica","d":1,"q":"¿Qué pide la cláusula 4.1?","o":["Identificar los activos de información","Determinar las cuestiones externas e internas pertinentes para el propósito de la organización y que afectan al SGSI","Redactar la política de seguridad","Nombrar al responsable de seguridad"],"c":1,"x":"La 4.1 trata el contexto: las cuestiones externas (regulación, mercado, amenazas) e internas (cultura, recursos, estructura) que influyen en la capacidad del SGSI de lograr sus resultados. Desde la Amd 1:2024 incluye valorar si el cambio climático es pertinente.","ref":"ISO/IEC 27001:2022, cláusula 4.1"},{"id":"iso-2-02","t":"multiple","d":2,"q":"Sobre las partes interesadas (cláusula 4.2), ¿qué debe determinar la organización?","o":["Qué partes interesadas son pertinentes para el SGSI","Sus requisitos pertinentes","Cuáles de esos requisitos se abordarán a través del SGSI","El presupuesto que aporta cada parte interesada","La firma de un acuerdo con cada una"],"c":[0,1,2],"x":"La 4.2 pide identificar las partes interesadas pertinentes, sus requisitos y, desde 2022, cuáles se abordarán mediante el SGSI. Los requisitos pueden ser legales, contractuales o expectativas; no implica firmar acuerdos.","ref":"ISO/IEC 27001:2022, cláusula 4.2"},{"id":"iso-2-03","t":"unica","d":2,"q":"¿Cómo debe quedar el alcance del SGSI (cláusula 4.3)?","o":["Comunicado verbalmente a la plantilla","Disponible como información documentada","Registrado en la entidad de certificación","Incluido solo en el contrato con los clientes"],"c":1,"x":"El alcance debe estar disponible como información documentada. Para definirlo se tienen en cuenta las cuestiones de 4.1, los requisitos de 4.2 y las interfaces y dependencias con actividades de otras organizaciones.","ref":"ISO/IEC 27001:2022, cláusula 4.3"},{"id":"iso-2-04","t":"vf","d":2,"q":"La dirección puede delegar por completo en el responsable de seguridad la responsabilidad de demostrar liderazgo y compromiso con el SGSI.","c":false,"x":"La 5.1 exige a la alta dirección demostrar liderazgo: asegurar la política y los objetivos alineados con la estrategia, integrar el SGSI en los procesos, aportar recursos, comunicar su importancia y promover la mejora. Puede delegar tareas, no su compromiso.","ref":"ISO/IEC 27001:2022, cláusula 5.1"},{"id":"iso-2-05","t":"multiple","d":2,"q":"¿Qué debe cumplir la política de seguridad de la información según la cláusula 5.2?","o":["Ser adecuada al propósito de la organización","Incluir objetivos de seguridad o el marco para fijarlos","Incluir el compromiso de satisfacer los requisitos aplicables y de mejora continua","Ser secreta y conocida solo por la dirección","Estar disponible como información documentada y comunicada dentro de la organización"],"c":[0,1,2,4],"x":"La política debe ser adecuada, incluir objetivos o su marco, los compromisos de cumplir requisitos y de mejora continua, estar documentada, comunicarse dentro de la organización y estar disponible para las partes interesadas según proceda. Nunca es secreta.","ref":"ISO/IEC 27001:2022, cláusula 5.2"},{"id":"iso-2-06","t":"unica","d":2,"q":"¿Quién asigna las responsabilidades y autoridades de los roles de seguridad (cláusula 5.3)?","o":["El auditor interno","La alta dirección","El responsable de recursos humanos","La entidad de certificación"],"c":1,"x":"La alta dirección asegura que se asignan y comunican las responsabilidades y autoridades, entre ellas la de asegurar que el SGSI cumple la norma y la de informar a la dirección sobre su desempeño.","ref":"ISO/IEC 27001:2022, cláusula 5.3"},{"id":"iso-2-07","t":"unica","d":3,"q":"Una auditora ve que el alcance excluye el centro de datos, pero los servicios incluidos dependen totalmente de él y no se describe esa interfaz. ¿Qué cláusula se incumple?","o":["4.3, que pide considerar las interfaces y dependencias al fijar el alcance","7.5, control de la información documentada","9.2, auditoría interna","No hay incumplimiento: el alcance es libre"],"c":0,"x":"El alcance lo decide la organización, pero debe considerar las interfaces y dependencias con actividades propias o de terceros. Excluir algo crítico sin tratar la dependencia hace el alcance engañoso.","ref":"ISO/IEC 27001:2022, cláusula 4.3"},{"id":"iso-2-08","t":"unica","d":1,"q":"En la cláusula 4.4, ¿qué pide la norma respecto al SGSI?","o":["Comprar una herramienta GRC","Establecer, implementar, mantener y mejorar continuamente el SGSI, incluidos los procesos necesarios y sus interacciones","Certificarlo en un plazo de un año","Externalizar su gestión"],"c":1,"x":"La 4.4 es el requisito general: establecer, implantar, mantener y mejorar el SGSI. Desde 2022 incluye expresamente los procesos necesarios y sus interacciones.","ref":"ISO/IEC 27001:2022, cláusula 4.4"},{"id":"iso-2-09","t":"vf","d":2,"q":"La política de seguridad debe estar disponible para las partes interesadas, según proceda.","c":true,"x":"Además de comunicarse dentro de la organización, la 5.2 pide que la política esté disponible para las partes interesadas según corresponda. Es habitual publicarla en la web o entregarla a clientes y proveedores.","ref":"ISO/IEC 27001:2022, cláusula 5.2"},{"id":"iso-2-10","t":"unica","d":2,"q":"Un nuevo reglamento europeo obliga a notificar incidentes en 24 horas. ¿Dónde lo recoge primero el SGSI?","o":["En la cláusula 4.2, como requisito de una parte interesada (el regulador), y en el control 5.31 de requisitos legales","Solo en el plan de formación","En la revisión del alcance, excluyendo el reglamento","En ningún sitio hasta la próxima auditoría"],"c":0,"x":"Un requisito legal nuevo entra por el contexto (4.1, 4.2: el regulador como parte interesada) y se gestiona con el control 5.31 (requisitos legales, reglamentarios y contractuales). Después se traduce en procedimientos, por ejemplo en la gestión de incidentes (5.24 a 5.26).","ref":"ISO/IEC 27001:2022, cláusula 4.2 y anexo A 5.31"}]},{"id":"iso-3","nombre":"Riesgos y Declaración de Aplicabilidad","resumen":"Cláusula 6: apreciación y tratamiento del riesgo, la Declaración de Aplicabilidad (SoA), objetivos y planificación de cambios.","preguntas":[{"id":"iso-3-01","t":"multiple","d":2,"q":"Según la cláusula 6.1.2, ¿qué debe establecer el proceso de apreciación del riesgo?","o":["Criterios de aceptación del riesgo","Criterios para realizar las apreciaciones","Resultados coherentes, válidos y comparables al repetirse","Un umbral fijo de riesgo igual para todas las organizaciones","Los dueños de los riesgos identificados"],"c":[0,1,2,4],"x":"La apreciación debe definir criterios de aceptación y de evaluación, producir resultados coherentes y comparables, identificar riesgos de pérdida de C, I y D con sus dueños, analizarlos (consecuencias y probabilidad) y evaluarlos. No hay umbral universal: lo fija cada organización.","ref":"ISO/IEC 27001:2022, cláusula 6.1.2"},{"id":"iso-3-02","t":"unica","d":2,"q":"En la ISO/IEC 27001:2022, ¿quién debe aprobar el plan de tratamiento y aceptar los riesgos residuales?","o":["El auditor interno","Los dueños de los riesgos","El consultor que implanta el SGSI","La entidad de certificación"],"c":1,"x":"La 6.1.3 pide obtener la aprobación del plan de tratamiento y la aceptación de los riesgos residuales por parte de los dueños de los riesgos. Que lo apruebe otra persona es una no conformidad habitual.","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 f)"},{"id":"iso-3-03","t":"multiple","d":2,"q":"¿Qué debe contener la Declaración de Aplicabilidad (SoA)?","o":["Los controles necesarios","La justificación de su inclusión","Si están implantados o no","La justificación de las exclusiones de controles del anexo A","El coste de cada control"],"c":[0,1,2,3],"x":"La SoA recoge los controles necesarios, por qué se incluyen, si están implantados y por qué se excluyen los del anexo A que no se aplican. El coste no es un contenido exigido.","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 d)"},{"id":"iso-3-04","t":"unica","d":3,"q":"¿Para qué se compara la selección de controles con el anexo A en la cláusula 6.1.3?","o":["Para implantar obligatoriamente los 93 controles","Para verificar que no se ha omitido ningún control necesario","Para calcular la puntuación de la certificación","Para elegir el proveedor de herramientas"],"c":1,"x":"Los controles se determinan a partir del tratamiento del riesgo, y luego se contrastan con el anexo A para comprobar que no se omite ninguno necesario. El anexo A no es una lista obligatoria: se pueden excluir controles justificándolo y añadir otros de cualquier fuente.","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 c)"},{"id":"iso-3-05","t":"multiple","d":2,"q":"¿Qué opciones de tratamiento del riesgo son válidas en un SGSI?","o":["Modificar o mitigar el riesgo con controles","Evitar el riesgo eliminando la actividad","Compartir o transferir el riesgo (por ejemplo, un seguro)","Retener o aceptar el riesgo de forma informada","Ignorar el riesgo si es costoso tratarlo"],"c":[0,1,2,3],"x":"Las opciones habituales, descritas en la ISO/IEC 27005 y la ISO 31000, son modificar, evitar, compartir y retener. Ignorar no es una opción: aceptar exige una decisión documentada del dueño del riesgo según los criterios de aceptación.","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 a) · ISO/IEC 27005"},{"id":"iso-3-06","t":"unica","d":2,"q":"Según la cláusula 6.2, ¿cómo deben ser los objetivos de seguridad de la información?","o":["Secretos y estratégicos","Coherentes con la política, medibles si es posible, objeto de seguimiento, comunicados y actualizados","Iguales a los de la competencia","Fijados por el auditor"],"c":1,"x":"Los objetivos deben ser coherentes con la política, medibles cuando sea posible, tener en cuenta los requisitos y los resultados del riesgo, ser objeto de seguimiento (añadido en 2022), comunicarse y actualizarse. Además hay que planificar qué, con qué recursos, quién, cuándo y cómo se evalúa.","ref":"ISO/IEC 27001:2022, cláusula 6.2"},{"id":"iso-3-07","t":"unica","d":2,"q":"¿Qué cláusula se añadió en 2022 para que los cambios en el SGSI se hagan de forma planificada?","o":["6.3 Planificación de los cambios","8.4 Gestión de cambios","10.3 Cambios","5.4 Cambios de la dirección"],"c":0,"x":"La 6.3 es nueva en 2022: cuando haya que cambiar el SGSI, los cambios se harán de forma planificada. No confundir con el control 8.32 del anexo A (gestión de cambios en los sistemas).","ref":"ISO/IEC 27001:2022, cláusula 6.3"},{"id":"iso-3-08","t":"vf","d":3,"q":"Una organización puede excluir de su SoA el control 8.28 (codificación segura) si no desarrolla software, siempre que lo justifique.","c":true,"x":"Las exclusiones son válidas si están justificadas, por ejemplo porque el riesgo no existe en el alcance. Si la organización no desarrolla software, excluir 8.28 justificándolo es razonable. Lo que no vale es excluir sin justificar, o excluir algo que el análisis de riesgos sí necesita.","ref":"ISO/IEC 27001:2022, cláusula 6.1.3 d)"},{"id":"iso-3-09","t":"unica","d":3,"q":"La SoA dice «8.13 Copias de seguridad: implantado», pero el análisis de riesgos no menciona la pérdida de datos. ¿Qué detecta el auditor?","o":["Nada: la SoA manda sobre el análisis","Falta de trazabilidad entre la apreciación del riesgo, el tratamiento y la SoA","Que sobra el control 8.13","Un fallo de redacción sin importancia"],"c":1,"x":"La SoA debe derivar del tratamiento de riesgos (6.1.3). Si un control está en la SoA sin un riesgo que lo justifique, o un riesgo evidente no aparece, la cadena riesgo → tratamiento → control → SoA está rota. Es un hallazgo típico.","ref":"ISO/IEC 27001:2022, cláusulas 6.1.2 y 6.1.3"},{"id":"iso-3-10","t":"unica","d":2,"q":"¿Qué debe conservarse como información documentada sobre el proceso de riesgos?","o":["Nada: es un proceso mental","El proceso de apreciación y de tratamiento, y sus resultados","Solo el informe final para la dirección","Solo las actas del comité"],"c":1,"x":"Hay que conservar información documentada del proceso de apreciación (6.1.2) y de tratamiento (6.1.3), y de los resultados de la apreciación y del tratamiento cuando se ejecutan (8.2 y 8.3).","ref":"ISO/IEC 27001:2022, cláusulas 6.1.2, 6.1.3, 8.2 y 8.3"}]},{"id":"iso-4","nombre":"Apoyo y operación","resumen":"Cláusulas 7 y 8: recursos, competencia, concienciación, comunicación, información documentada y operación del SGSI.","preguntas":[{"id":"iso-4-01","t":"unica","d":1,"q":"¿Qué diferencia hay entre competencia (7.2) y concienciación (7.3)?","o":["Ninguna, son sinónimos","Competencia: la capacidad de quien hace un trabajo que afecta a la seguridad, con evidencia documentada. Concienciación: que todas las personas conozcan la política, su contribución y las consecuencias de no cumplir","Competencia es para directivos y concienciación para técnicos","Concienciación exige títulos oficiales"],"c":1,"x":"La competencia se refiere a las personas cuyo trabajo afecta al desempeño de la seguridad (formación, experiencia y evidencia documentada). La concienciación aplica a todas las personas que trabajan bajo el control de la organización.","ref":"ISO/IEC 27001:2022, cláusulas 7.2 y 7.3"},{"id":"iso-4-02","t":"multiple","d":2,"q":"Según la cláusula 7.4, ¿qué debe determinar la organización sobre la comunicación del SGSI?","o":["Qué comunicar","Cuándo comunicar","A quién comunicar","Cómo comunicar","Qué medio de prensa usar"],"c":[0,1,2,3],"x":"La 7.4 pide determinar las necesidades de comunicación interna y externa: qué, cuándo, a quién y cómo. En 2022 se eliminó el «quién comunica» como apartado separado; los medios de prensa no son un requisito.","ref":"ISO/IEC 27001:2022, cláusula 7.4"},{"id":"iso-4-03","t":"multiple","d":2,"q":"¿Qué controles exige la cláusula 7.5.3 sobre la información documentada?","o":["Que esté disponible y sea idónea cuando se necesite","Que esté adecuadamente protegida","Control de cambios y de versiones","Conservación y disposición","Que todo se imprima en papel"],"c":[0,1,2,3],"x":"La información documentada debe estar disponible e idónea, protegida (confidencialidad, uso inadecuado, pérdida de integridad), y controlarse su distribución, acceso, almacenamiento, cambios, conservación y disposición. También la de origen externo.","ref":"ISO/IEC 27001:2022, cláusula 7.5.3"},{"id":"iso-4-04","t":"unica","d":2,"q":"¿Qué pide la cláusula 8.1 desde 2022 sobre los procesos, productos o servicios suministrados externamente?","o":["Que se prohíban","Que se determinen y controlen cuando sean pertinentes para el SGSI","Que se certifiquen en ISO/IEC 27001","Que se auditen todos cada año"],"c":1,"x":"La 8.1 pide planificar y controlar los procesos, establecer criterios y asegurar que los procesos, productos o servicios externos pertinentes para el SGSI están controlados. Los controles 5.19 a 5.22 lo desarrollan para proveedores.","ref":"ISO/IEC 27001:2022, cláusula 8.1"},{"id":"iso-4-05","t":"unica","d":2,"q":"¿Cuándo debe repetirse la apreciación de riesgos según la cláusula 8.2?","o":["Solo al implantar el SGSI","A intervalos planificados o cuando se propongan u ocurran cambios significativos","Cada cinco años","Solo tras un incidente grave"],"c":1,"x":"La 8.2 exige realizar la apreciación a intervalos planificados y también cuando haya cambios significativos, conservando sus resultados como información documentada.","ref":"ISO/IEC 27001:2022, cláusula 8.2"},{"id":"iso-4-06","t":"vf","d":1,"q":"La cláusula 8.3 exige implementar el plan de tratamiento de riesgos y conservar información documentada de sus resultados.","c":true,"x":"Planificar el tratamiento (6.1.3) no basta: la 8.3 exige ejecutarlo y conservar los resultados. Un plan de tratamiento que lleva años sin avanzar es un hallazgo frecuente.","ref":"ISO/IEC 27001:2022, cláusula 8.3"},{"id":"iso-4-07","t":"unica","d":2,"q":"Un técnico administra el cortafuegos sin formación documentada y su jefe dice «sabe mucho». ¿Qué cláusula pide evidencia de su competencia?","o":["7.2 Competencia","7.3 Concienciación","5.3 Roles","9.1 Seguimiento"],"c":0,"x":"La 7.2 exige determinar la competencia necesaria, asegurar que la persona la tiene (por educación, formación o experiencia), tomar acciones si falta y conservar información documentada como evidencia. Sin evidencia no hay forma de demostrarla en auditoría.","ref":"ISO/IEC 27001:2022, cláusula 7.2"},{"id":"iso-4-08","t":"unica","d":1,"q":"¿Qué término usa la ISO/IEC 27001:2022 para referirse a documentos y registros?","o":["Documentos controlados","Información documentada","Evidencias formales","Registros normativos"],"c":1,"x":"Desde la estructura de alto nivel, las normas de sistemas de gestión hablan de «información documentada». Incluye lo que hay que mantener (documentos) y lo que hay que conservar (registros).","ref":"ISO/IEC 27001:2022, cláusula 7.5"},{"id":"iso-4-09","t":"unica","d":2,"q":"¿Qué tres cosas debe conocer cualquier persona de la organización según la cláusula 7.3?","o":["La política, su contribución a la eficacia del SGSI y las implicaciones de no cumplir sus requisitos","Los 93 controles del anexo A","El análisis de riesgos completo","Las contraseñas de administración"],"c":0,"x":"Concienciación: conocer la política de seguridad, saber cómo contribuye cada uno (incluidos los beneficios de mejorar) y entender las consecuencias de no cumplir. Se refuerza con el control 6.3 del anexo A (formación y concienciación).","ref":"ISO/IEC 27001:2022, cláusula 7.3"},{"id":"iso-4-10","t":"vf","d":2,"q":"La ISO/IEC 27001 exige un manual del SGSI como documento obligatorio.","c":false,"x":"La norma no exige un «manual». Exige información documentada concreta (alcance, política, proceso y resultados de riesgos, SoA, objetivos, evidencias de competencia, resultados de seguimiento, auditorías, revisiones y no conformidades) y la que la organización considere necesaria.","ref":"ISO/IEC 27001:2022, cláusula 7.5.1"}]},{"id":"iso-5","nombre":"Evaluación y mejora","resumen":"Cláusulas 9 y 10: seguimiento y medición, auditoría interna, revisión por la dirección, no conformidades y mejora continua.","preguntas":[{"id":"iso-5-01","t":"multiple","d":2,"q":"Para el seguimiento y la medición (9.1), ¿qué debe determinar la organización?","o":["Qué es necesario seguir y medir","Los métodos, para que los resultados sean válidos","Cuándo se hace y quién lo hace","Cuándo se analizan y evalúan los resultados y quién lo hace","Qué herramienta SIEM comprar"],"c":[0,1,2,3],"x":"La 9.1 pide determinar qué medir, cómo (resultados comparables y reproducibles), cuándo y quién mide, y cuándo y quién analiza. Los resultados se conservan como información documentada.","ref":"ISO/IEC 27001:2022, cláusula 9.1"},{"id":"iso-5-02","t":"unica","d":2,"q":"¿Qué requisito clave deben cumplir los auditores internos?","o":["Ser externos a la organización","Ser objetivos e imparciales en el proceso de auditoría","Tener una certificación de auditor jefe","Pertenecer al departamento de seguridad"],"c":1,"x":"La 9.2 exige seleccionar auditores y realizar las auditorías asegurando la objetividad y la imparcialidad. En la práctica, nadie audita su propio trabajo. No exige que sean externos ni una certificación concreta.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2"},{"id":"iso-5-03","t":"unica","d":2,"q":"¿Qué debe considerar el programa de auditoría interna?","o":["Solo los controles técnicos","La importancia de los procesos afectados y los resultados de auditorías previas","Auditar todo cada mes","Las preferencias del auditor"],"c":1,"x":"El programa (frecuencia, métodos, responsabilidades, requisitos y forma de informar) debe tener en cuenta la importancia de los procesos y los resultados de auditorías anteriores. Por cada auditoría se definen criterios y alcance.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2"},{"id":"iso-5-04","t":"multiple","d":2,"q":"¿Qué entradas debe considerar la revisión por la dirección (9.3.2)?","o":["El estado de las acciones de revisiones anteriores","Cambios en las cuestiones internas y externas","Cambios en las necesidades y expectativas de las partes interesadas","Información sobre el desempeño: no conformidades, mediciones, auditorías y objetivos","La lista de proveedores de material de oficina"],"c":[0,1,2,3],"x":"Entre las entradas están: acciones previas, cambios en el contexto y en las partes interesadas (este último añadido en 2022), información de desempeño, retroalimentación de las partes interesadas, resultados de riesgos y estado del plan de tratamiento, y oportunidades de mejora.","ref":"ISO/IEC 27001:2022, cláusula 9.3.2"},{"id":"iso-5-05","t":"unica","d":2,"q":"¿Cuál debe ser el resultado de la revisión por la dirección?","o":["Un informe técnico de vulnerabilidades","Decisiones sobre oportunidades de mejora y necesidades de cambio en el SGSI, documentadas","El certificado ISO","La aprobación del presupuesto de marketing"],"c":1,"x":"Las salidas de la 9.3.3 son decisiones sobre mejora y sobre cambios en el SGSI. Debe haber información documentada como evidencia de los resultados.","ref":"ISO/IEC 27001:2022, cláusula 9.3.3"},{"id":"iso-5-06","t":"unica","d":2,"q":"Ante una no conformidad, ¿qué secuencia pide la cláusula 10.2?","o":["Ocultarla hasta la siguiente auditoría","Reaccionar (controlarla y corregirla), evaluar si hay que eliminar sus causas, implantar acciones, revisar su eficacia y cambiar el SGSI si es necesario","Despedir al responsable","Solo corregir el efecto"],"c":1,"x":"La 10.2 distingue corrección (tratar el efecto) y acción correctiva (eliminar la causa para que no se repita). Hay que revisar la eficacia de las acciones y conservar evidencias de la naturaleza de la no conformidad y de los resultados.","ref":"ISO/IEC 27001:2022, cláusula 10.2"},{"id":"iso-5-07","t":"unica","d":3,"q":"Tras una fuga, se cambia la contraseña comprometida y se cierra el caso. ¿Qué falta para cumplir la 10.2?","o":["Nada: ya está corregido","Analizar la causa raíz y aplicar una acción correctiva para que no se repita, revisando su eficacia","Comprar un antivirus","Notificarlo a la entidad de certificación"],"c":1,"x":"Cambiar la contraseña es una corrección. La acción correctiva exige analizar por qué ocurrió (por ejemplo, falta de doble factor o reutilización de contraseñas), actuar sobre la causa y comprobar después que funcionó. Conecta con el control 5.27 (aprender de los incidentes).","ref":"ISO/IEC 27001:2022, cláusula 10.2 y anexo A 5.27"},{"id":"iso-5-08","t":"vf","d":2,"q":"En la ISO/IEC 27001:2022, la cláusula 10.1 trata la mejora continua y la 10.2 las no conformidades y acciones correctivas.","c":true,"x":"La edición de 2022 invirtió el orden respecto a 2013 para alinearse con la estructura armonizada: 10.1 Mejora continua y 10.2 No conformidad y acción correctiva.","ref":"ISO/IEC 27001:2022, cláusula 10"},{"id":"iso-5-09","t":"unica","d":2,"q":"Un indicador del SGSI cambia cada trimestre de fórmula y los datos no se pueden comparar. ¿Qué requisito falla?","o":["9.1: los métodos deben producir resultados comparables y reproducibles","7.4: comunicación","6.3: cambios","Ninguno"],"c":0,"x":"La 9.1 exige que los métodos de seguimiento y medición produzcan resultados comparables y reproducibles para que sean válidos. Si la fórmula cambia sin control, no se puede evaluar la tendencia.","ref":"ISO/IEC 27001:2022, cláusula 9.1"},{"id":"iso-5-10","t":"unica","d":1,"q":"¿A quién deben comunicarse los resultados de las auditorías internas?","o":["A la dirección pertinente","Solo al auditor jefe","A todos los clientes","A nadie: son confidenciales"],"c":0,"x":"La 9.2.2 pide asegurar que los resultados se informan a la dirección pertinente y conservar información documentada del programa y de los resultados.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2"}]},{"id":"iso-6","nombre":"Anexo A · Controles organizacionales","resumen":"Los 37 controles del tema 5: políticas, activos, accesos, proveedores, incidentes, continuidad y cumplimiento.","preguntas":[{"id":"iso-6-01","t":"unica","d":1,"q":"¿Qué control del anexo A cubre el inventario de la información y otros activos asociados?","o":["5.9","5.12","8.1","7.10"],"c":0,"x":"5.9 es el inventario de información y otros activos asociados, con sus propietarios. 5.12 es la clasificación, 8.1 los dispositivos de usuario final y 7.10 los soportes de almacenamiento.","ref":"ISO/IEC 27001:2022, anexo A 5.9"},{"id":"iso-6-02","t":"unica","d":2,"q":"Un empleado deja la empresa y se lleva el portátil corporativo. ¿Qué control se incumple principalmente?","o":["5.11 Devolución de activos","5.7 Inteligencia de amenazas","8.11 Enmascaramiento de datos","5.35 Revisión independiente"],"c":0,"x":"5.11 exige que el personal y otras partes devuelvan los activos de la organización al cambiar o terminar su relación. Se complementa con 6.5 (responsabilidades tras la baja) y con la retirada de accesos (5.18).","ref":"ISO/IEC 27001:2022, anexo A 5.11"},{"id":"iso-6-03","t":"unica","d":2,"q":"¿Qué controles tratan el ciclo de vida de la identidad y de los derechos de acceso?","o":["5.16 Gestión de identidades y 5.18 Derechos de acceso","5.1 y 5.2","8.20 y 8.21","6.1 y 6.2"],"c":0,"x":"5.16 trata el ciclo de vida completo de las identidades; 5.18 la provisión, revisión, modificación y retirada de derechos de acceso. 5.15 da el marco de control de acceso y 5.17 cubre la información de autenticación.","ref":"ISO/IEC 27001:2022, anexo A 5.15 a 5.18"},{"id":"iso-6-04","t":"multiple","d":2,"q":"¿Qué controles organizacionales tratan la seguridad con proveedores?","o":["5.19 Seguridad en las relaciones con proveedores","5.20 Tratamiento de la seguridad en los acuerdos con proveedores","5.21 Gestión de la seguridad en la cadena de suministro TIC","5.22 Seguimiento, revisión y gestión de cambios de los servicios de proveedores","5.37 Procedimientos operativos documentados"],"c":[0,1,2,3],"x":"Del 5.19 al 5.22 cubren el ciclo con proveedores: política y procesos, requisitos en contratos, cadena de suministro TIC y seguimiento de los servicios. 5.23 añade los servicios en la nube. 5.37 trata los procedimientos operativos.","ref":"ISO/IEC 27001:2022, anexo A 5.19 a 5.23"},{"id":"iso-6-05","t":"unica","d":2,"q":"Ordena el ciclo de gestión de incidentes del anexo A:","o":["5.24 Planificación y preparación → 5.25 Evaluación y decisión sobre eventos → 5.26 Respuesta → 5.27 Aprendizaje → 5.28 Recopilación de evidencias","5.26 → 5.24 → 5.28 → 5.25","5.28 → 5.27 → 5.26 → 5.25","5.25 → 5.24 → 5.27 → 5.26"],"c":0,"x":"Primero se planifica y prepara (5.24), luego se evalúa si un evento es incidente (5.25), se responde (5.26), se aprende para reducir la probabilidad o el impacto futuro (5.27) y se recogen evidencias de forma adecuada (5.28). 6.8 cubre la notificación de eventos por las personas.","ref":"ISO/IEC 27001:2022, anexo A 5.24 a 5.28"},{"id":"iso-6-06","t":"unica","d":2,"q":"¿Qué diferencia hay entre los controles 5.29 y 5.30?","o":["5.29 mantiene la seguridad de la información durante una interrupción; 5.30 asegura que las TIC estén preparadas para la continuidad del negocio","Son el mismo control en dos idiomas","5.29 es sobre copias y 5.30 sobre cifrado","5.29 es físico y 5.30 tecnológico"],"c":0,"x":"5.29 se ocupa de mantener la seguridad durante una disrupción. 5.30, nuevo en 2022, exige planificar, implantar, mantener y probar la preparación de las TIC según los objetivos de continuidad (basados en el BIA).","ref":"ISO/IEC 27001:2022, anexo A 5.29 y 5.30"},{"id":"iso-6-07","t":"unica","d":1,"q":"¿Qué control trata la separación de funciones incompatibles para reducir el fraude o el error?","o":["5.3 Segregación de funciones","5.2 Roles y responsabilidades","8.2 Derechos de acceso privilegiados","6.4 Proceso disciplinario"],"c":0,"x":"La segregación de funciones (5.3) separa tareas en conflicto: por ejemplo, quien solicita un pago no lo aprueba, y quien desarrolla no despliega en producción sin revisión.","ref":"ISO/IEC 27001:2022, anexo A 5.3"},{"id":"iso-6-08","t":"unica","d":2,"q":"Un SOC recibe boletines sobre una campaña de ransomware dirigida a su sector y ajusta sus reglas de detección. ¿Qué control nuevo está aplicando?","o":["5.7 Inteligencia de amenazas","8.8 Gestión de vulnerabilidades técnicas","5.5 Contacto con las autoridades","8.16 Seguimiento de actividades"],"c":0,"x":"5.7 pide recopilar y analizar información sobre amenazas para producir inteligencia útil y aplicarla. 5.6 (contacto con grupos de interés) puede ser la fuente, y 8.16 el lugar donde se usa, pero el control de inteligencia es el 5.7.","ref":"ISO/IEC 27001:2022, anexo A 5.7"},{"id":"iso-6-09","t":"unica","d":2,"q":"¿Qué control exige que un tercero independiente revise periódicamente el enfoque de la seguridad de la información?","o":["5.35 Revisión independiente de la seguridad de la información","5.36 Cumplimiento de políticas y normas","9.2 Auditoría interna","5.31 Requisitos legales"],"c":0,"x":"5.35 pide revisiones independientes a intervalos planificados o ante cambios significativos. 5.36 trata la comprobación del cumplimiento de políticas internas, y 9.2 es una cláusula, no un control del anexo A.","ref":"ISO/IEC 27001:2022, anexo A 5.35"},{"id":"iso-6-10","t":"unica","d":2,"q":"Una organización etiqueta como «Confidencial» los informes de auditoría y define cómo enviarlos. ¿Qué controles aplica?","o":["5.12 Clasificación, 5.13 Etiquetado y 5.14 Transferencia de la información","8.10 Eliminación","7.7 Puesto despejado","5.33 Protección de registros"],"c":0,"x":"Clasificar según las necesidades de seguridad (5.12), etiquetar conforme a ese esquema (5.13) y aplicar reglas para transferirla por cualquier medio (5.14) forman una cadena coherente.","ref":"ISO/IEC 27001:2022, anexo A 5.12 a 5.14"}]},{"id":"iso-7","nombre":"Anexo A · Personas, físicos y tecnológicos","resumen":"Los temas 6, 7 y 8: del proceso de selección al desarrollo seguro, pasando por accesos, copias y registros.","preguntas":[{"id":"iso-7-01","t":"unica","d":1,"q":"¿Cuántos controles tiene cada tema del anexo A de 2022?","o":["Organizacionales 37, personas 8, físicos 14, tecnológicos 34","Organizacionales 34, personas 14, físicos 8, tecnológicos 37","25 en cada tema","Organizacionales 40, personas 10, físicos 10, tecnológicos 33"],"c":0,"x":"37 + 8 + 14 + 34 = 93. Es una pregunta clásica de examen de fundamentos y ayuda a orientarse por la numeración: 5.x, 6.x, 7.x y 8.x.","ref":"ISO/IEC 27001:2022, anexo A"},{"id":"iso-7-02","t":"unica","d":2,"q":"¿Qué control de personas exige comprobar los antecedentes de los candidatos antes de incorporarlos?","o":["6.1 Investigación de antecedentes","6.3 Concienciación y formación","6.6 Acuerdos de confidencialidad","5.2 Roles"],"c":0,"x":"El 6.1 pide verificar los antecedentes de los candidatos antes de su incorporación y de forma continuada, proporcionalmente a los requisitos legales, al negocio, a la clasificación de la información y a los riesgos.","ref":"ISO/IEC 27001:2022, anexo A 6.1"},{"id":"iso-7-03","t":"unica","d":2,"q":"Una teletrabajadora trabaja con datos de clientes en una cafetería. ¿Qué control del tema de personas aplica directamente?","o":["6.7 Trabajo en remoto","7.1 Perímetros de seguridad física","8.22 Segregación de redes","5.10 Uso aceptable"],"c":0,"x":"6.7 exige medidas de seguridad para el trabajo en remoto, a fin de proteger la información accedida, tratada o almacenada fuera de las instalaciones. Se apoya en 8.1 (dispositivos), 7.9 (activos fuera de las instalaciones) y 8.5 (autenticación segura).","ref":"ISO/IEC 27001:2022, anexo A 6.7"},{"id":"iso-7-04","t":"unica","d":1,"q":"¿Qué control físico es nuevo en 2022?","o":["7.4 Monitorización de la seguridad física","7.1 Perímetros","7.7 Puesto despejado y pantalla limpia","7.14 Eliminación segura de equipos"],"c":0,"x":"El 7.4 pide vigilar continuamente las instalaciones para detectar accesos físicos no autorizados (cámaras, alarmas, sensores). Los otros existían en 2013 con otra numeración.","ref":"ISO/IEC 27001:2022, anexo A 7.4"},{"id":"iso-7-05","t":"unica","d":2,"q":"En una auditoría se ven contraseñas en pósits sobre los monitores. ¿Qué control físico se incumple?","o":["7.7 Puesto de trabajo despejado y pantalla limpia","7.12 Seguridad del cableado","7.11 Instalaciones de suministro","7.13 Mantenimiento de equipos"],"c":0,"x":"El 7.7 exige reglas de puesto despejado de papeles y soportes, y de pantalla limpia. Las contraseñas a la vista también chocan con 5.17 (información de autenticación).","ref":"ISO/IEC 27001:2022, anexo A 7.7 y 5.17"},{"id":"iso-7-06","t":"unica","d":2,"q":"¿Qué control tecnológico cubre la restricción y gestión de las cuentas de administrador?","o":["8.2 Derechos de acceso privilegiados","8.3 Restricción del acceso a la información","8.5 Autenticación segura","8.18 Uso de programas de utilidad privilegiados"],"c":0,"x":"8.2 exige restringir y gestionar la asignación y el uso de los derechos de acceso privilegiados. 8.18 limita las utilidades capaces de saltarse controles y 8.5 trata la autenticación.","ref":"ISO/IEC 27001:2022, anexo A 8.2"},{"id":"iso-7-07","t":"multiple","d":2,"q":"¿Cuáles de estos son controles tecnológicos nuevos de 2022?","o":["8.9 Gestión de la configuración","8.10 Eliminación de la información","8.12 Prevención de fugas de datos","8.16 Seguimiento de actividades","8.13 Copias de seguridad"],"c":[0,1,2,3],"x":"Del tema 8 son nuevos 8.9, 8.10, 8.11, 8.12, 8.16, 8.23 y 8.28. El 8.13 (copias de seguridad) ya existía en 2013 como A.12.3.1.","ref":"ISO/IEC 27001:2022, anexo A 8"},{"id":"iso-7-08","t":"unica","d":2,"q":"Hay copias diarias, pero nunca se ha probado una restauración. ¿Qué exige el control 8.13?","o":["Nada más: basta con hacer las copias","Mantener y probar regularmente las copias según la política de copias acordada","Cifrarlas con un algoritmo concreto","Guardarlas solo en cinta"],"c":1,"x":"El 8.13 pide mantener copias de la información, el software y los sistemas, y probarlas periódicamente según la política. Una copia que nunca se ha restaurado no demuestra que se pueda recuperar.","ref":"ISO/IEC 27001:2022, anexo A 8.13"},{"id":"iso-7-09","t":"unica","d":2,"q":"Los servidores tienen la hora desfasada varios minutos y los registros no cuadran entre sistemas. ¿Qué control lo aborda?","o":["8.17 Sincronización de relojes","8.15 Registro de eventos","8.6 Gestión de la capacidad","8.14 Redundancia"],"c":0,"x":"El 8.17 exige sincronizar los relojes con fuentes de tiempo aprobadas. Sin hora común no se puede correlacionar un incidente entre sistemas, y los registros (8.15) pierden valor como evidencia.","ref":"ISO/IEC 27001:2022, anexo A 8.17"},{"id":"iso-7-10","t":"unica","d":3,"q":"Un equipo de desarrollo prueba con una copia de la base de datos de producción con datos personales reales. ¿Qué controles se ven afectados?","o":["8.33 Información de pruebas y 8.11 Enmascaramiento de datos (además de 8.31, separación de entornos)","7.13 Mantenimiento de equipos","5.5 Contacto con las autoridades","8.23 Filtrado web"],"c":0,"x":"El 8.33 exige seleccionar, proteger y gestionar adecuadamente la información de pruebas. El 8.11 propone enmascarar o anonimizar los datos. El 8.31 separa los entornos de desarrollo, pruebas y producción. También entra en juego la protección de datos personales (5.34).","ref":"ISO/IEC 27001:2022, anexo A 8.11, 8.31, 8.33 y 5.34"}]},{"id":"iso-8","nombre":"Certificación y auditoría","resumen":"Cómo se certifica un SGSI: etapas, seguimiento, no conformidades y los principios de auditoría de la ISO 19011.","preguntas":[{"id":"iso-8-01","t":"unica","d":1,"q":"¿Cuánto dura un certificado ISO/IEC 27001 y qué auditorías hay durante su vigencia?","o":["1 año, sin seguimientos","3 años, con auditorías de seguimiento al menos anuales y recertificación al final del ciclo","5 años con una revisión intermedia","Indefinido"],"c":1,"x":"El ciclo de certificación es de 3 años: auditoría inicial, seguimientos al menos anuales (el primero dentro de los 12 meses siguientes a la decisión de certificación) y recertificación antes de que caduque.","ref":"ISO/IEC 17021-1 · ISO/IEC 27006-1"},{"id":"iso-8-02","t":"unica","d":2,"q":"En la auditoría inicial de certificación, ¿qué se revisa en la etapa 1?","o":["La eficacia de todos los controles en producción","La documentación, el alcance y si la organización está preparada para la etapa 2","Solo los registros de incidentes","Las nóminas del personal"],"c":1,"x":"La etapa 1 revisa la documentación del SGSI, el alcance, el contexto y la preparación (por ejemplo, si se han hecho la auditoría interna y la revisión por la dirección) para planificar la etapa 2. La etapa 2 evalúa la implantación y la eficacia.","ref":"ISO/IEC 17021-1 (auditoría inicial de certificación) · ISO/IEC 27006-1"},{"id":"iso-8-03","t":"unica","d":2,"q":"¿Qué norma regula los requisitos de las entidades que certifican sistemas de gestión de seguridad de la información?","o":["ISO/IEC 27006-1 (junto con la ISO/IEC 17021-1)","ISO/IEC 27002","ISO 9001","ISO/IEC 27005"],"c":0,"x":"Las entidades de certificación se acreditan conforme a la ISO/IEC 17021-1 (requisitos generales para certificar sistemas de gestión) y la ISO/IEC 27006-1 (requisitos específicos para SGSI). En España acredita la ENAC.","ref":"ISO/IEC 17021-1 · ISO/IEC 27006-1"},{"id":"iso-8-04","t":"unica","d":2,"q":"No se ha realizado ninguna revisión por la dirección desde que se implantó el SGSI. ¿Cómo se clasifica habitualmente?","o":["Observación","No conformidad menor","No conformidad mayor: falta por completo un requisito de la norma","Oportunidad de mejora"],"c":2,"x":"La ausencia total de un requisito, o un fallo que pone en duda la eficacia del sistema, se clasifica como no conformidad mayor. Si la revisión existiera pero le faltara una entrada, sería menor.","ref":"ISO/IEC 27001:2022, cláusula 9.3 · ISO/IEC 17021-1"},{"id":"iso-8-05","t":"unica","d":2,"q":"De 40 bajas de personal revisadas, en una el acceso se retiró con dos días de retraso; el resto, en plazo. ¿Cómo se clasifica habitualmente?","o":["No conformidad mayor","No conformidad menor: un fallo puntual que no compromete la eficacia del sistema","No es un hallazgo","Motivo para retirar el certificado"],"c":1,"x":"Un incumplimiento aislado, con el proceso funcionando en general, suele ser una no conformidad menor (o incluso una observación, según el criterio de la entidad). Requiere corrección y análisis de causa.","ref":"ISO/IEC 17021-1 · ISO/IEC 27001:2022, anexo A 5.18"},{"id":"iso-8-06","t":"multiple","d":2,"q":"¿Cuáles son principios de auditoría de la ISO 19011:2018?","o":["Integridad","Presentación imparcial","Enfoque basado en la evidencia","Enfoque basado en riesgos","Rentabilidad de la auditoría"],"c":[0,1,2,3],"x":"Son siete: integridad, presentación imparcial, debido cuidado profesional, confidencialidad, independencia, enfoque basado en la evidencia y enfoque basado en riesgos (añadido en 2018). La rentabilidad no es un principio.","ref":"ISO 19011:2018, cap. 4"},{"id":"iso-8-07","t":"unica","d":2,"q":"En la terminología de auditoría, ¿qué es un «hallazgo»?","o":["Cualquier documento que entrega el auditado","El resultado de evaluar la evidencia recopilada frente a los criterios de auditoría","La conclusión final de la auditoría","Una vulnerabilidad técnica"],"c":1,"x":"Criterios: los requisitos de referencia. Evidencia: registros, declaraciones de hechos u otra información verificable. Hallazgo: el resultado de evaluar la evidencia frente a los criterios (conformidad, no conformidad u oportunidad de mejora). Conclusión: el resultado final, considerando los objetivos y todos los hallazgos.","ref":"ISO 19011:2018, cap. 3"},{"id":"iso-8-08","t":"unica","d":1,"q":"Una auditoría de una empresa a uno de sus proveedores, ¿de qué tipo es?","o":["De primera parte","De segunda parte","De tercera parte","De certificación"],"c":1,"x":"Primera parte: interna, de la organización sobre sí misma. Segunda parte: de un cliente (o en su nombre) sobre su proveedor. Tercera parte: de una organización independiente, como una entidad de certificación.","ref":"ISO 19011:2018, apdo. 3 e introducción"},{"id":"iso-8-09","t":"vf","d":2,"q":"Con una no conformidad mayor abierta en la etapa 2, la entidad de certificación puede conceder el certificado si la organización promete corregirla.","c":false,"x":"Ante una no conformidad mayor, la entidad debe verificar la corrección y las acciones correctivas antes de decidir la certificación. Para las menores suele bastar con aceptar el plan de acción y comprobarlo en el siguiente seguimiento.","ref":"ISO/IEC 17021-1 (decisión de certificación)"},{"id":"iso-8-10","t":"unica","d":3,"q":"Un auditor interno del área de sistemas tiene que auditar el proceso de copias de seguridad que él mismo diseñó. ¿Qué debería hacerse?","o":["Nada: es quien mejor lo conoce","Asignar otro auditor para preservar la objetividad y la imparcialidad","Que la auditoría la apruebe su jefe","Excluir las copias del programa"],"c":1,"x":"Auditar el propio trabajo rompe la independencia de la ISO 19011 y la objetividad e imparcialidad exigidas por la cláusula 9.2. Se reasigna la auditoría a otra persona, interna o externa.","ref":"ISO/IEC 27001:2022, cláusula 9.2.2 · ISO 19011:2018, cap. 4"}]}]},{"id":"continuidad","nombre":"Continuidad de negocio","corto":"BCM","color":"cont","icono":"lifebuoy","descripcion":"Del análisis de impacto a la vuelta a la normalidad: BIA, estrategias de recuperación, planes BCP y DRP, gestión de crisis y pruebas.","fuente":"Redacción propia con referencia a ISO 22301:2019, ISO/IEC 27001:2022 (5.29, 5.30, 8.13, 8.14), RD 311/2022 (op.cont) y CCN-STIC 803","salas":[{"id":"cont-1","nombre":"Conceptos y BIA","resumen":"RTO, RPO, MTPD y MBCO, y cómo el análisis de impacto los fija para cada actividad.","preguntas":[{"id":"cont-1-01","t":"unica","d":1,"q":"¿Qué indica el RTO (objetivo de tiempo de recuperación)?","o":["La cantidad máxima de datos que se puede perder","El tiempo en que una actividad o sistema debe estar recuperado tras una interrupción","El tiempo medio entre fallos","El tiempo de vida de una copia de seguridad"],"c":1,"x":"El RTO es el plazo objetivo para reanudar la actividad o recuperar el recurso. La pérdida máxima de datos aceptable es el RPO. La CCN-STIC 803 lo define como el tiempo máximo que el servicio puede permanecer interrumpido.","ref":"ISO 22301:2019, cláusula 8.2.2 · CCN-STIC 803, apdo. 2.2.2"},{"id":"cont-1-02","t":"unica","d":1,"q":"Una base de datos se copia cada 4 horas. ¿Cuánta información se puede perder como máximo si falla justo antes de la siguiente copia?","o":["Ninguna","Hasta 4 horas de datos: ese es el RPO real que ofrece la estrategia","24 horas","Depende del RTO"],"c":1,"x":"El RPO mide cuánta información (expresada en tiempo) se puede perder. Con copias cada 4 horas, el peor caso son 4 horas de datos. Si el BIA fija un RPO de 1 hora, esa estrategia no lo cumple.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 8.13"},{"id":"cont-1-03","t":"unica","d":2,"q":"¿Qué es el MTPD (periodo máximo tolerable de interrupción)?","o":["El tiempo tras el cual el impacto de no reanudar la actividad se vuelve inaceptable","El tiempo que tarda el proveedor en responder","El tiempo de vigencia del plan","El tiempo máximo de una prueba"],"c":0,"x":"El MTPD marca el límite a partir del cual las consecuencias son inaceptables. El RTO se fija siempre por debajo del MTPD, con margen para imprevistos.","ref":"ISO 22301:2019, cláusula 8.2.2"},{"id":"cont-1-04","t":"vf","d":1,"q":"El RTO de una actividad debe ser menor que su MTPD.","c":true,"x":"Si el RTO fuera igual o mayor que el MTPD, la organización llegaría (o superaría) el punto de impacto inaceptable antes de recuperarse. La regla es RTO < MTPD.","ref":"ISO 22301:2019, cláusula 8.2.2"},{"id":"cont-1-05","t":"unica","d":2,"q":"¿Qué es el MBCO (objetivo mínimo de continuidad del negocio)?","o":["El presupuesto mínimo del plan","El nivel mínimo de servicio aceptable durante una disrupción","El número mínimo de personas del comité de crisis","La frecuencia mínima de las pruebas"],"c":1,"x":"El MBCO es el nivel mínimo de servicio o producción aceptable para lograr los objetivos durante la disrupción. La CCN-STIC 803 indica que debe alcanzarse antes de que venza el RTO.","ref":"ISO 22301:2019, cláusula 8.3 · CCN-STIC 803, apdo. 2.2.2"},{"id":"cont-1-06","t":"multiple","d":2,"q":"¿Qué debe identificar un análisis de impacto en el negocio (BIA)?","o":["Las actividades que soportan los productos y servicios","El impacto de no realizarlas a lo largo del tiempo","Los plazos priorizados para reanudarlas","Las dependencias y recursos que necesitan, incluidos proveedores","El precio de las acciones de la empresa"],"c":[0,1,2,3],"x":"El BIA identifica actividades, valora su impacto en el tiempo con criterios definidos, fija los plazos de reanudación (MTPD y RTO) y determina sus dependencias y recursos (personas, TIC, información, instalaciones y proveedores).","ref":"ISO 22301:2019, cláusula 8.2.2"},{"id":"cont-1-07","t":"unica","d":2,"q":"En el ENS, ¿con qué nivel de disponibilidad se exige el análisis de impacto (op.cont.1)?","o":["Desde nivel BAJO","Desde nivel MEDIO","Solo en nivel ALTO","Nunca: es voluntario"],"c":1,"x":"op.cont.1 se aplica con disponibilidad de nivel MEDIO o ALTO. Pide determinar los requisitos de disponibilidad de cada servicio y los elementos críticos para prestarlo.","ref":"RD 311/2022, anexo II, op.cont.1","cita":"Se realizará un análisis de impacto que permita determinar los requisitos de disponibilidad de cada servicio (impacto de una interrupción durante un periodo de tiempo determinado), así como los elementos que son críticos para la prestación de cada servicio."},{"id":"cont-1-08","t":"unica","d":3,"q":"La función A depende de la función B. A tiene un RTO de 4 horas, pero B tarda 8 en recuperarse. ¿Qué ocurre?","o":["Nada: cada función tiene su RTO","A no puede cumplir su RTO: su recuperación real está limitada por la de B, que hay que acelerar o sustituir con una alternativa","Se aumenta el RTO de A a 8 horas sin más","Se elimina la dependencia del BIA"],"c":1,"x":"Una actividad no se recupera antes que aquello de lo que depende. El BIA debe cruzar dependencias: o se acorta la recuperación de B, o se diseña una alternativa para A, o se revisa el RTO con la dirección si el impacto lo permite.","ref":"ISO 22301:2019, cláusulas 8.2.2 y 8.3"},{"id":"cont-1-09","t":"unica","d":2,"q":"¿En qué se diferencian el BIA y la evaluación de riesgos en continuidad?","o":["Son lo mismo","El BIA mide las consecuencias de interrumpir actividades en el tiempo; la evaluación de riesgos estima qué podría causar la interrupción y con qué probabilidad","El BIA es técnico y el análisis de riesgos es legal","El BIA lo hace el auditor"],"c":1,"x":"El BIA responde a «qué pasa si se para esto y durante cuánto tiempo»; la evaluación de riesgos responde a «qué podría pararlo». La ISO 22301 los trata juntos en la cláusula 8.2 y ambos alimentan la estrategia.","ref":"ISO 22301:2019, cláusulas 8.2.2 y 8.2.3"},{"id":"cont-1-10","t":"vf","d":2,"q":"Algunos servicios solo son críticos en ciertos periodos (por ejemplo, el cierre de nóminas), y sus requisitos de disponibilidad pueden variar en el tiempo.","c":true,"x":"La CCN-STIC 803 habla de periodos críticos: el responsable del servicio los determina y el de la seguridad ajusta la valoración y las medidas a cada periodo, por ejemplo con servicios alternativos o un ANS más exigente.","ref":"CCN-STIC 803, apdo. 2.2.1"}]},{"id":"cont-2","nombre":"Estrategias y soluciones","resumen":"Cómo elegir la solución de recuperación según el RTO y el RPO: alta disponibilidad, sitios hot, warm y cold, y recuperación en la nube.","preguntas":[{"id":"cont-2-01","t":"unica","d":1,"q":"¿Qué tipo de sitio alternativo tiene la infraestructura y los datos replicados, listo para conmutar en poco tiempo?","o":["Cold site","Warm site","Hot site","Sitio de archivo"],"c":2,"x":"Hot site: equipado y con datos replicados, conmutación en horas o menos. Warm site: infraestructura disponible, pero hay que restaurar datos y configurar (de horas a un día). Cold site: espacio y suministros; el equipamiento llega tras el desastre (días o semanas).","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 5.30"},{"id":"cont-2-02","t":"unica","d":2,"q":"Un servicio tiene un RTO de 30 minutos y un RPO cercano a cero. ¿Qué solución encaja?","o":["Copia en cinta semanal y cold site","Arquitectura activo-activo o alta disponibilidad con replicación síncrona","Warm site con copia diaria","Procedimiento manual en papel"],"c":1,"x":"Un RTO de minutos y un RPO de casi cero solo se cumplen con alta disponibilidad: dos sitios operando o conmutación automática y replicación síncrona. Es la opción más cara, y debe justificarla el BIA.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 8.14"},{"id":"cont-2-03","t":"vf","d":2,"q":"La estrategia de continuidad debe justificarse por el BIA, no por la tecnología disponible.","c":true,"x":"A menor RTO, mayor coste. La solución debe ser proporcional al impacto que mide el BIA: ni sobredimensionar sistemas poco críticos ni infradotar los críticos.","ref":"ISO 22301:2019, cláusula 8.3"},{"id":"cont-2-04","t":"multiple","d":2,"q":"¿Para qué recursos debe definir soluciones de continuidad la estrategia según la ISO 22301?","o":["Personas","Información y datos","Infraestructura física e instalaciones","Proveedores","Solo los sistemas TIC: la continuidad es un asunto técnico"],"c":[0,1,2,3],"x":"La continuidad no es solo TI. La cláusula 8.3 pide soluciones para todos los recursos que necesitan las actividades priorizadas: personas (sustitutos, teletrabajo), información, instalaciones, TIC, proveedores y socios, y también la financiación.","ref":"ISO 22301:2019, cláusula 8.3"},{"id":"cont-2-05","t":"unica","d":2,"q":"¿Qué medida del ENS exige prever medios alternativos (servicios de terceros, instalaciones, personal, equipos y comunicaciones)?","o":["op.cont.1","op.cont.2","op.cont.3","op.cont.4"],"c":3,"x":"op.cont.4 (Medios alternativos), exigida con disponibilidad ALTA, pide prever esos medios, fijar el tiempo máximo para que entren en funcionamiento y someterlos a las mismas garantías de seguridad que los originales.","ref":"RD 311/2022, anexo II, op.cont.4","cita":"Estará prevista la disponibilidad de medios alternativos para poder seguir prestando servicio cuando los medios habituales no estén disponibles."},{"id":"cont-2-06","t":"vf","d":2,"q":"En el ENS, los medios alternativos pueden tener menos medidas de seguridad que los originales porque solo se usan en emergencias.","c":false,"x":"op.cont.4.3 lo prohíbe expresamente: los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales. Un sitio de respaldo débil es la puerta de entrada perfecta en mitad de una crisis.","ref":"RD 311/2022, anexo II, op.cont.4.3","cita":"Los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales."},{"id":"cont-2-07","t":"unica","d":2,"q":"Ante un ransomware que cifra también las copias conectadas a la red, ¿qué característica de las copias resulta clave?","o":["Que estén comprimidas","Que al menos una copia esté aislada o sea inmutable, separada del repositorio original","Que se hagan cada hora","Que estén en el mismo servidor para restaurar rápido"],"c":1,"x":"Una copia que el atacante puede alcanzar se cifra con todo lo demás. El ENS (mp.info.6 R2) pide guardar al menos una copia en un lugar diferente, de forma que un incidente no afecte a la vez al original y a la copia. La inmutabilidad o la desconexión (offline) son la forma habitual de lograrlo.","ref":"RD 311/2022, anexo II, mp.info.6 r2 · ISO/IEC 27001:2022, anexo A 8.13"},{"id":"cont-2-08","t":"unica","d":2,"q":"Si ninguna solución TIC asequible cumple el RTO de una actividad, ¿qué se hace?","o":["Se ignora la actividad","Se diseña un procedimiento alternativo de negocio (por ejemplo, operar de forma manual o degradada) o se revisa el RTO con la dirección","Se miente en el BIA","Se contrata cualquier proveedor"],"c":1,"x":"La continuidad incluye soluciones de negocio, no solo técnicas: procedimientos manuales, ampliación de plazos, otro canal de atención. Si aun así no se llega, la dirección debe decidir conscientemente sobre el riesgo.","ref":"ISO 22301:2019, cláusula 8.3"},{"id":"cont-2-09","t":"unica","d":2,"q":"¿Qué control del anexo A de la ISO/IEC 27001 pide redundancia suficiente en las instalaciones de tratamiento para cumplir los requisitos de disponibilidad?","o":["8.14 Redundancia de las instalaciones de tratamiento de la información","8.6 Gestión de la capacidad","7.11 Instalaciones de suministro","5.29 Seguridad durante la interrupción"],"c":0,"x":"El 8.14 trata la redundancia de las instalaciones de tratamiento. La CCN-STIC 825 lo relaciona como principal con op.cont.4 del ENS (medios alternativos), aunque como parcialmente análogo.","ref":"ISO/IEC 27001:2022, anexo A 8.14 · CCN-STIC 825"},{"id":"cont-2-10","t":"unica","d":3,"q":"Un proveedor crítico de nube aloja el servicio principal. ¿Qué medida de continuidad es la más sólida?","o":["Confiar en su ANS sin más","Verificar su capacidad de continuidad, recogerla en el contrato y prever una alternativa (otra región u otro proveedor) acorde al BIA","Pedirle un certificado por correo","Hacer copias en el mismo proveedor y la misma región"],"c":1,"x":"La dependencia de un tercero se gestiona con evidencias de su continuidad, cláusulas contractuales (ISO/IEC 27001 5.20 y 5.23; ENS op.ext y op.nub) y una alternativa real. Las copias en el mismo proveedor y región comparten su punto único de fallo.","ref":"ISO 22301:2019, cláusula 8.3 · ISO/IEC 27001:2022, anexo A 5.20 y 5.23 · RD 311/2022, op.cont.2.3"}]},{"id":"cont-3","nombre":"Planes, crisis y comunicación","resumen":"Qué contiene un plan de continuidad (BCP), un plan de recuperación (DRP), cómo se activa y cómo se comunica en una crisis.","preguntas":[{"id":"cont-3-01","t":"unica","d":1,"q":"¿En qué se diferencian un BCP y un DRP?","o":["Son sinónimos","El BCP mantiene las actividades de negocio durante la interrupción; el DRP recupera la infraestructura y los sistemas TIC","El DRP es para desastres naturales y el BCP para ciberataques","El BCP lo hace TI y el DRP la dirección"],"c":1,"x":"El plan de continuidad (BCP) se centra en el negocio: cómo seguir prestando las funciones críticas, aunque sea en modo degradado. El plan de recuperación ante desastres (DRP) es técnico: cómo restaurar los sistemas, en qué orden y cómo validar su integridad.","ref":"ISO 22301:2019, cláusula 8.4 · ISO/IEC 27001:2022, anexo A 5.30"},{"id":"cont-3-02","t":"multiple","d":2,"q":"Según op.cont.2 del ENS, ¿qué debe contemplar el plan de continuidad?","o":["Funciones, responsabilidades y actividades","Coordinación de la entrada en servicio de los medios alternativos","Medios alternativos planificados y materializados en acuerdos o contratos","Formación específica de las personas afectadas por el plan","La compra de un seguro de ciberriesgo"],"c":[0,1,2,3],"x":"op.cont.2 exige además que el plan sea parte integral y armónica de los planes de continuidad de la organización en otras materias. El seguro puede ser una opción de tratamiento del riesgo, pero no es requisito de la medida.","ref":"RD 311/2022, anexo II, op.cont.2"},{"id":"cont-3-03","t":"unica","d":2,"q":"¿Qué caracteriza a unos buenos criterios de activación del plan?","o":["Que dependan de la intuición del director","Que sean objetivos y estén ligados al BIA (por ejemplo, una interrupción que superará un porcentaje del RTO), con quién puede activar y su sustituto","Que se activen solo con autorización del auditor","Que solo contemplen incendios"],"c":1,"x":"Activar tarde es uno de los errores más caros. Los criterios deben ser medibles, estar ligados a los tiempos del BIA y dejar claro quién decide (titular y sustituto, disponibles 24×7) y cómo se registra la decisión.","ref":"ISO 22301:2019, cláusula 8.4.2"},{"id":"cont-3-04","t":"unica","d":2,"q":"En una crisis, ¿quién suele autorizar la comunicación externa (clientes, medios, autoridades)?","o":["Cualquier empleado que tenga información","El comité de crisis, según el plan de comunicación","El proveedor afectado","Nadie: en crisis no se comunica"],"c":1,"x":"La ISO 22301 pide procedimientos de comunicación interna y externa (8.4.3). Lo habitual es que el comité de crisis decida y autorice qué se dice, a quién y por qué canal, con mensajes preparados y portavoces designados.","ref":"ISO 22301:2019, cláusula 8.4.3"},{"id":"cont-3-05","t":"unica","d":2,"q":"Tras restaurar un sistema después de un ciberataque, ¿qué paso es imprescindible antes de devolverlo a producción?","o":["Cambiar el logotipo","Comprobar la integridad del sistema operativo, el firmware y la configuración","Esperar a la auditoría anual","Borrar los registros para ahorrar espacio"],"c":1,"x":"El refuerzo R2 de op.cont.2 del ENS lo pide: ante una caída o discontinuidad, comprobar la integridad del sistema operativo, el firmware y los ficheros de configuración. Restaurar sin validar puede reintroducir al atacante.","ref":"RD 311/2022, anexo II, op.cont.2 r2","cita":"Ante una caída o discontinuidad del sistema, se deberá comprobar la integridad del sistema operativo, del firmware y de los ficheros de configuración."},{"id":"cont-3-06","t":"vf","d":2,"q":"En el ENS, el plan de continuidad del sistema debe ser parte integral y armónica de los planes de continuidad de la organización en otras materias.","c":true,"x":"op.cont.2.5 lo exige: la continuidad TIC no puede ir por libre respecto a los planes de la organización (instalaciones, personas, emergencias). Un único organigrama de crisis evita mandos duplicados.","ref":"RD 311/2022, anexo II, op.cont.2.5"},{"id":"cont-3-07","t":"unica","d":2,"q":"¿Qué es un registro de decisiones (decision log) en la gestión de una crisis?","o":["El inventario de activos","Un registro con hora de cada decisión, quién la tomó y en qué se basó","El acta de la revisión por la dirección","La lista de proveedores"],"c":1,"x":"Permite reconstruir la gestión, justificarla ante auditores y autoridades y aprender después. Es una evidencia muy valorada en las auditorías de continuidad.","ref":"ISO 22301:2019, cláusula 8.4.2"},{"id":"cont-3-08","t":"unica","d":3,"q":"Durante la crisis, el equipo de TI activa un acceso remoto temporal sin doble factor «para ir más rápido». ¿Qué control de la ISO/IEC 27001 se incumple?","o":["5.29 Seguridad de la información durante la interrupción","7.4 Monitorización física","6.1 Investigación de antecedentes","8.28 Codificación segura"],"c":0,"x":"El 5.29 pide planificar cómo mantener la seguridad durante una disrupción. Las prisas de una crisis no justifican abrir puertas: los atajos deben estar previstos y controlados en el plan.","ref":"ISO/IEC 27001:2022, anexo A 5.29"},{"id":"cont-3-09","t":"multiple","d":2,"q":"¿Qué debería incluir el DRP de un sistema crítico?","o":["El orden de restauración según las dependencias","Los pasos técnicos detallados (runbook) y sus responsables","Los criterios de éxito para validar la recuperación","La ubicación de las copias y de las credenciales de emergencia","Las opiniones personales del equipo sobre el proveedor"],"c":[0,1,2,3],"x":"Un DRP útil se ejecuta bajo presión: dice qué se restaura primero (dependencias), cómo, quién lo hace, cómo se sabe que ha funcionado y dónde está lo necesario (copias, credenciales custodiadas, contactos).","ref":"ISO 22301:2019, cláusulas 8.4.4 y 8.4.5 · ISO/IEC 27001:2022, anexo A 5.30"},{"id":"cont-3-10","t":"unica","d":2,"q":"Una brecha de datos personales durante una crisis, ¿qué obligación adicional activa?","o":["Ninguna","Notificar a la autoridad de protección de datos en un máximo de 72 horas si hay riesgo para las personas (RGPD, art. 33)","Esperar a terminar la crisis para notificar","Notificar solo a la entidad de certificación"],"c":1,"x":"El RGPD obliga a notificar la brecha a la autoridad de control sin dilación y, si es posible, en 72 horas, salvo que sea improbable que suponga un riesgo. El plan de comunicación debe incluir al DPD y este canal.","ref":"Reglamento (UE) 2016/679, art. 33"}]},{"id":"cont-4","nombre":"Pruebas y mejora","resumen":"Programa de ejercicios, tipos de prueba, lecciones aprendidas y evidencias para la auditoría.","preguntas":[{"id":"cont-4-01","t":"unica","d":1,"q":"¿Qué es un ejercicio de mesa (tabletop)?","o":["Una prueba de carga de servidores","Una sesión de discusión en la que el equipo recorre un escenario y sus decisiones sin activar los sistemas reales","La restauración completa del CPD","Un simulacro de evacuación del edificio"],"c":1,"x":"El tabletop es el ejercicio más barato y uno de los más útiles: con un escenario y un moderador, el equipo comprueba si sabe qué hacer, quién decide y qué falta en el plan. No toca los sistemas.","ref":"ISO 22301:2019, cláusula 8.5"},{"id":"cont-4-02","t":"unica","d":2,"q":"Ordena los ejercicios de menor a mayor realismo e impacto en la operación:","o":["Revisión documental → tabletop → simulación → prueba técnica de recuperación → prueba completa","Prueba completa → tabletop → simulación","Simulación → revisión documental → prueba completa","Todos tienen el mismo impacto"],"c":0,"x":"Un programa maduro empieza por ejercicios de bajo riesgo y escala hacia pruebas reales de conmutación. La prueba completa es la más realista, pero también la que más puede afectar al servicio, por eso se planifica con cuidado.","ref":"ISO 22301:2019, cláusula 8.5"},{"id":"cont-4-03","t":"unica","d":2,"q":"En el ENS, ¿con qué nivel de disponibilidad son obligatorias las pruebas periódicas del plan de continuidad (op.cont.3)?","o":["BAJO","MEDIO","ALTO","En todos los niveles"],"c":2,"x":"op.cont.3 solo se exige con disponibilidad de nivel ALTO, igual que op.cont.2 y op.cont.4. Busca localizar y corregir errores o deficiencias del plan.","ref":"RD 311/2022, anexo II, op.cont.3","cita":"Se realizarán pruebas periódicas para localizar y, en su caso, corregir los errores o deficiencias que puedan existir en el plan de continuidad."},{"id":"cont-4-04","t":"vf","d":1,"q":"Una prueba de continuidad que «falla» es un fracaso que conviene ocultar al auditor.","c":false,"x":"Encontrar fallos es precisamente el objetivo de probar. Lo que se audita es que se prueba, que se registran los resultados y que las lecciones aprendidas se convierten en acciones de mejora.","ref":"ISO 22301:2019, cláusulas 8.5 y 10"},{"id":"cont-4-05","t":"multiple","d":2,"q":"¿Qué evidencias de continuidad suele pedir un auditor?","o":["El BIA aprobado y vigente","El plan con su versión, propietario y fecha de revisión","Informes de pruebas con resultados y acciones","Contratos con los medios alternativos","Las contraseñas de los administradores"],"c":[0,1,2,3],"x":"El auditor busca trazabilidad: BIA → estrategia → plan → pruebas → mejora, con documentos aprobados, contratos de los medios alternativos (op.cont.2.3) y registros. Nunca debe pedir ni ver contraseñas.","ref":"ISO 22301:2019, cláusulas 8 y 9 · RD 311/2022, op.cont.2.3"},{"id":"cont-4-06","t":"unica","d":2,"q":"¿Cuándo debe revisarse el plan de continuidad, además de a intervalos planificados?","o":["Nunca, una vez aprobado","Tras cambios significativos, tras las pruebas y tras incidentes reales","Solo cuando cambie la normativa","Cuando lo pida un cliente"],"c":1,"x":"La ISO 22301 pide evaluar la documentación y las capacidades de continuidad a intervalos planificados, tras incidentes o activaciones y tras cambios significativos (cláusula 8.6). Un plan con nombres de personas que ya no están no sirve.","ref":"ISO 22301:2019, cláusula 8.6"},{"id":"cont-4-07","t":"unica","d":2,"q":"En una prueba, la restauración de la base de datos de nóminas tarda 11 horas y su RTO es de 8. ¿Qué procede?","o":["Cambiar el RTO a 12 horas para que cuadre","Registrar el resultado, analizar la causa y definir acciones (mejorar el procedimiento, la tecnología o la alternativa de negocio), y volver a probar","Repetir la prueba hasta que salga bien por casualidad","No documentarla"],"c":1,"x":"Una prueba que no cumple el RTO es un hallazgo valioso. Se trata como una no conformidad: análisis de causa, acción correctiva y nueva prueba. Cambiar el RTO solo es legítimo si el BIA lo justifica y la dirección lo acepta.","ref":"ISO 22301:2019, cláusulas 8.5 y 10.1"},{"id":"cont-4-08","t":"unica","d":2,"q":"¿Qué control de la ISO/IEC 27001 exige probar la preparación de las TIC para la continuidad?","o":["5.30","5.1","8.23","6.4"],"c":0,"x":"El 5.30 pide planificar, implantar, mantener y probar la preparación de las TIC según los objetivos de continuidad. La CCN-STIC 825 lo relaciona con op.cont.3 (pruebas periódicas) del ENS.","ref":"ISO/IEC 27001:2022, anexo A 5.30 · CCN-STIC 825"},{"id":"cont-4-09","t":"unica","d":3,"q":"Un tabletop revela que nadie sabe dónde están las credenciales de emergencia del hipervisor. ¿Qué acción es la correcta?","o":["Apuntarlas en el propio plan en texto claro","Custodiarlas de forma segura (sobre lacrado, caja fuerte o gestor con acceso de emergencia), documentar el procedimiento de acceso y probarlo","Ignorarlo: en una crisis real aparecerán","Pedírselas al proveedor cuando ocurra"],"c":1,"x":"Las credenciales de emergencia deben estar disponibles cuando hagan falta y protegidas cuando no. Escribirlas en el plan las expone; no tenerlas localizadas bloquea la recuperación. Se resuelve con custodia segura y un procedimiento probado.","ref":"ISO/IEC 27001:2022, anexo A 5.17 y 5.30"},{"id":"cont-4-10","t":"vf","d":2,"q":"Las lecciones aprendidas de un ejercicio deben traducirse en acciones con responsable y plazo, y verificarse en la siguiente prueba.","c":true,"x":"Es el ciclo de mejora (ISO 22301, 8.6 y 10): sin responsable, plazo y verificación, las lecciones se quedan en un acta que nadie vuelve a leer.","ref":"ISO 22301:2019, cláusulas 8.6 y 10"}]}]}],"maquinas":[{"id":"m-copias","nombre":"Copias de Hespéride","dificultad":"Fácil","icono":"hardDrive","marcos":["ENS","27001"],"empresa":"Hespéride Servicios Digitales, S.L. (ficticia)","brief":"Hespéride presta un servicio de registro electrónico a varias diputaciones y está certificada en el ENS de categoría MEDIA. Su sistema de expedientes tiene disponibilidad de nivel MEDIO. Antes de la auditoría bienal, te piden revisar la gestión de copias de seguridad.","evidencias":[{"titulo":"NOR-COP-01 · Normativa de copias (extracto)","tipo":"doc","texto":"3. Alcance: servidores de expedientes y base de datos de registro.\n4. Frecuencia: copia completa los domingos e incremental diaria a las 02:00.\n5. Almacenamiento: las copias se guardan en la cabina NAS-02, en el mismo CPD que los servidores.\n6. Retención: «la que permita el espacio disponible».\n7. Acceso: el equipo de sistemas (6 personas) tiene acceso de administración a la NAS-02.\n8. Pruebas de restauración: se realizarán cuando se considere necesario."},{"titulo":"Registro de restauraciones · últimos 24 meses","tipo":"tabla","texto":"Fecha        Sistema        Motivo                          Resultado\n2024-11-03   Expedientes    Borrado accidental de carpeta   Parcial (faltan 2 días)\n(sin más registros)"},{"titulo":"Entrevista al responsable del sistema","tipo":"nota","texto":"«Las copias funcionan, el software envía un correo cada noche con \"OK\". Probar restauraciones completas es arriesgado, no queremos tocar producción. La retención la decidimos según el espacio que queda.»"}],"flags":[{"id":"m-copias-f1","tipo":"user","nombre":"Flag de usuario · El punto débil","t":"unica","d":1,"q":"Con disponibilidad de nivel MEDIO, ¿qué refuerzo de mp.info.6 incumple claramente la normativa NOR-COP-01?","o":["R1: pruebas regulares de recuperación","R2: copia en lugar separado","R3: cifrado de las copias","Ninguno: cumple el nivel MEDIO"],"c":0,"x":"Nivel MEDIO exige mp.info.6 + R1: los procedimientos de copia y restauración deben probarse regularmente. «Cuando se considere necesario» y una sola restauración parcial en dos años no lo cumplen. R2 (copia separada) solo es obligatorio en nivel ALTO, aunque aquí sería muy recomendable.","ref":"RD 311/2022, anexo II, mp.info.6 r1","pista":"Mira la tabla de la medida mp.info.6: qué se suma a la base en nivel MEDIO."},{"id":"m-copias-f2","tipo":"user","nombre":"Flag de usuario · Requisitos base","t":"multiple","d":2,"q":"¿Qué requisitos base de mp.info.6.2 están mal cubiertos en la normativa?","o":["Frecuencia de las copias","Requisitos de almacenamiento en otros lugares","Controles para el acceso autorizado a las copias","Periodicidad y plazos de retención determinados en la normativa interna"],"c":[1,2,3],"x":"La frecuencia sí está definida. Faltan: almacenamiento en otro lugar (todo está en el mismo CPD), control de acceso a las copias (seis administradores con acceso total, sin segregación) y la retención, que mp.info.6.1 exige fijar en la normativa: «la que permita el espacio» no es un plazo.","ref":"RD 311/2022, anexo II, mp.info.6.1 y 6.2","pista":"Compara punto por punto la normativa con los requisitos a) a d) de mp.info.6.2 y con el 6.1."},{"id":"m-copias-f3","tipo":"user","nombre":"Flag de usuario · El correo de «OK»","t":"unica","d":2,"q":"¿Por qué el correo nocturno de «OK» no es evidencia suficiente de que las copias son recuperables?","o":["Porque los correos no son evidencias en una auditoría","Porque solo indica que el trabajo de copia terminó, no que los datos se puedan restaurar íntegros dentro del RTO","Porque debería enviarse por SMS","Sí es evidencia suficiente"],"c":1,"x":"Un trabajo de copia puede terminar «bien» con ficheros corruptos, exclusiones mal configuradas o dependencias olvidadas. Lo que demuestra la recuperabilidad es una restauración probada, con tiempos medidos frente al RTO y el RPO (ISO/IEC 27001 8.13).","ref":"ISO/IEC 27001:2022, anexo A 8.13 · RD 311/2022, mp.info.6 r1","pista":"¿Qué demuestra exactamente ese correo?"},{"id":"m-copias-f4","tipo":"root","nombre":"Flag de root · El escenario que lo tumba todo","t":"unica","d":3,"q":"Un ransomware cifra los servidores y la NAS-02 con credenciales robadas a un administrador. ¿Qué medida habría evitado perder las copias y qué norma la exige en nivel ALTO?","o":["Un antivirus en la NAS; op.exp.6","Al menos una copia separada en un lugar diferente, que un mismo incidente no pueda alcanzar; mp.info.6 R2","Más frecuencia de copia; op.cont.1","Una segunda NAS en el mismo CPD; mp.if.1"],"c":1,"x":"Las copias en la misma ubicación y con las mismas credenciales caen con el original. mp.info.6 R2 exige, en nivel ALTO, una copia separada que un incidente no pueda afectar a la vez. Aunque Hespéride sea de nivel MEDIO, el análisis de riesgos (art. 28.2) justificaría aplicarlo: las medidas son mínimos ampliables.","ref":"RD 311/2022, anexo II, mp.info.6 r2 y art. 28.2","pista":"Busca el refuerzo de mp.info.6 que habla de un «lugar diferente»."},{"id":"m-copias-f5","tipo":"root","nombre":"Flag de root · El hallazgo","t":"unica","d":3,"q":"¿Cómo redactarías el hallazgo principal para el informe de auditoría?","o":["«Las copias no son buenas.»","«No conformidad: no existen pruebas regulares de restauración (mp.info.6 R1, exigible en nivel MEDIO). Evidencia: un único registro de restauración en 24 meses, con resultado parcial, y una normativa que deja las pruebas a criterio. Riesgo: imposibilidad de garantizar la recuperación dentro del RTO.»","«Observación: se recomienda comprar otra NAS.»","«Conformidad con salvedades.»"],"c":1,"x":"Un buen hallazgo tiene criterio (qué requisito), evidencia (qué se vio, verificable) y, si aporta valor, el riesgo o la consecuencia. Sin evidencia ni criterio, el auditado puede rebatirlo; con ellos, es incontestable.","ref":"ISO 19011:2018 (hallazgos de auditoría) · RD 311/2022, art. 31.4","pista":"Un hallazgo sólido tiene tres partes: criterio, evidencia y consecuencia."}]},{"id":"m-baja","nombre":"El exempleado","dificultad":"Fácil","icono":"users","marcos":["27001","ENS"],"empresa":"Hespéride Servicios Digitales, S.L. (ficticia)","brief":"Un analista que dejó Hespéride el 30 de junio accedió el 14 de julio a la consola de administración del gestor de expedientes. El SOC lo detectó al revisar los registros. Te piden reconstruir qué falló.","evidencias":[{"titulo":"Ticket RRHH-2291 · Baja voluntaria","tipo":"doc","texto":"Empleado: A. Ferrán · Puesto: analista de sistemas · Último día: 30/06\nChecklist de salida:\n[x] Devolución del portátil\n[x] Firma del finiquito\n[ ] Comunicar a Sistemas para retirada de accesos  ← responsable: «pendiente de asignar»\n[ ] Recordatorio de deber de confidencialidad"},{"titulo":"Registro del gestor de expedientes","tipo":"log","texto":"2025-07-14 22:41:07  login OK      user=aferran  src=85.x.x.x (VPN)  mfa=no\n2025-07-14 22:43:55  export        user=aferran  obj=EXP-2025-*  filas=1.420\n2025-07-14 22:44:30  logout        user=aferran"},{"titulo":"Configuración VPN","tipo":"nota","texto":"Autenticación de la VPN: usuario y contraseña del directorio corporativo. Doble factor «previsto para el próximo trimestre»."}],"flags":[{"id":"m-baja-f1","tipo":"user","nombre":"Flag de usuario · Proceso roto","t":"unica","d":1,"q":"¿Qué control de la ISO/IEC 27001 falló en primer lugar?","o":["5.18 Derechos de acceso (retirada al terminar la relación)","8.23 Filtrado web","7.4 Monitorización física","5.7 Inteligencia de amenazas"],"c":0,"x":"El 5.18 exige provisionar, revisar, modificar y retirar los derechos de acceso. La tarea de retirada quedó «pendiente de asignar»: el proceso de baja no tenía dueño. En el ENS, op.acc.6.6 obliga a inhabilitar las credenciales cuando el usuario termina su relación.","ref":"ISO/IEC 27001:2022, anexo A 5.18 · RD 311/2022, op.acc.6.6","pista":"Mira la casilla sin marcar del checklist."},{"id":"m-baja-f2","tipo":"user","nombre":"Flag de usuario · La puerta","t":"unica","d":2,"q":"El acceso fue desde Internet por VPN sin doble factor. ¿Qué exige el ENS en todos los niveles para ese acceso?","o":["Nada, si la contraseña es robusta","Doble factor para el acceso desde o a través de zonas no controladas (op.acc.6 R8)","Certificado en tarjeta física obligatoriamente","Solo registro de accesos"],"c":1,"x":"op.acc.6 R8 exige doble factor (R2, R3 o R4) en el acceso desde zonas no controladas como Internet, y se aplica en todos los niveles. Con doble factor, la contraseña de un exempleado no habría bastado.","ref":"RD 311/2022, anexo II, op.acc.6 r8","pista":"Internet es el ejemplo de «zona no controlada»."},{"id":"m-baja-f3","tipo":"user","nombre":"Flag de usuario · Lo que sí funcionó","t":"unica","d":2,"q":"¿Qué control permitió detectar y reconstruir el incidente?","o":["8.15 Registro de eventos (con usuario, origen, hora y objeto)","5.11 Devolución de activos","6.6 Acuerdos de confidencialidad","8.10 Eliminación de información"],"c":0,"x":"Los registros identifican al usuario, el origen, la hora y lo que exportó: es lo que permite investigar y, en su caso, exigir responsabilidades (ENS art. 24 y op.exp.8; ISO/IEC 27001 8.15). Sin ellos, el incidente habría pasado inadvertido.","ref":"ISO/IEC 27001:2022, anexo A 8.15 · RD 311/2022, art. 24 y op.exp.8","pista":"¿Qué evidencia te ha permitido saber qué pasó?"},{"id":"m-baja-f4","tipo":"root","nombre":"Flag de root · Corrección o acción correctiva","t":"multiple","d":3,"q":"¿Qué acciones son acción correctiva (atacan la causa) y no simple corrección?","o":["Asignar un responsable fijo a la retirada de accesos en el checklist y automatizar la baja desde RRHH al directorio","Deshabilitar hoy la cuenta de aferran","Implantar doble factor en la VPN","Revisar periódicamente las cuentas activas frente a la plantilla en vigor"],"c":[0,2,3],"x":"Deshabilitar la cuenta es la corrección: trata el efecto. Las acciones correctivas eliminan las causas para que no se repita: dueño y automatización de la baja, doble factor y revisión periódica de accesos (5.18). La cláusula 10.2 exige además revisar su eficacia.","ref":"ISO/IEC 27001:2022, cláusula 10.2 y anexo A 5.18","pista":"Corrección: tapar el agujero. Acción correctiva: que no vuelva a abrirse."},{"id":"m-baja-f5","tipo":"root","nombre":"Flag de root · A quién avisar","t":"unica","d":3,"q":"Los expedientes exportados contienen datos personales de ciudadanos. Hespéride es privada y presta el servicio a diputaciones. ¿Qué notificaciones proceden?","o":["Ninguna: el empleado ya no trabaja allí","Al INCIBE-CERT por el ENS (que lo traslada al CCN-CERT), al responsable del tratamiento (las diputaciones) sin dilación como encargado, y valorar con ellas la notificación a la autoridad de protección de datos en 72 horas","Solo a la policía","Solo publicar una nota en la web"],"c":1,"x":"Como privada que presta servicios al sector público, notifica al INCIBE-CERT (art. 33.7 del ENS). Como encargada del tratamiento, debe avisar sin dilación indebida a la diputación responsable (RGPD art. 33.2), que decide la notificación a la autoridad en 72 horas (art. 33.1).","ref":"RD 311/2022, art. 33.7 · Reglamento (UE) 2016/679, art. 33","pista":"Hay dos regímenes a la vez: ENS para el incidente y RGPD para los datos personales."}]},{"id":"m-phishing","nombre":"El correo del director","dificultad":"Fácil","icono":"mail","marcos":["27001","ENS"],"empresa":"Instituto Pegaso de Formación, S.L. (ficticio)","brief":"Pegaso imparte formación en línea y tiene un SGSI certificado en ISO/IEC 27001. Un lunes a las 9:12, la mitad de la plantilla recibe un correo «urgente» del director pidiendo revisar una factura. El SOC te pasa lo que ha encontrado.","evidencias":[{"titulo":"Correo recibido","tipo":"doc","texto":"De: Director General <direccion@pegaso-formacion.co>\nPara: todo-personal@pegaso-formacion.es\nAsunto: URGENTE - Factura pendiente antes de las 12:00\n\nNecesito que reviséis esta factura antes del mediodía o perderemos el contrato.\nAcceded con vuestro usuario corporativo: https://pegaso-formacion.co/factura\n\nGracias, enviado desde mi móvil."},{"titulo":"Regis
