/* El ojo de Argos, dibujado con algo de realismo: esclerótica en almendra, iris con los tonos del pavo real, estrías,
 * anillo limbal, pupila con brillos, sombra del párpado y pestañas. Se pinta en un sistema de 64 × 64 centrado en (32, 32).
 * k: prefijo único de ids (evita ids repetidos en el DOM). */
let logoN = 0;
function ojoSvg(k, lashes = true, lid = 'var(--eye-lid)') {
  const almendra = 'M8 32C16 19.5 24 15 32 15S48 19.5 56 32C48 44.5 40 49 32 49S16 44.5 8 32Z';
  const estrias = Array.from({ length: 28 }, (_, i) => { const a = (i / 28) * Math.PI * 2; const r1 = 5.2, r2 = 10.6 - (i % 3) * 0.9; return `<path d="M${(32 + Math.cos(a) * r1).toFixed(2)} ${(32 + Math.sin(a) * r1).toFixed(2)}L${(32 + Math.cos(a) * r2).toFixed(2)} ${(32 + Math.sin(a) * r2).toFixed(2)}"/>`; }).join('');
  const pest = lashes ? [[14, 25.5, 10.5, 21.5], [19.5, 21, 17, 16.2], [25.5, 17.8, 24.2, 12.6], [32, 16.6, 32, 11.2], [38.5, 17.8, 39.8, 12.6], [44.5, 21, 47, 16.2], [50, 25.5, 53.5, 21.5]].map(([x1, y1, x2, y2]) => `<path d="M${x1} ${y1}Q${((x1 + x2) / 2 + (x2 - 32) * 0.08).toFixed(1)} ${((y1 + y2) / 2 - 0.6).toFixed(1)} ${x2} ${y2}"/>`).join('') : '';
  return `<defs>
    <radialGradient id="${k}s" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".65" stop-color="#EEF2F7"/><stop offset="1" stop-color="#B9C4D2"/></radialGradient>
    <radialGradient id="${k}i" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C7FFF6"/><stop offset=".3" stop-color="#2CC6C9"/><stop offset=".62" stop-color="#1E7BD8"/><stop offset=".86" stop-color="#3A2C9E"/><stop offset="1" stop-color="#14123D"/></radialGradient>
    <linearGradient id="${k}l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050A16" stop-opacity=".55"/><stop offset=".42" stop-color="#050A16" stop-opacity="0"/></linearGradient>
    <clipPath id="${k}c"><path d="${almendra}"/></clipPath></defs>
  <path d="${almendra}" fill="url(#${k}s)"/>
  <g clip-path="url(#${k}c)">
    <circle cx="32" cy="32" r="11.4" fill="url(#${k}i)"/>
    <g stroke="#E8FFFB" stroke-opacity=".22" stroke-width=".55" stroke-linecap="round">${estrias}</g>
    <circle cx="32" cy="32" r="11.4" fill="none" stroke="#0B1430" stroke-width="1.3" stroke-opacity=".85"/>
    <circle cx="32" cy="32" r="4.7" fill="#04060C"/>
    <rect x="0" y="0" width="64" height="64" fill="url(#${k}l)"/>
    <circle cx="35.6" cy="28.4" r="2.1" fill="#FFFFFF" fill-opacity=".92"/><circle cx="28.4" cy="35.2" r=".95" fill="#FFFFFF" fill-opacity=".55"/>
  </g>
  <path d="M8 32C16 19.5 24 15 32 15S48 19.5 56 32" fill="none" style="stroke:${lid}" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M8.6 32.6C16.4 44 24.4 48.4 32 48.4S47.6 44 55.4 32.6" fill="none" style="stroke:${lid}" stroke-opacity=".55" stroke-width="1.1" stroke-linecap="round"/>
  <g fill="none" style="stroke:${lid}" stroke-width="1.15" stroke-linecap="round">${pest}</g>`;
}
/* Logotipo: el ojo sobre un cuadrado oscuro con borde iridiscente */
function logo(size = 30, cls = 'logo') {
  const k = 'lg' + (++logoN);
  return `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="${k}b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0FB5BA"/><stop offset=".55" stop-color="#2F6BFF"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="#0B1220"/><rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#${k}b)" stroke-opacity=".7" stroke-width="2"/><g transform="translate(32 33) scale(1.12) translate(-32 -32)">${ojoSvg(k, false, '#8FA0B6')}</g></svg>`;
}
/* Medalla de rango: el ojo rodeado de 20 ocelos de pavo real que se encienden con el progreso (de 0 a 100 ojos) */
function eyeMedal(ojos, size = 64) {
  const k = 'em' + (++logoN); const seg = 20; const on = Math.round((Math.min(100, ojos) / 100) * seg);
  const ocelos = Array.from({ length: seg }, (_, i) => {
    const a = (i / seg) * Math.PI * 2 - Math.PI / 2; const x = (32 + Math.cos(a) * 28.5).toFixed(2); const y = (32 + Math.sin(a) * 28.5).toFixed(2);
    return i < on ? `<g transform="translate(${x} ${y}) rotate(${((a * 180) / Math.PI + 90).toFixed(1)})"><ellipse rx="2.4" ry="3.1" fill="#C9A227"/><ellipse rx="1.85" ry="2.45" fill="#13B6A8"/><ellipse cy=".25" rx="1.15" ry="1.5" fill="#1B2F8F"/><ellipse cy=".35" rx=".55" ry=".75" fill="#070B1E"/></g>`
      : `<circle cx="${x}" cy="${y}" r="1.7" fill="currentColor" opacity=".18"/>`;
  }).join('');
  return `<svg class="eye-medal" width="${size}" height="${size}" viewBox="0 0 64 64" aria-hidden="true">${ocelos}<g transform="translate(32 32) scale(.78) translate(-32 -32)">${ojoSvg(k)}</g></svg>`;
}

/* ---------- Hoy: anillos diarios, rango, continuar y repaso ---------- */
function anillos(valores) {
  // valores: [[progreso 0..1, color1, color2], …] de fuera hacia dentro, al estilo de los anillos de actividad
  const R = [72, 54, 36]; const W = 15;
  const defs = valores.map(([, a, b], i) => `<linearGradient id="rg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:${a}"/><stop offset="1" style="stop-color:${b}"/></linearGradient>`).join('');
  const arcos = valores.map(([v], i) => {
    const c = 2 * Math.PI * R[i]; const off = c * (1 - Math.max(0, Math.min(1, v)));
    return `<circle class="tr" cx="84" cy="84" r="${R[i]}" stroke-width="${W}"/><circle class="pr" cx="84" cy="84" r="${R[i]}" stroke-width="${W}" stroke="url(#rg${i})" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 84 84)"/>`;
  }).join('');
  return `<svg class="rings" viewBox="0 0 168 168" role="img" aria-label="Anillos de hoy"><defs>${defs}</defs>${arcos}</svg>`;
}
function estadoHoy() {
  const d = P.dias[hoy()] || { xp: 0, preguntas: 0, repasos: 0 };
  const pend = E.pendientes(P.respuestas, hoy()).length;

  return { d, pend, xp: d.xp / P.ajustes.meta, preg: d.preguntas / 20, rep: repasoTotal ? d.repasos / repasoTotal : 1 };
}

/* ---------- Cierre y puntuación ---------- */
function finalizar() {
  const s = ui.sesion; const hoyD = hoy();
  if (s.modo === 'simulacro') {
    clearInterval(ui.tick); ui.tick = null;
    const sim = SIM[s.id]; const res = E.corregirSimulacro(IDX, s.ids, s.resp, sim);
    for (const id of s.ids) if (s.resp[id] !== undefined) registrarRespuesta(id, E.evaluar(IDX.preguntas.get(id), s.resp[id]), 'simulacro');
    const st = P.simulacros[s.id] || { mejor: 0, aprobado: false, intentos: 0, historial: [] };
    const primeraVez = res.aprobado && !st.aprobado;
    st.intentos++; st.mejor = Math.max(st.mejor, res.nota); st.aprobado = st.aprobado || res.aprobado;
    st.historial = [...st.historial, { fecha: hoyD, nota: res.nota, ok: res.ok, total: res.total, seg: Math.round((Date.now() - s.inicio) / 1000) }].slice(-20);
    P.simulacros[s.id] = st;
    if (primeraVez) s.xp += sumarXp(E.XP.simulacro);
    s.resultado = { ...res, primeraVez, seg: Math.round((Date.now() - s.inicio) / 1000) };
  } else if (s.modo === 'sala') {
    const nota = s.ids.length ? s.aciertos / s.ids.length : 0;
    const st = P.salas[s.id] || { mejor: 0, intentos: 0, ultima: '' };
    const bonus = (nota >= 0.8 && st.mejor < 0.8 ? E.XP.sala : 0) + (nota >= 1 && st.mejor < 1 ? E.XP.salaPerfecta : 0);
    st.intentos++; st.mejor = Math.max(st.mejor, nota); st.ultima = hoyD; P.salas[s.id] = st;
    s.xp += sumarXp(bonus);
    s.resultado = { nota, ok: s.aciertos, total: s.ids.length, bonus, superada: nota >= 0.8 };
  } else {
    s.resultado = { nota: s.ids.length ? s.aciertos / s.ids.length : 0, ok: s.aciertos, total: s.ids.length };
  }
  s.logros = revisarLogros();
  s.estado = 'resumen';
  guardar(); render();
  setTimeout(() => document.getElementById('res-h')?.focus(), 0);
  celebrar(s.logros);
}

  const items = orden(q).map((oi, k) => {

/* ---------- Tarjeta para compartir (canvas → PNG) ---------- */
function dibujarTarjeta(cv) {

  const c = cv.getContext('2d'); if (!c) return;
  const W = 1200; const H = 630; const r = E.rangoDe(P.xp);
  const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#071018'); g.addColorStop(1, '#14102b'); c.fillStyle = g; c.fillRect(0, 0, W, H);
  const iri = c.createLinearGradient(0, 0, W, 0); iri.addColorStop(0, '#0FB5BA'); iri.addColorStop(0.5, '#2F6BFF'); iri.addColorStop(1, '#8B5CF6');
  // Ocelos de pavo real: los ojos abiertos del rango, alrededor del ojo de Argos
  const cx = 975; const cy = 300; const total = 36; const on = Math.round((r.ojos / 100) * total);
  for (let i = 0; i < total; i++) {
    const a = (i / total) * Math.PI * 2 - Math.PI / 2; const x = cx + Math.cos(a) * 172; const y = cy + Math.sin(a) * 172;
    c.save(); c.translate(x, y); c.rotate(a + Math.PI / 2);
    if (i < on) for (const [rx, ry, col, dy] of [[11, 14, '#C9A227', 0], [8.5, 11, '#13B6A8', 0], [5.2, 6.8, '#1B2F8F', 1.1], [2.5, 3.4, '#070B1E', 1.5]]) { c.beginPath(); c.ellipse(0, dy, rx, ry, 0, 0, Math.PI * 2); c.fillStyle = col; c.fill(); }
    else { c.beginPath(); c.arc(0, 0, 6, 0, Math.PI * 2); c.fillStyle = 'rgba(255,255,255,.08)'; c.fill(); }
    c.restore();
  }
  pintarOjo(c, cx, cy, 4.4);
  const F = '-apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif';
  c.fillStyle = '#7fe3e7'; c.font = `700 26px ${F}`; c.fillText('A R G O S  ·  LABORATORIO GRC', 70, 92);
  c.fillStyle = '#ffffff'; c.font = `800 66px ${F}`; c.fillText((P.perfil.nombre || 'Analista GRC').slice(0, 26), 70, 190);
  c.fillStyle = '#c9d6e3'; c.font = `600 34px ${F}`; c.fillText(`Rango: ${r.rango.nombre} · ${r.ojos === 1 ? '1 ojo abierto' : `${r.ojos} ojos abiertos`}`, 70, 250);
  const st = [[`${P.xp.toLocaleString('es-ES')}`, 'XP'], [`${Object.keys(P.logros).length}/${E.LOGROS.length}`, 'logros'], [`${D.maquinas.filter((m) => estMaq(m.id).completada).length}/${D.maquinas.length}`, 'máquinas']];
  st.forEach(([v, k], i) => { const x = 70 + i * 220; c.fillStyle = '#ffffff'; c.font = `800 52px ${F}`; c.fillText(v, x, 350); c.fillStyle = '#93a4b5'; c.font = `600 24px ${F}`; c.fillText(k, x, 385); });
  D.rutas.forEach((ru, i) => { const pr = E.progresoRuta(ru, P); const y = 440 + i * 46; c.fillStyle = '#c9d6e3'; c.font = `600 22px ${F}`; c.fillText(ru.nombre, 70, y); c.fillStyle = 'rgba(255,255,255,.1)'; c.fillRect(490, y - 16, 200, 14); c.fillStyle = iri; c.fillRect(490, y - 16, 200 * pr.pct, 14); c.fillStyle = '#93a4b5'; c.fillText(pct(pr.pct), 705, y); });
  c.fillStyle = '#6b7c8d'; c.font = `500 20px ${F}`; c.fillText('Laboratorio de práctica de código abierto · no es una certificación · github.com/heindall92/argos-grc', 70, 600);
}
/* El ojo de Argos en canvas, el mismo dibujo que ojoSvg() (sistema de 64 × 64, escala s) */
function pintarOjo(c, cx, cy, s) {
  c.save(); c.translate(cx - 32 * s, cy - 32 * s); c.scale(s, s);
  const almendra = () => { c.beginPath(); c.moveTo(8, 32); c.bezierCurveTo(16, 19.5, 24, 15, 32, 15); c.bezierCurveTo(40, 15, 48, 19.5, 56, 32); c.bezierCurveTo(48, 44.5, 40, 49, 32, 49); c.bezierCurveTo(24, 49, 16, 44.5, 8, 32); c.closePath(); };

  c.save(); almendra(); c.clip();
  const iris = c.createRadialGradient(32, 32, 0, 32, 32, 11.4);
  [[0, '#C7FFF6'], [0.3, '#2CC6C9'], [0.62, '#1E7BD8'], [0.86, '#3A2C9E'], [1, '#14123D']].forEach(([o, col]) => iris.addColorStop(o, col));
  c.beginPath(); c.arc(32, 32, 11.4, 0, Math.PI * 2); c.fillStyle = iris; c.fill();
  c.strokeStyle = 'rgba(232,255,251,.22)'; c.lineWidth = 0.55;
  for (let i = 0; i < 28; i++) { const a = (i / 28) * Math.PI * 2; const r2 = 10.6 - (i % 3) * 0.9; c.beginPath(); c.moveTo(32 + Math.cos(a) * 5.2, 32 + Math.sin(a) * 5.2); c.lineTo(32 + Math.cos(a) * r2, 32 + Math.sin(a) * r2); c.stroke(); }
  c.beginPath(); c.arc(32, 32, 11.4, 0, Math.PI * 2); c.strokeStyle = 'rgba(11,20,48,.85)'; c.lineWidth = 1.3; c.stroke();
  c.beginPath(); c.arc(32, 32, 4.7, 0, Math.PI * 2); c.fillStyle = '#04060C'; c.fill();
  const som = c.createLinearGradient(0, 15, 0, 49); som.addColorStop(0, 'rgba(5,10,22,.55)'); som.addColorStop(0.42, 'rgba(5,10,22,0)'); c.fillStyle = som; c.fillRect(0, 0, 64, 64);
  c.fillStyle = 'rgba(255,255,255,.92)'; c.beginPath(); c.arc(35.6, 28.4, 2.1, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(28.4, 35.2, 0.95, 0, Math.PI * 2); c.fill();
  c.restore();
  c.strokeStyle = '#A9B6C8'; c.lineCap = 'round';
  c.lineWidth = 2.6; c.beginPath(); c.moveTo(8, 32); c.bezierCurveTo(16, 19.5, 24, 15, 32, 15); c.bezierCurveTo(40, 15, 48, 19.5, 56, 32); c.stroke();
  c.globalAlpha = 0.55; c.lineWidth = 1.1; c.beginPath(); c.moveTo(8.6, 32.6); c.bezierCurveTo(16.4, 44, 24.4, 48.4, 32, 48.4); c.bezierCurveTo(39.6, 48.4, 47.6, 44, 55.4, 32.6); c.stroke(); c.globalAlpha = 1;
  c.lineWidth = 1.15;
  for (const [x1, y1, x2, y2] of [[14, 25.5, 10.5, 21.5], [19.5, 21, 17, 16.2], [25.5, 17.8, 24.2, 12.6], [32, 16.6, 32, 11.2], [38.5, 17.8, 39.8, 12.6], [44.5, 21, 47, 16.2], [50, 25.5, 53.5, 21.5]]) { c.beginPath(); c.moveTo(x1, y1); c.quadraticCurveTo((x1 + x2) / 2 + (x2 - 32) * 0.08, (y1 + y2) / 2 - 0.6, x2, y2); c.stroke(); }
  c.restore();
}

}
function exportar() {
  descargar(new Blob([JSON.stringify({ app: 'argos', version: VERSION, exportado: new Date().toISOString(), progreso: P }, null, 2)], { type: 'application/json' }), `argos-progreso-${hoy()}.json`);
  toast('Progreso exportado');
}
function importar(file) {
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { toast('El archivo es demasiado grande (máximo 5 MB).', 'error'); return; }
  const rd = new FileReader();
  rd.onerror = () => toast('No se pudo leer el archivo.', 'error');
  rd.onload = () => {
    let data; try { data = safeParse(String(rd.result)); } catch (e) { toast('El archivo no es un JSON válido.', 'error'); return; }
    if (!isObj(data) || data.app !== 'argos' || !isObj(data.progreso)) { toast('No es una copia de progreso de ARGOS.', 'error'); return; }
    confirmar('¿Sustituir tu progreso?', 'Se reemplazará el progreso de este navegador por el del archivo.', () => { P = sanear(data.progreso); guardar(); render(); toast('Progreso importado'); }, 'Importar');
  };
  rd.readAsText(file);
}

/* ===== 08-events.js ===== */
/* ---------- Eventos: un único escuchador delegado por tipo ---------- */
const ACCIONES = {
  go: (b) => go(b.dataset.view, b.dataset.param || null),
  sala: (b) => iniciarSala(b.dataset.id),
  repaso: () => iniciarRepaso(),
  simulacro: (b) => iniciarSimulacro(b.dataset.id),
  'p-opt': (b) => seleccionar(Number(b.dataset.o)),
  'p-check': () => comprobar(),
  'p-next': () => siguiente(),
  'p-sig': () => irA(ui.sesion.i + 1),
  'p-prev': () => irA(ui.sesion.i - 1),
  'p-ir': (b) => irA(Number(b.dataset.i)),
  'p-marcar': () => marcar(),
  'p-entregar': () => { const s = ui.sesion; const faltan = s.ids.length - Object.keys(s.resp).length; if (faltan) confirmar('¿Entregar el simulacro?', `Te quedan ${plural(faltan, 'pregunta', 'preguntas')} sin responder, que contarán como fallos.`, () => finalizar(), 'Entregar'); else finalizar(); },
  'p-salir': () => salir(),
  'p-cerrar': () => cerrarSesion(),
  'ev-tab': (b) => { ui.evTab[ui.param] = Number(b.dataset.i); render(); document.getElementById('evt-' + b.dataset.i)?.focus(); },
  'flag-opt': (b) => flagOpt(b.dataset.id, Number(b.dataset.o)),
  'flag-enviar': (b) => flagEnviar(b.dataset.id),
  'flag-pista': (b) => flagPista(b.dataset.id),
  color: (b) => { P.perfil.color = b.dataset.v; guardar(); render(); document.querySelector(`[data-act="color"][data-v="${b.dataset.v}"]`)?.focus(); },
  tema: (b) => { P.ajustes.tema = b.dataset.v; guardar(); render(); document.querySelector(`[data-act="tema"][data-v="${b.dataset.v}"]`)?.focus(); },
  meta: (b) => { P.ajustes.meta = Number(b.dataset.v); guardar(); render(); document.querySelector(`[data-act="meta"][data-v="${b.dataset.v}"]`)?.focus(); },
  'share-png': () => descargarTarjeta(),
  'share-text': () => copiarTexto(textoLinkedIn()),
  exportar: () => exportar(),
  importar: () => $('#file-import').click(),
  reset: () => confirmar('¿Borrar todo el progreso?', 'Se perderán tus puntos, logros y el historial de este navegador. Exporta antes si quieres conservarlo.', () => { P = nuevoProgreso(); guardar(); go('hoy'); toast('Progreso borrado'); }, 'Borrar', true),
  'help-tab': (b) => { ui.helpTab = b.dataset.tab; render(); document.querySelector(`[data-act="help-tab"][data-tab="${b.dataset.tab}"]`)?.focus(); },
  'modal-ok': () => { const a = ui.modal && ui.modal.accion; cerrarModal(); if (a) a(); },
  'modal-close': (b, ev) => { if (ev.target === b) cerrarModal(); },
  'modal-next': (b, ev) => { if (ev.target !== b && b.classList.contains('scrim')) return; const m = ui.modal; if (m && m.ids && m.ids.length > 1) { m.ids.shift(); renderModal(); } else cerrarModal(); }
};
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const fn = ACCIONES[b.dataset.act]; if (!fn) return;
  if (b.tagName === 'A') return;
  fn(b, ev);
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'pf-nombre') { P.perfil.nombre = str(ev.target.value, 60); guardar(); renderTop(); dibujarTarjeta($('#share-canvas')); }
});
$('#file-import').addEventListener('change', (ev) => { importar(ev.target.files && ev.target.files[0]); ev.target.value = ''; });

/* ---------- Teclado ---------- */
let gPend = false; let gT = null;
document.addEventListener('keydown', (ev) => {
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if (ui.modal) { if (ev.key === 'Escape') { ev.preventDefault(); cerrarModal(); } return; }
  const s = ui.sesion;
  if (s) {
    if (ev.key === 'Escape') { ev.preventDefault(); s.estado === 'resumen' ? cerrarSesion() : salir(); return; }
    if (s.estado !== 'jugando') return;
    const q = qActual(); const bloqueada = s.modo !== 'simulacro' && s.comprobada[q.id] !== undefined;
    const ord = orden(q);
    if (!bloqueada && /^[1-5]$/.test(ev.key) && q.t !== 'vf') { const k = Number(ev.key) - 1; if (ord[k] !== undefined) { ev.preventDefault(); seleccionar(ord[k]); } return; }
    if (!bloqueada && q.t === 'vf' && /^[vf12]$/i.test(ev.key)) { ev.preventDefault(); seleccionar(/^[v1]$/i.test(ev.key) ? 0 : 1); return; }
    if (ev.key === 'Enter' && !(ev.target.tagName === 'BUTTON' && ev.target.dataset.act !== 'p-opt')) {
      ev.preventDefault();
      if (s.modo === 'simulacro') { if (s.i + 1 < s.ids.length) irA(s.i + 1); return; }
      if (bloqueada) siguiente(); else comprobar();
      return;
    }
    if (s.modo === 'simulacro' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') && !enCampo) { ev.preventDefault(); irA(s.i + (ev.key === 'ArrowRight' ? 1 : -1)); }
    return;
  }
  if (enCampo) return;
  if (gPend) {
    const destino = { h: 'hoy', r: 'rutas', m: 'maquinas', s: 'simulacros', l: 'logros', p: 'perfil', a: 'ayuda' }[ev.key.toLowerCase()];
    gPend = false; clearTimeout(gT);
    if (destino) { ev.preventDefault(); go(destino); }
    return;
  }
  if (ev.key.toLowerCase() === 'g') { gPend = true; gT = setTimeout(() => { gPend = false; }, 1200); return; }
  // Pestañas de evidencias: flechas izquierda y derecha
  if (ev.target.getAttribute && ev.target.getAttribute('role') === 'tab' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    const m = MAQ[ui.param]; if (!m) return;
    const i = (Number(ev.target.dataset.i) + (ev.key === 'ArrowRight' ? 1 : -1) + m.evidencias.length) % m.evidencias.length;
    ev.preventDefault(); ui.evTab[m.id] = i; render(); document.getElementById('evt-' + i)?.focus();
  }
});
window.addEventListener('hashchange', () => { const h = desdeHash(); if (h.view !== ui.view || h.param !== ui.param) go(h.view, h.param); });
window.addEventListener('storage', (ev) => { if (ev.key === KEY && !ui.sesion) { P = sanear(store.get(KEY)); render(); } });

/* ---------- Arranque ---------- */
(function arrancar() {
  const h = desdeHash();
  if (!store.get(KEY)) guardar();
  go(h.view, h.param, { keepScroll: true });
  // Logros que el progreso ya cumple (por ejemplo, tras importar una copia antigua)
  const nuevos = revisarLogros(); if (nuevos.length) guardar();
  // Gancho para las pruebas automatizadas (solo lectura del estado y navegación)
  if (/[?&]test\b/.test(location.search)) {
    Object.defineProperty(window, '__ARGOS__', { value: Object.freeze({ go, iniciarSala, iniciarRepaso, iniciarSimulacro, finalizar, get P() { return P; }, get ui() { return ui; }, D, E }) });
  }
})();

})();
