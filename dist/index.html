<meta name="description" content="Laboratorio de práctica GRC de código abierto: ENS, ISO/IEC 27001 y continuidad de negocio por rutas, salas, casos prácticos y simulacros, con puntos, rangos y logros. Funciona sin cuentas ni servidor.">
<style>
/* ARGOS · Sistema de diseño
 * Inspiración: guías de interfaz de Apple (tipografía del sistema, títulos grandes, materiales translúcidos, objetivos de 44 px,
 * colores semánticos) con la paleta del pavo real de Argos: verde azulado, azul y violeta iridiscentes.
 * Todos los colores de texto cumplen WCAG 2.2 AA en claro y en oscuro. */

/* ---------- Tokens ---------- */
:root {
  --f: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-d: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-m: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --bg: #f2f2f7; --card: #ffffff; --card-2: #f7f7fa; --sunken: #e9e9ef; --hover: rgba(0, 0, 0, .045);
  --ink: #1c1c1e; --ink-2: #3a3a3c; --muted: #636366; --sep: rgba(60, 60, 67, .16); --sep-2: rgba(60, 60, 67, .28);
  --accent: #077682; --accent-2: #055f69; --accent-ink: #ffffff; --accent-soft: rgba(7, 118, 130, .11);
  --ens: #b8122b; --ens-soft: rgba(184, 18, 43, .09);
  --iso: #4c3fd6; --iso-soft: rgba(76, 63, 214, .09);
  --cont: #18733a; --cont-soft: rgba(24, 115, 58, .1);
  --ok: #18733a; --ok-soft: rgba(24, 115, 58, .1); --bad: #b8122b; --bad-soft: rgba(184, 18, 43, .08); --warn: #a34700; --warn-soft: rgba(163, 71, 0, .1);
  --ring-xp: #0aa5ae; --ring-xp-2: #2f6bff; --ring-q: #8b5cf6; --ring-q-2: #c026d3; --ring-r: #f59e0b; --ring-r-2: #ef4444;
  --iri: linear-gradient(135deg, #0fb5ba 0%, #2f6bff 45%, #8b5cf6 75%, #14b8a6 100%);
  --iri-conic: conic-gradient(from 210deg, #0fb5ba, #2f6bff, #8b5cf6, #d946ef, #14b8a6, #0fb5ba);
  --glass: rgba(242, 242, 247, .78); --glass-line: rgba(60, 60, 67, .12);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .05);
  --shadow-lg: 0 10px 40px rgba(0, 0, 0, .14);
  --r-sm: 10px; --r: 14px; --r-lg: 20px; --r-xl: 28px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --eye-lid: #0a1220;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --card-2: #232326; --sunken: #2c2c2e; --hover: rgba(255, 255, 255, .06);
    --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #a1a1a8; --sep: rgba(84, 84, 88, .55); --sep-2: rgba(120, 120, 128, .6);
    --accent: #3fd0d6; --accent-2: #7fe3e7; --accent-ink: #00262a; --accent-soft: rgba(63, 208, 214, .14);
    --ens: #ff7a85; --ens-soft: rgba(255, 122, 133, .13); --iso: #a3a0ff; --iso-soft: rgba(163, 160, 255, .14); --cont: #5fdc8c; --cont-soft: rgba(95, 220, 140, .13);
    --ok: #5fdc8c; --ok-soft: rgba(95, 220, 140, .13); --bad: #ff7a85; --bad-soft: rgba(255, 122, 133, .12); --warn: #ffb347; --warn-soft: rgba(255, 179, 71, .13);
    --glass: rgba(18, 18, 20, .72); --glass-line: rgba(255, 255, 255, .08); --eye-lid: #a9b6c8;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --card-2: #232326; --sunken: #2c2c2e; --hover: rgba(255, 255, 255, .06);
  --ink: #f5f5f7; --ink-2: #d1d1d6; --muted: #a1a1a8; --sep: rgba(84, 84, 88, .55); --sep-2: rgba(120, 120, 128, .6);
  --accent: #3fd0d6; --accent-2: #7fe3e7; --accent-ink: #00262a; --accent-soft: rgba(63, 208, 214, .14);
  --ens: #ff7a85; --ens-soft: rgba(255, 122, 133, .13); --iso: #a3a0ff; --iso-soft: rgba(163, 160, 255, .14); --cont: #5fdc8c; --cont-soft: rgba(95, 220, 140, .13);
  --ok: #5fdc8c; --ok-soft: rgba(95, 220, 140, .13); --bad: #ff7a85; --bad-soft: rgba(255, 122, 133, .12); --warn: #ffb347; --warn-soft: rgba(255, 179, 71, .13);
  --glass: rgba(18, 18, 20, .72); --glass-line: rgba(255, 255, 255, .08); --eye-lid: #a9b6c8;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5); --shadow-lg: 0 10px 40px rgba(0, 0, 0, .6);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { font: 400 17px/1.47 var(--f); letter-spacing: -.012em; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
img, svg { display: block; }
.ic { flex: none; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.skip { position: absolute; left: 12px; top: -80px; z-index: 100; background: var(--card); color: var(--ink); padding: 10px 16px; border-radius: 12px; }
.skip:focus { top: 12px; box-shadow: var(--shadow-lg); }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.mono { font-family: var(--f-m); font-size: .86em; letter-spacing: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.center { text-align: center; }
[hidden] { display: none !important; }

/* ---------- Barra superior ---------- */
.top { position: sticky; top: 0; z-index: 30; height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 max(20px, env(safe-area-inset-left)); background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-bottom: .5px solid var(--glass-line); }
.brand { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); font: 700 1.12rem/1 var(--f-d); letter-spacing: .14em; border: 0; background: none; padding: 6px 4px; }
.brand .logo { width: 30px; height: 30px; }
.nav { display: flex; gap: 2px; padding: 3px; margin: 0 auto; background: var(--sunken); border-radius: 999px; }
.nav button { display: flex; align-items: center; gap: 7px; height: 36px; padding: 0 15px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-size: .9rem; font-weight: 500; transition: background .2s var(--ease), color .2s var(--ease); }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.top-end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); font-size: .86rem; font-weight: 600; color: var(--ink); white-space: nowrap; }
button.chip { cursor: pointer; } button.chip:hover { background: var(--card-2); }
.chip .ic { color: var(--muted); }
.chip.flame .ic { color: #f97316; }
.chip.eyes .ic { color: var(--accent); }
.avatar { --s: 36px; width: var(--s); height: var(--s); border-radius: 50%; display: grid; place-items: center; flex: none; color: #fff; font: 600 calc(var(--s) * .38)/1 var(--f-d); letter-spacing: .02em; background: var(--iri); border: 0; }
.avatar.c-teal { background: linear-gradient(135deg, #0fb5ba, #077682); } .avatar.c-indigo { background: linear-gradient(135deg, #6d63ff, #3b2fc9); }
.avatar.c-violet { background: linear-gradient(135deg, #a78bfa, #7c3aed); } .avatar.c-rose { background: linear-gradient(135deg, #fb7185, #be123c); }
.avatar.c-amber { background: linear-gradient(135deg, #fbbf24, #c2410c); } .avatar.c-green { background: linear-gradient(135deg, #4ade80, #15803d); }
.avatar.c-teal, .avatar.c-indigo, .avatar.c-violet, .avatar.c-rose, .avatar.c-amber, .avatar.c-green { text-shadow: 0 1px 1px rgba(0, 0, 0, .25); }

/* ---------- Contenido ---------- */
.main { max-width: 1120px; margin: 0 auto; padding: 28px max(20px, env(safe-area-inset-right)) 120px; }
.view:focus { outline: none; }
.lt { font: 700 2.15rem/1.12 var(--f-d); letter-spacing: -.025em; }
.lt-sub { color: var(--muted); font-size: 1.05rem; margin-top: 6px; max-width: 64ch; }
.hd { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.sec { margin-top: 34px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.sec-h h2 { font: 700 1.3rem/1.2 var(--f-d); letter-spacing: -.018em; }
.eyebrow { font-size: .76rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--card); border-radius: var(--r-lg); box-shadow: var(--shadow); border: .5px solid var(--sep); }
.pad { padding: 20px 22px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

/* ---------- Botones ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--sunken); color: var(--ink); font-weight: 600; font-size: .95rem; text-decoration: none; transition: transform .12s var(--ease), background .2s var(--ease), opacity .2s; white-space: nowrap; }
.btn:hover { background: var(--hover); box-shadow: inset 0 0 0 100px var(--hover); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { box-shadow: inset 0 0 0 100px rgba(255, 255, 255, .1); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 36px; padding: 0 14px; font-size: .86rem; }
.btn.lg { min-height: 52px; padding: 0 28px; font-size: 1.02rem; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 0; background: transparent; color: var(--ink-2); }
.icon-btn:hover { background: var(--hover); }

/* ---------- Progreso ---------- */
.bar { height: 8px; border-radius: 999px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .5s var(--ease); }
.bar.ens > i { background: var(--ens); } .bar.iso > i { background: var(--iso); } .bar.cont > i { background: var(--cont); }
.bar.iri > i { background: var(--iri); }

/* ---------- Hoy: anillos ---------- */
.today { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; }
.rings-card { display: flex; align-items: center; gap: 26px; padding: 24px; }
.rings { width: 168px; height: 168px; flex: none; }
.rings circle { fill: none; stroke-linecap: round; }
.rings .tr { stroke: var(--sunken); }
.rings .pr { transition: stroke-dashoffset 1s var(--ease); }
.ring-leg { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.ring-leg .k { display: flex; align-items: center; gap: 8px; font-size: .84rem; color: var(--muted); font-weight: 600; }
.ring-leg .k i { width: 10px; height: 10px; border-radius: 50%; }
.ring-leg .v { font: 700 1.5rem/1.15 var(--f-d); letter-spacing: -.02em; }
.ring-leg .v small { font-size: .9rem; color: var(--muted); font-weight: 600; }
.rank-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; }
.rank-card::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: var(--iri-conic); opacity: .1; filter: blur(4px); }
.rank-top { display: flex; align-items: center; gap: 14px; }
.eye-medal { width: 64px; height: 64px; flex: none; }
.rank-name { font: 700 1.45rem/1.15 var(--f-d); letter-spacing: -.02em; }
.continue { display: flex; align-items: center; gap: 18px; padding: 20px 22px; }
.continue .route-glyph { width: 52px; height: 52px; }

/* ---------- Rutas ---------- */
.route-glyph { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 14px; color: #fff; }
.route-glyph.ens { background: linear-gradient(135deg, #e5484d, #9b0f24); } .route-glyph.iso { background: linear-gradient(135deg, #7c74ff, #3b2fc9); } .route-glyph.cont { background: linear-gradient(135deg, #34c759, #146c34); }
.route-card { display: flex; flex-direction: column; gap: 14px; padding: 22px; text-align: left; border: .5px solid var(--sep); cursor: pointer; transition: transform .18s var(--ease), box-shadow .18s var(--ease); color: inherit; font: inherit; }
.route-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.route-card h3 { font: 700 1.2rem/1.2 var(--f-d); letter-spacing: -.015em; }
.route-card p { color: var(--ink-2); font-size: .92rem; }
.route-meta { display: flex; justify-content: space-between; font-size: .82rem; color: var(--muted); font-weight: 600; }
.path { display: flex; flex-direction: column; gap: 0; position: relative; }
.room { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px 18px; border-radius: var(--r-lg); position: relative; }
.room + .room { margin-top: 10px; }
.room .node { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font: 700 1.05rem/1 var(--f-d); background: var(--sunken); color: var(--ink-2); position: relative; z-index: 1; }
.room.done .node { background: var(--iri); color: #fff; }
.room.part .node { background: var(--accent-soft); color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.room h3 { font: 600 1.05rem/1.25 var(--f-d); }
.room p { font-size: .88rem; color: var(--muted); margin-top: 2px; }
.room .score { font-size: .82rem; font-weight: 600; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; }
.room .score b { color: var(--ink); }

/* ---------- Jugador (modo foco) ---------- */
.player { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
.player-top { display: flex; align-items: center; gap: 14px; padding: 10px max(16px, env(safe-area-inset-left)); height: 64px; flex: none; }
.player-top .bar { flex: 1; height: 10px; }
.player-top .count { font-size: .86rem; font-weight: 600; color: var(--muted); min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
.timer { display: inline-flex; align-items: center; gap: 6px; font: 600 .95rem/1 var(--f-m); padding: 8px 12px; border-radius: 999px; background: var(--card); border: .5px solid var(--sep); font-variant-numeric: tabular-nums; }
.timer.low { color: var(--bad); border-color: var(--bad); }
.player-body { flex: 1; overflow-y: auto; padding: 8px 20px 40px; }
.player-body:focus-visible { outline-offset: -3px; border-radius: 0; }
.qwrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; padding-top: 12px; }
.qmeta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: .76rem; font-weight: 600; background: var(--sunken); color: var(--ink-2); }
.tag.ens { background: var(--ens-soft); color: var(--ens); } .tag.iso { background: var(--iso-soft); color: var(--iso); } .tag.cont { background: var(--cont-soft); color: var(--cont); }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.warn { background: var(--warn-soft); color: var(--warn); }
.qtext { font: 600 1.42rem/1.32 var(--f-d); letter-spacing: -.018em; }
.qtext:focus { outline: none; }
.qhint { font-size: .88rem; color: var(--muted); font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px minmax(0, 1fr) 24px; align-items: center; gap: 14px; width: 100%; min-height: 60px; padding: 12px 16px; border-radius: var(--r); border: 2px solid var(--sep); background: var(--card); text-align: left; font-size: 1rem; line-height: 1.4; transition: border-color .15s var(--ease), background .15s var(--ease), transform .1s var(--ease); }
.opt:hover:not(:disabled) { border-color: var(--sep-2); background: var(--card-2); }
.opt:active:not(:disabled) { transform: scale(.99); }
.opt .key { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font: 600 .8rem/1 var(--f-m); background: var(--sunken); color: var(--ink-2); }
.opt .mark { width: 22px; height: 22px; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt[aria-checked="true"] .key { background: var(--accent); color: var(--accent-ink); }
.opt.is-ok { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-ok .key { background: var(--ok); color: #fff; }
.opt.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-bad .key { background: var(--bad); color: #fff; }
.opt.is-missed { border-style: dashed; border-color: var(--ok); }
.opt:disabled { cursor: default; }
.vf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.vf .opt { grid-template-columns: 34px minmax(0, 1fr) 24px; min-height: 64px; font-weight: 600; }
.player-foot { flex: none; padding: 14px max(20px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)); border-top: .5px solid var(--sep); background: var(--card); transition: background .25s var(--ease); }
.player-foot.ok { background: var(--ok-soft); border-top-color: var(--ok); }
.player-foot.bad { background: var(--bad-soft); border-top-color: var(--bad); }
.foot-in { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.verdict { display: flex; align-items: center; gap: 10px; font: 700 1.18rem/1.2 var(--f-d); }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }
.verdict .xp { margin-left: auto; font-size: .9rem; color: var(--ink); }
.explain { font-size: .96rem; color: var(--ink); }
.player-foot .explain { max-height: 32vh; overflow-y: auto; }
.ref { display: flex; align-items: flex-start; gap: 6px; font-size: .82rem; color: var(--muted); font-weight: 600; margin-top: 8px; }
.cita { margin-top: 10px; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--card); border-radius: 0 10px 10px 0; font-size: .9rem; color: var(--ink-2); font-style: italic; }
.cita b { font-style: normal; font-size: .76rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.navgrid button { height: 38px; border-radius: 10px; border: 1.5px solid var(--sep); background: var(--card); font: 600 .82rem/1 var(--f-m); color: var(--ink-2); }
.navgrid button.ans { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.navgrid button[aria-current="true"] { border-color: var(--ink); color: var(--ink); }
.navgrid button.flagged { box-shadow: inset 0 -3px 0 var(--warn); }

/* ---------- Resultados ---------- */
.result { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding-top: 24px; }
.result .big { font: 800 4rem/1 var(--f-d); letter-spacing: -.04em; }
.result .big.ok { background: var(--iri); -webkit-background-clip: text; background-clip: text; color: transparent; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
.stat { padding: 14px; border-radius: var(--r); background: var(--card); border: .5px solid var(--sep); }
.stat .v { font: 700 1.4rem/1.1 var(--f-d); }
.stat .k { font-size: .78rem; color: var(--muted); font-weight: 600; margin-top: 4px; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 10px; }
.review details { background: var(--card); border: .5px solid var(--sep); border-radius: var(--r); padding: 12px 16px; }
.review summary { cursor: pointer; font-weight: 600; display: flex; gap: 10px; align-items: flex-start; list-style: none; }
.review summary::-webkit-details-marker { display: none; }
.review .body { margin-top: 10px; font-size: .92rem; display: flex; flex-direction: column; gap: 6px; }

/* ---------- Máquinas ---------- */
.machine { display: flex; flex-direction: column; gap: 14px; padding: 20px; text-align: left; border: .5px solid var(--sep); cursor: pointer; color: inherit; font: inherit; transition: transform .18s var(--ease), box-shadow .18s var(--ease); position: relative; overflow: hidden; }
.machine:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.machine .m-top { display: flex; gap: 14px; align-items: center; }
.m-ico { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; background: #0d1117; color: #3fd0d6; flex: none; }
.machine h3 { font: 700 1.12rem/1.2 var(--f-d); }
.diff { font-size: .78rem; font-weight: 700; }
.diff.d-facil { color: var(--ok); } .diff.d-media { color: var(--warn); } .diff.d-dificil { color: var(--bad); }
.flags-mini { display: flex; gap: 6px; }
.flags-mini i { width: 22px; height: 6px; border-radius: 3px; background: var(--sunken); }
.flags-mini i.on { background: var(--iri); }
.brief { font-size: 1rem; color: var(--ink-2); max-width: 75ch; }
.ev-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.ev-tabs button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: .5px solid var(--sep); background: var(--card); font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.ev-tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.term { background: #0d1117; color: #d6e2ee; border-radius: var(--r); padding: 16px 18px; font: 400 .84rem/1.6 var(--f-m); white-space: pre-wrap; overflow-x: auto; letter-spacing: 0; }
.term .t-h { color: #3fd0d6; display: block; margin-bottom: 8px; font-weight: 600; }
.flag { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.flag.captured { box-shadow: inset 0 0 0 2px var(--ok); }
.flag-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.flag-h h3 { font: 600 1rem/1.3 var(--f-d); }
.flag .qtext { font-size: 1.08rem; }
.flag .opt { min-height: 50px; padding: 10px 14px; font-size: .95rem; }
.flag-err { color: var(--bad); font-weight: 600; font-size: .9rem; }
.shake { animation: shake .4s var(--ease); }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

/* ---------- Logros ---------- */
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 12px 16px; text-align: center; }
.badge .medal { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; position: relative; background: var(--sunken); color: var(--muted); }
.badge.on .medal { background: var(--iri-conic); color: #fff; box-shadow: 0 6px 20px rgba(47, 107, 255, .3); }
.badge.on .medal::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, .35), rgba(0, 0, 0, .15)); }
.badge .medal .ic { position: relative; }
.badge h3 { font: 600 .92rem/1.25 var(--f-d); }
.badge p { font-size: .78rem; color: var(--muted); }
.badge .when { font-size: .74rem; font-weight: 600; color: var(--accent); }
.ladder { display: flex; flex-direction: column; gap: 8px; }
.step { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 16px; border-radius: var(--r); }
.step.cur { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); }
.step .n { font: 700 .95rem/1 var(--f-d); color: var(--muted); text-align: center; }
.step.reached .n { color: var(--accent); }

/* ---------- Formularios ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lbl { font-size: .84rem; font-weight: 600; color: var(--ink-2); }
.input { min-height: 44px; padding: 10px 14px; border-radius: var(--r-sm); border: 1px solid var(--sep-2); background: var(--card); width: 100%; }
.input:focus { outline: 3px solid var(--accent-soft); border-color: var(--accent); }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border-radius: 12px; flex-wrap: wrap; }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; font-size: .88rem; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { --s: 40px; border: 0; padding: 0; box-shadow: 0 0 0 0 var(--accent); transition: box-shadow .15s var(--ease); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--accent); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: .5px solid var(--sep); }
.li { display: flex; align-items: center; gap: 14px; padding: 14px 20px; min-height: 52px; }

/* ---------- Ayuda ---------- */
.help-tabs { margin-bottom: 18px; }
.prose { max-width: 72ch; display: flex; flex-direction: column; gap: 12px; color: var(--ink-2); }
.prose h3 { font: 700 1.08rem/1.3 var(--f-d); color: var(--ink); margin-top: 8px; }
.prose ul { padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.legal { padding: 16px 18px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink); font-size: .9rem; display: flex; gap: 12px; }
.legal .ic { color: var(--warn); margin-top: 2px; }
.legal .lnk { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.kbd { display: inline-grid; place-items: center; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 6px; background: var(--card); border: .5px solid var(--sep-2); box-shadow: 0 1px 0 var(--sep-2); font: 600 .78rem/1 var(--f-m); }
.about-card { display: flex; gap: 18px; align-items: center; padding: 20px; }
.suite-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.suite-card { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; }
.suite-card.here { box-shadow: inset 0 0 0 2px var(--accent); }
.suite-card p { font-size: .86rem; color: var(--ink-2); flex: 1; }

/* ---------- Avisos y diálogos ---------- */
.toast { position: fixed; left: 50%; bottom: max(96px, calc(env(safe-area-inset-bottom) + 90px)); transform: translateX(-50%); z-index: 90; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-size: .92rem; font-weight: 600; box-shadow: var(--shadow-lg); max-width: calc(100vw - 32px); }
.toast.error { background: var(--bad); color: #fff; }
.scrim { position: fixed; inset: 0; z-index: 80; background: rgba(0, 0, 0, .42); display: grid; place-items: center; padding: 20px; animation: fade .2s var(--ease); }
.dialog { width: min(440px, 100%); background: var(--card); border-radius: var(--r-xl); padding: 26px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 14px; animation: pop .3s var(--ease); }
.dialog h2 { font: 700 1.3rem/1.2 var(--f-d); }
.unlock { align-items: center; text-align: center; }
.unlock .medal { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; background: var(--iri-conic); color: #fff; box-shadow: 0 10px 40px rgba(47, 107, 255, .45); animation: glow 2.4s ease-in-out infinite; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.92) translateY(10px); } }
@keyframes glow { 50% { box-shadow: 0 10px 60px rgba(139, 92, 246, .6); } }

/* ---------- Barra de pestañas (móvil) ---------- */
.tabbar { display: none; }
@media (max-width: 899px) {
  .nav { display: none; }
  .top { padding: 0 16px; }
  .top-end .chip.eyes { display: none; }
  .main { padding: 20px 16px 120px; }
  .lt { font-size: 1.85rem; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 40; height: 64px; padding: 6px; border-radius: 22px; background: var(--card); border: .5px solid var(--sep); box-shadow: var(--shadow-lg); }
  .tabbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; border-radius: 16px; background: none; color: var(--muted); font-size: .68rem; font-weight: 600; min-width: 0; }
  .tabbar button[aria-current="page"] { color: var(--accent-2); background: var(--accent-soft); }
  .today, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
  .g2 { grid-template-columns: minmax(0, 1fr); }
  .rings-card { flex-direction: column; align-items: flex-start; }
  .suite-grid { grid-template-columns: 1fr; }
  .qtext { font-size: 1.22rem; }
  .vf { grid-template-columns: 1fr; }
  .stats3 { grid-template-columns: 1fr 1fr 1fr; }
  .room { grid-template-columns: 48px minmax(0, 1fr); }
  .room .btn { grid-column: 1 / -1; }
}
@media (min-width: 900px) and (max-width: 1100px) { .nav button { padding: 0 11px; } .nav button span { font-size: .86rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; } }
@media (prefers-reduced-transparency: reduce) { .top, .tabbar { background: var(--card); backdrop-filter: none; -webkit-backdrop-filter: none; } }
@media print { .top, .tabbar, .player-foot { display: none; } }

</style>

<body>
<a class="skip" href="#view">Ir al contenido</a>
<header id="top" class="top"></header>
<main id="main" class="main">
  <div id="view" class="view" tabindex="-1"></div>
</main>
<nav id="tabbar" class="tabbar" aria-label="Secciones"></nav>
<div id="player" hidden></div>
<div id="modal" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
window.ARGOS_DATA = {"version":"1.1.0","rutas":[{"id":"ens","nombre":"Esquema Nacional de Seguridad","corto":"ENS","color":"ens","icono":"landmark","descripcion":"El marco legal de ciberseguridad del sector público español y de sus proveedores: principios, roles, categorización, medidas del anexo II, auditoría y relación con la ISO/IEC 27001.","fuente":"Real Decreto 311/2022 (BOE-A-2022-7191), guías CCN-STIC 803 y 825, MAGERIT v3","salas":[{"id":"ens-1","nombre":"Ámbito y principios básicos","resumen":"A quién se aplica el ENS y los siete principios que lo inspiran (artículos 1 a 11).","preguntas":[{"id":"ens-1-01","t":"unica","d":1,"q":"¿Qué ley establece el Esquema Nacional de Seguridad que regula el Real Decreto 311/2022?","o":["Ley 40/2015, de Régimen Jurídico del Sector Público (art. 156.2)","Ley 39/2015, del Procedimiento Administrativo Común","Ley Orgánica 3/2018, de Protección de Datos","Ley 36/2015, de Seguridad Nacional"],"c":0,"x":"El ENS está establecido en el artículo 156.2 de la Ley 40/2015. El real decreto lo regula y lo desarrolla. La Ley 36/2015 aparece en el artículo 1.3, pero como marco del Sistema de Seguridad Nacional, no como origen del ENS.","ref":"RD 311/2022, art. 1.1","cita":"Este real decreto tiene por objeto regular el Esquema Nacional de Seguridad (en adelante, ENS), establecido en el artículo 156.2 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público."},{"id":"ens-1-02","t":"vf","d":1,"q":"Una empresa privada que presta un servicio de nube a un ayuntamiento para que este ejerza sus competencias está obligada a cumplir el ENS.","c":true,"x":"El artículo 2.3 extiende el ENS a los sistemas de las entidades del sector privado que, por relación contractual, presten servicios o provean soluciones al sector público para el ejercicio de sus competencias. Incluye la obligación de tener política de seguridad.","ref":"RD 311/2022, art. 2.3","cita":"Este real decreto también se aplica a los sistemas de información de las entidades del sector privado, incluida la obligación de contar con la política de seguridad a que se refiere el artículo 12, cuando, de acuerdo con la normativa aplicable y en virtud de una relación contractual, presten servicios o provean soluciones a las entidades del sector público […]"},{"id":"ens-1-03","t":"unica","d":2,"q":"En una empresa privada sujeta al ENS por contrato con la Administración, ¿quién aprueba la política de seguridad?","o":["El responsable de la seguridad","El órgano que ostente las máximas competencias ejecutivas","El comité de seguridad de la información","La entidad pública contratante"],"c":1,"x":"Para estas entidades, el artículo 2.3 indica que la política la aprueba el órgano con las máximas competencias ejecutivas (en la práctica, la dirección o el consejo de administración). El responsable de la seguridad no aprueba la política: la propone y vela por ella.","ref":"RD 311/2022, art. 2.3","cita":"La política de seguridad a que se refiere el artículo 12 será aprobada en el caso de estas entidades por el órgano que ostente las máximas competencias ejecutivas."},{"id":"ens-1-04","t":"multiple","d":2,"q":"¿Cuáles de los siguientes son principios básicos del ENS según el artículo 5?","o":["Gestión de la seguridad basada en los riesgos","Existencia de líneas de defensa","Mínimo privilegio","Diferenciación de responsabilidades","Continuidad de la actividad"],"c":[0,1,3],"x":"Los siete principios básicos son: seguridad como proceso integral, gestión basada en los riesgos, prevención-detección-respuesta-conservación, líneas de defensa, vigilancia continua, reevaluación periódica y diferenciación de responsabilidades. «Mínimo privilegio» y «continuidad de la actividad» son requisitos mínimos (art. 12.6), no principios.","ref":"RD 311/2022, arts. 5 y 12.6"},{"id":"ens-1-05","t":"unica","d":1,"q":"Según el ENS, ¿qué excluye el principio de «seguridad como proceso integral»?","o":["La externalización de servicios de seguridad","Cualquier actuación puntual o tratamiento coyuntural","El uso de productos no certificados","La delegación de funciones en administradores"],"c":1,"x":"El artículo 6.1 define la seguridad como un proceso integral de elementos humanos, materiales, técnicos, jurídicos y organizativos, y añade que la aplicación del ENS excluye cualquier actuación puntual o tratamiento coyuntural.","ref":"RD 311/2022, art. 6.1","cita":"La aplicación del ENS estará presidida por este principio, que excluye cualquier actuación puntual o tratamiento coyuntural."},{"id":"ens-1-06","t":"unica","d":2,"q":"El principio de «existencia de líneas de defensa» exige que estas sean de naturaleza…","o":["Preventiva, detectiva y correctiva","Organizativa, física y lógica","Interna, externa y perimetral","Técnica, jurídica y humana"],"c":1,"x":"El artículo 9.2 es literal: las líneas de defensa han de estar constituidas por medidas de naturaleza organizativa, física y lógica, de forma que si una capa se compromete se pueda reaccionar y minimizar el impacto.","ref":"RD 311/2022, art. 9.2","cita":"Las líneas de defensa han de estar constituidas por medidas de naturaleza organizativa, física y lógica."},{"id":"ens-1-07","t":"unica","d":2,"q":"¿Qué cuatro responsables diferencia el ENS en los sistemas de información?","o":["De la información, del servicio, de la seguridad y del sistema","Del tratamiento, del encargado, de la seguridad y del DPD","Del activo, del riesgo, del control y del proceso","De la dirección, de la seguridad, de la auditoría y del sistema"],"c":0,"x":"El principio de diferenciación de responsabilidades (art. 11.1) distingue responsable de la información, del servicio, de la seguridad y del sistema. El responsable del tratamiento y el DPD son figuras del RGPD.","ref":"RD 311/2022, art. 11.1","cita":"En los sistemas de información se diferenciará el responsable de la información, el responsable del servicio, el responsable de la seguridad y el responsable del sistema."},{"id":"ens-1-08","t":"vf","d":2,"q":"Si un sistema sujeto al ENS trata datos personales y el análisis de riesgos del RGPD exige medidas más estrictas que las del ENS, prevalecen las del ENS por ser norma específica.","c":false,"x":"Es al revés. El artículo 3.3 dice que prevalecen las medidas derivadas del análisis de riesgos y, en su caso, de la evaluación de impacto del RGPD cuando resulten agravadas respecto de las del ENS.","ref":"RD 311/2022, art. 3.3","cita":"En todo caso, prevalecerán las medidas a implantar como consecuencia del análisis de riesgos y, en su caso, de la evaluación de impacto […], en caso de resultar agravadas respecto de las previstas en el presente real decreto."},{"id":"ens-1-09","t":"unica","d":1,"q":"Según el artículo 8, ¿a qué van dirigidas las medidas de detección?","o":["A disuadir al atacante","A descubrir la presencia de un ciberincidente","A restaurar la información afectada","A reducir la superficie de exposición"],"c":1,"x":"Prevención elimina o reduce la posibilidad de que la amenaza se materialice (puede incluir disuasión y reducción de superficie), detección descubre la presencia de un ciberincidente y respuesta restaura información y servicios.","ref":"RD 311/2022, art. 8.3","cita":"Las medidas de detección irán dirigidas a descubrir la presencia de un ciberincidente."},{"id":"ens-1-10","t":"vf","d":1,"q":"Según el ENS, la responsabilidad de la seguridad de los sistemas debe estar diferenciada de la responsabilidad sobre su explotación.","c":true,"x":"Es el artículo 11.2. Quien decide y supervisa la seguridad no debe ser quien opera el sistema: así se evita el conflicto de intereses entre «que funcione» y «que sea seguro».","ref":"RD 311/2022, art. 11.2","cita":"La responsabilidad de la seguridad de los sistemas de información estará diferenciada de la responsabilidad sobre la explotación de los sistemas de información concernidos."}]},{"id":"ens-2","nombre":"Política, roles y requisitos mínimos","resumen":"Qué debe contener la política de seguridad, qué hace cada responsable y los quince requisitos mínimos (artículos 12 a 28).","preguntas":[{"id":"ens-2-01","t":"multiple","d":2,"q":"¿Qué extremos debe incluir como mínimo el instrumento que aprueba la política de seguridad?","o":["Los objetivos o misión de la organización","El marco regulatorio de las actividades","La estructura y composición del comité o comités de seguridad","El presupuesto anual de ciberseguridad","Los riesgos derivados del tratamiento de datos personales"],"c":[0,1,2,4],"x":"El artículo 12.1 enumera: objetivos o misión, marco regulatorio, roles de seguridad con su designación y renovación, estructura del comité o comités, directrices de la documentación y riesgos del tratamiento de datos personales. El presupuesto no figura.","ref":"RD 311/2022, art. 12.1"},{"id":"ens-2-02","t":"unica","d":1,"q":"¿Quién determina los requisitos de la información tratada?","o":["El responsable del sistema","El responsable de la seguridad","El responsable de la información","El delegado de protección de datos"],"c":2,"x":"Cada responsable tiene su función (art. 13.2): el de la información determina los requisitos de la información; el del servicio, los de los servicios; el de la seguridad decide cómo satisfacerlos y supervisa; el del sistema implementa y opera.","ref":"RD 311/2022, art. 13.2.a","cita":"El responsable de la información determinará los requisitos de la información tratada"},{"id":"ens-2-03","t":"unica","d":2,"q":"Por falta de recursos, el responsable de la seguridad y el del sistema van a ser la misma persona. ¿Qué exige el ENS?","o":["Está prohibido sin excepción","Es válido sin más requisitos","Aplicar medidas compensatorias para garantizar la diferenciación de responsabilidades","Pedir autorización expresa al CCN"],"c":2,"x":"La regla es que sean distintos y sin dependencia jerárquica. Solo en situaciones excepcionales, con ausencia justificada de recursos, pueden coincidir, y entonces deben aplicarse medidas compensatorias (art. 13.3).","ref":"RD 311/2022, art. 13.3","cita":"El responsable de la seguridad será distinto del responsable del sistema, no debiendo existir dependencia jerárquica entre ambos. En aquellas situaciones excepcionales […] deberán aplicarse medidas compensatorias […]"},{"id":"ens-2-04","t":"unica","d":2,"q":"En un servicio externalizado, ¿qué figura debe designar, salvo causa justificada, la organización prestataria?","o":["Un delegado de protección de datos","Un POC (punto o persona de contacto) para la seguridad","Un auditor interno","Un responsable de la información"],"c":1,"x":"El artículo 13.5 exige al prestatario un POC de seguridad con apoyo de la dirección, que canaliza el cumplimiento, las comunicaciones de seguridad y la gestión de incidentes. Será el propio responsable de seguridad de la contratada o tendrá comunicación directa con él.","ref":"RD 311/2022, art. 13.5"},{"id":"ens-2-05","t":"vf","d":2,"q":"El artículo 14 obliga a usar MAGERIT como metodología de análisis de riesgos.","c":false,"x":"El ENS exige «alguna metodología reconocida internacionalmente», sin imponer una concreta. MAGERIT es la de referencia en la Administración española y la que usan las herramientas del CCN, pero no es obligatoria.","ref":"RD 311/2022, art. 14.2","cita":"Sin perjuicio de lo dispuesto en el anexo II, se empleará alguna metodología reconocida internacionalmente."},{"id":"ens-2-06","t":"multiple","d":2,"q":"¿Cuáles de estos son requisitos mínimos del artículo 12.6?","o":["Mínimo privilegio","Vigilancia continua","Incidentes de seguridad","Continuidad de la actividad","Reevaluación periódica"],"c":[0,2,3],"x":"Mínimo privilegio, incidentes de seguridad y continuidad de la actividad son requisitos mínimos (letras h, m y n). Vigilancia continua y reevaluación periódica son principios básicos del artículo 5.","ref":"RD 311/2022, arts. 5 y 12.6"},{"id":"ens-2-07","t":"unica","d":2,"q":"¿Qué documento formaliza la relación de medidas de seguridad seleccionadas y quién lo firma?","o":["El plan de adecuación, firmado por la dirección","La Declaración de Aplicabilidad, firmada por el responsable de la seguridad","El análisis de riesgos, firmado por el responsable del sistema","El informe de auditoría, firmado por el auditor"],"c":1,"x":"El artículo 28.2 indica que la relación de medidas seleccionadas se formaliza en la Declaración de Aplicabilidad, firmada por el responsable de la seguridad.","ref":"RD 311/2022, art. 28.2","cita":"La relación de medidas de seguridad seleccionadas se formalizará en un documento denominado Declaración de Aplicabilidad, firmado por el responsable de la seguridad."},{"id":"ens-2-08","t":"unica","d":3,"q":"Una entidad sustituye una medida del anexo II por otra compensatoria. ¿Qué es imprescindible?","o":["Que el CCN la apruebe previamente","Justificar documentalmente que protege igual o mejor, reflejar la correspondencia en la Declaración de Aplicabilidad y que la apruebe el responsable de la seguridad","Que la medida compensatoria sea un producto certificado","Que el auditor la valide antes de implantarla"],"c":1,"x":"El artículo 28.3 permite medidas compensatorias si se justifica documentalmente que protegen igual o mejor del riesgo, se cumplen principios y requisitos mínimos, se detalla la correspondencia en la Declaración de Aplicabilidad y el conjunto lo aprueba formalmente el responsable de la seguridad.","ref":"RD 311/2022, art. 28.3"},{"id":"ens-2-09","t":"unica","d":1,"q":"El artículo 24.3 exige que cada usuario que acceda al sistema esté…","o":["Autenticado con doble factor","Identificado de forma única","Formado en ciberseguridad","Registrado en el directorio corporativo"],"c":1,"x":"La identificación única permite saber en todo momento quién recibe derechos, de qué tipo y quién ha hecho cada actividad: es la base de la trazabilidad. El doble factor depende del nivel y de la medida op.acc.6.","ref":"RD 311/2022, art. 24.3","cita":"[…] cada usuario que acceda al sistema de información deberá estar identificado de forma única […]"},{"id":"ens-2-10","t":"vf","d":2,"q":"Las medidas del anexo II son un máximo: el responsable de la seguridad no puede añadir otras.","c":false,"x":"Son mínimos exigibles. El artículo 28.2 permite al responsable de la seguridad ampliarlas atendiendo al estado de la tecnología, la naturaleza de la información o los servicios y los riesgos.","ref":"RD 311/2022, art. 28.2","cita":"Las medidas a las que se refiere el apartado 1 tendrán la condición de mínimos exigibles, siendo ampliables a criterio del responsable de la seguridad […]"}]},{"id":"ens-3","nombre":"Categorización del sistema","resumen":"Las cinco dimensiones, los niveles BAJO, MEDIO y ALTO, y cómo se obtiene la categoría (artículo 40, anexo I y CCN-STIC 803).","preguntas":[{"id":"ens-3-01","t":"unica","d":1,"q":"¿Cuáles son las cinco dimensiones de seguridad del ENS?","o":["Confidencialidad, integridad, disponibilidad, autenticidad y trazabilidad","Confidencialidad, integridad, disponibilidad, resiliencia y privacidad","Confidencialidad, integridad, disponibilidad, no repudio y conservación","Confidencialidad, integridad, disponibilidad, legalidad y trazabilidad"],"c":0,"x":"El anexo I fija las dimensiones C, I, T, A y D. La ISO/IEC 27001 trabaja con las tres clásicas (C, I, D); el ENS añade autenticidad y trazabilidad.","ref":"RD 311/2022, anexo I.2"},{"id":"ens-3-02","t":"unica","d":1,"q":"Un sistema tiene C: MEDIO, I: BAJO, T: BAJO, A: MEDIO y D: ALTO. ¿Qué categoría tiene?","o":["BÁSICA","MEDIA","ALTA","Depende de la media de las dimensiones"],"c":2,"x":"La categoría la marca el nivel más alto de cualquier dimensión: basta con que una alcance ALTO para que el sistema sea de categoría ALTA. No se hacen medias.","ref":"RD 311/2022, anexo I.4","cita":"Un sistema de información será de categoría ALTA si alguna de sus dimensiones de seguridad alcanza el nivel de seguridad ALTO."},{"id":"ens-3-03","t":"unica","d":2,"q":"Un incidente causaría «la reducción significativa de la capacidad de la organización para desarrollar eficazmente sus funciones, aunque estas sigan desempeñándose». ¿Qué nivel corresponde?","o":["BAJO (perjuicio limitado)","MEDIO (perjuicio grave)","ALTO (perjuicio muy grave)","Ninguno: no afecta a las funciones"],"c":1,"x":"Reducción «apreciable» es perjuicio limitado (BAJO); reducción «significativa» es perjuicio grave (MEDIO); «anulación efectiva» de la capacidad es perjuicio muy grave (ALTO).","ref":"RD 311/2022, anexo I.3.b"},{"id":"ens-3-04","t":"unica","d":2,"q":"¿Quién efectúa la valoración de la información y los servicios, y quién determina la categoría del sistema?","o":["El responsable de la seguridad valora y el del sistema categoriza","Los responsables de la información y del servicio valoran; el responsable de la seguridad determina la categoría","El comité de seguridad hace ambas cosas","El responsable del sistema valora y la dirección categoriza"],"c":1,"x":"El artículo 41 reparte las facultades: valorar corresponde a los responsables de la información o servicios afectados; con esas valoraciones, la determinación de la categoría corresponde al responsable de la seguridad.","ref":"RD 311/2022, art. 41"},{"id":"ens-3-05","t":"unica","d":1,"q":"¿Con qué periodicidad mínima debe re-evaluarse la categoría de seguridad de los sistemas?","o":["Cada dos años, con la auditoría","Anualmente o cuando cambien significativamente los criterios","Solo cuando haya un incidente","Cada tres años"],"c":1,"x":"El anexo I.1 exige re-evaluar anualmente, o siempre que haya modificaciones significativas en los criterios de determinación. No confundir con la auditoría, que es al menos cada dos años.","ref":"RD 311/2022, anexo I.1","cita":"Anualmente, o siempre que se produzcan modificaciones significativas en los citados criterios de determinación, deberá re-evaluarse la categoría de seguridad de los sistemas de información concernidos."},{"id":"ens-3-06","t":"vf","d":2,"q":"Si un sistema es de categoría ALTA por su disponibilidad, su confidencialidad pasa automáticamente a nivel ALTO.","c":false,"x":"El anexo I.4.2 lo aclara: determinar la categoría no altera el nivel de las dimensiones que no han influido en ella. Las medidas que dependen de una dimensión se aplican según el nivel de esa dimensión.","ref":"RD 311/2022, anexo I.4.2"},{"id":"ens-3-07","t":"unica","d":2,"q":"Un sistema trata un expediente con C: ALTO y presta un servicio web con C: BAJO. ¿Qué nivel de confidencialidad tiene el sistema?","o":["BAJO","MEDIO, como término medio","ALTO","Se valoran por separado y no hay nivel de sistema"],"c":2,"x":"Cuando un sistema trata varias informaciones y servicios, su nivel en cada dimensión es el mayor de todos ellos (anexo I.3, último párrafo). La CCN-STIC 803 lo recuerda: el sistema asume el valor máximo de cada dimensión.","ref":"RD 311/2022, anexo I.3 · CCN-STIC 803"},{"id":"ens-3-08","t":"unica","d":2,"q":"Según la tabla orientativa de la CCN-STIC 803, un servicio con un RTO inferior a 4 horas tiene una disponibilidad de nivel…","o":["BAJO","MEDIO","ALTO","No se valora por RTO"],"c":2,"x":"La guía propone como referencia: RTO de menos de 4 horas, ALTO; entre 4 horas y 1 día, MEDIO; entre 1 y 5 días, BAJO. Es orientativa: la política de seguridad puede concretarla.","ref":"CCN-STIC 803, apdo. 2.2.2, tabla 2"},{"id":"ens-3-09","t":"unica","d":3,"q":"Según la CCN-STIC 803, ¿en qué orden conviene valorar?","o":["Primero la disponibilidad de los servicios y luego la información","Primero la información (C, I, T, A) y después la disponibilidad de los servicios","Primero los activos de soporte (hardware, software) y después la información","Todas las dimensiones a la vez, por sistema"],"c":1,"x":"La guía recomienda empezar por la información (confidencialidad, integridad, trazabilidad, autenticidad) y seguir con los servicios valorando su disponibilidad: los requisitos C, I, T, A de un servicio suelen venir de la información que maneja.","ref":"CCN-STIC 803, apdo. 1.2"},{"id":"ens-3-10","t":"vf","d":2,"q":"Un sistema puede segregar subsistemas que requieran un nivel de medidas distinto, siempre que se puedan delimitar la información y los servicios afectados.","c":true,"x":"El anexo II.2.2 lo permite: cada subsistema aplica su nivel de medidas con sus refuerzos, siempre que puedan delimitarse la información y los servicios.","ref":"RD 311/2022, anexo II.2.2"}]},{"id":"ens-4","nombre":"Medidas del anexo II","resumen":"Los tres grupos de medidas, cómo leer la tabla de aplicación, los refuerzos y algunas medidas clave.","preguntas":[{"id":"ens-4-01","t":"unica","d":1,"q":"¿En qué tres grupos se dividen las medidas de seguridad del anexo II?","o":["Preventivas, detectivas y correctivas","Marco organizativo [org], marco operacional [op] y medidas de protección [mp]","Personas, procesos y tecnología","Básicas, medias y altas"],"c":1,"x":"Marco organizativo: organización global de la seguridad. Marco operacional: proteger la operación del sistema. Medidas de protección: proteger activos concretos según su naturaleza y el nivel exigido.","ref":"RD 311/2022, anexo II.1.2"},{"id":"ens-4-02","t":"unica","d":1,"q":"¿Cuántas medidas de seguridad recoge el anexo II del RD 311/2022?","o":["73","93","75","114"],"c":0,"x":"El anexo II tiene 73 medidas. 93 son los controles del anexo A de la ISO/IEC 27001:2022; 75 eran las medidas del antiguo RD 3/2010; 114 los controles de la ISO/IEC 27001:2013.","ref":"RD 311/2022, anexo II · CCN-STIC 825, apdo. 4.2"},{"id":"ens-4-03","t":"unica","d":2,"q":"En la tabla del anexo II, la tercera columna indica «D» para op.cont.2 (Plan de continuidad). ¿Qué significa?","o":["Que es una medida «deseable», no obligatoria","Que se exige según el nivel de la dimensión de disponibilidad, no según la categoría","Que solo aplica a sistemas de categoría alta","Que la decide la dirección"],"c":1,"x":"La tercera columna indica si la medida se exige por categoría del sistema o por el nivel de una o varias dimensiones (con sus iniciales). op.cont.2 depende de la disponibilidad: solo aplica con D de nivel ALTO.","ref":"RD 311/2022, anexo II.2.5.a"},{"id":"ens-4-04","t":"unica","d":2,"q":"Un sistema tiene disponibilidad de nivel MEDIO. ¿Qué medidas de continuidad [op.cont] le son exigibles?","o":["Ninguna","Solo op.cont.1 (Análisis de impacto)","op.cont.1 y op.cont.2","Las cuatro"],"c":1,"x":"Con D en nivel MEDIO solo aplica el análisis de impacto (op.cont.1). El plan de continuidad, las pruebas periódicas y los medios alternativos (op.cont.2 a 4) solo se exigen con D en nivel ALTO. Con D BAJO no aplica ninguna.","ref":"RD 311/2022, anexo II, tabla · op.cont.1 a op.cont.4"},{"id":"ens-4-05","t":"unica","d":2,"q":"¿Qué indica «n.a.» en la tabla del anexo II?","o":["Que la medida no está aprobada todavía","Que no aplica a efectos de cumplimiento normativo, aunque implantarla pueda ser beneficioso","Que no existe equivalencia con la ISO 27001","Que la medida está prohibida en esa categoría"],"c":1,"x":"El anexo II.2.5.c aclara que «n.a.» significa «no aplica» a efectos de cumplimiento normativo: no es exigible, sin perjuicio de que técnicamente pueda convenir implantarla.","ref":"RD 311/2022, anexo II.2.5.c"},{"id":"ens-4-06","t":"unica","d":2,"q":"Para un sistema de categoría MEDIA, ¿qué tipo de análisis de riesgos exige op.pl.1?","o":["Informal, en lenguaje natural","Semiformal (op.pl.1 + R1), con tablas, catálogo básico de amenazas y semántica definida","Formal (op.pl.1 + R2), con fundamento matemático","Ninguno: basta la Declaración de Aplicabilidad"],"c":1,"x":"BÁSICA: análisis informal en lenguaje natural. MEDIA: añade R1, análisis semiformal con tablas. ALTA: añade R2, análisis formal con fundamento matemático reconocido internacionalmente y asunción formal del riesgo residual.","ref":"RD 311/2022, anexo II, op.pl.1"},{"id":"ens-4-07","t":"unica","d":3,"q":"Un usuario de la organización accede desde Internet a un sistema de nivel BAJO. ¿Qué exige op.acc.6 con el refuerzo R8?","o":["Contraseña robusta","Doble factor de autenticación (R2, R3 o R4)","Certificado cualificado en tarjeta física obligatoriamente","Nada: R8 solo aplica en nivel ALTO"],"c":1,"x":"R8 (doble factor para el acceso desde o a través de zonas no controladas) se exige en todos los niveles, también en BAJO. Internet es el ejemplo de zona no controlada. El doble factor puede ser R2 (contraseña más otro factor), R3 (certificado) o R4 (certificado en dispositivo físico).","ref":"RD 311/2022, anexo II, op.acc.6 r8"},{"id":"ens-4-08","t":"multiple","d":3,"q":"Para un sistema con disponibilidad de nivel ALTO, ¿qué exige mp.info.6 (Copias de seguridad)?","o":["Procedimientos de respaldo que indiquen frecuencia, almacenamiento local y en otros lugares, y control de acceso a las copias","Pruebas regulares de los procedimientos de copia y restauración (R1)","Que al menos una copia se guarde separada, en un lugar diferente (R2)","Copias inmutables en la nube","Cifrado obligatorio con algoritmos acreditados por el CCN"],"c":[0,1,2],"x":"Nivel ALTO: mp.info.6 + R1 + R2. La base pide procedimientos con frecuencia, almacenamiento local y externo y control de acceso. R1: pruebas de recuperación regulares. R2: al menos una copia separada, de forma que un incidente no afecte a la vez al original y a la copia. La inmutabilidad y el cifrado son buenas prácticas, pero esta medida no los exige.","ref":"RD 311/2022, anexo II, mp.info.6"},{"id":"ens-4-09","t":"vf","d":2,"q":"Los refuerzos de seguridad (R) siempre son acumulativos: R2 incluye necesariamente R1.","c":false,"x":"El anexo II.2.5.d aclara que los refuerzos se suman a los requisitos base, pero no siempre son incrementales entre sí. Por eso algunos aparecen como alternativas entre corchetes: [R1 o R2 o R3].","ref":"RD 311/2022, anexo II.2.5.d-e"},{"id":"ens-4-10","t":"unica","d":1,"q":"¿Qué medida del marco organizativo exige documentos que describan el uso correcto de equipos, servicios e instalaciones y lo que se considera uso indebido?","o":["org.1 Política de seguridad","org.2 Normativa de seguridad","org.3 Procedimientos de seguridad","org.4 Proceso de autorización"],"c":1,"x":"org.2 (Normativa) recoge el uso correcto y el indebido, y la responsabilidad del personal. org.1 es la política; org.3 detalla cómo operar (tareas, quién las hace, cómo reportar anomalías); org.4 regula las autorizaciones.","ref":"RD 311/2022, anexo II, org.2"}]},{"id":"ens-5","nombre":"Auditoría, conformidad e incidentes","resumen":"Auditoría bienal, declaración y certificación de conformidad, notificación de incidentes y plazos de adecuación.","preguntas":[{"id":"ens-5-01","t":"unica","d":1,"q":"¿Con qué periodicidad mínima deben auditarse ordinariamente los sistemas sujetos al ENS?","o":["Cada año","Al menos cada dos años","Cada tres años","Solo tras cambios sustanciales"],"c":1,"x":"Auditoría regular ordinaria al menos cada dos años. Además, auditoría extraordinaria cuando haya modificaciones sustanciales, que reinicia el cómputo de los dos años.","ref":"RD 311/2022, art. 31.1","cita":"Los sistemas de información comprendidos en el ámbito de aplicación de este real decreto serán objeto de una auditoría regular ordinaria, al menos cada dos años, que verifique el cumplimiento de los requerimientos del ENS."},{"id":"ens-5-02","t":"unica","d":2,"q":"Una entidad hace una auditoría extraordinaria en marzo de 2025 por un cambio sustancial. ¿Cuándo vence la siguiente ordinaria?","o":["Mantiene la fecha anterior","Marzo de 2027, porque la extraordinaria reinicia el cómputo","Marzo de 2026","No hay que hacer más ordinarias"],"c":1,"x":"La auditoría extraordinaria determina la fecha de cómputo de los dos años para la siguiente ordinaria. El plazo podría extenderse tres meses por fuerza mayor no imputable a la entidad.","ref":"RD 311/2022, art. 31.1"},{"id":"ens-5-03","t":"unica","d":1,"q":"Un sistema de categoría BÁSICA, ¿qué necesita para acreditar su conformidad con el ENS?","o":["Una auditoría de certificación por una entidad acreditada","Una autoevaluación para la declaración de conformidad (aunque puede optar a certificación)","Nada: la categoría BÁSICA está exenta","Un informe del CCN"],"c":1,"x":"BÁSICA: basta una autoevaluación para la declaración de conformidad, sin perjuicio de que pueda certificarse voluntariamente. MEDIA y ALTA: auditoría para la certificación de conformidad.","ref":"RD 311/2022, art. 38.1"},{"id":"ens-5-04","t":"unica","d":2,"q":"¿A quién se presentan los informes de auditoría y quién los analiza?","o":["Al CCN, que los analiza","Al responsable del sistema y al de la seguridad; los analiza el de la seguridad, que presenta conclusiones al del sistema","A la dirección, que decide las medidas","Al responsable de la información, que los aprueba"],"c":1,"x":"El artículo 31.5 fija el circuito: el informe va al responsable del sistema y al de la seguridad; este último lo analiza y presenta sus conclusiones al responsable del sistema para que adopte las medidas correctoras.","ref":"RD 311/2022, art. 31.5"},{"id":"ens-5-05","t":"vf","d":2,"q":"En sistemas de categoría ALTA, a la vista del dictamen de auditoría, el responsable del sistema puede suspender temporalmente su operación hasta subsanar las deficiencias.","c":true,"x":"Lo prevé el artículo 31.6 para la categoría ALTA cuando las deficiencias son graves: puede suspenderse el tratamiento de información, la prestación de servicios o toda la operación.","ref":"RD 311/2022, art. 31.6"},{"id":"ens-5-06","t":"unica","d":2,"q":"Una empresa privada que presta servicios a la Administración sufre un incidente. ¿A quién lo notifica según el ENS?","o":["Al CCN-CERT directamente","Al INCIBE-CERT, que lo pondrá en conocimiento del CCN-CERT","A la Agencia Española de Protección de Datos","Solo a la entidad pública contratante"],"c":1,"x":"El artículo 33.7 indica que las organizaciones del sector privado que prestan servicios a entidades públicas notifican al INCIBE-CERT, que lo comunica inmediatamente al CCN-CERT. Si hay brecha de datos personales, además se notifica a la AEPD por el RGPD, pero eso es otra obligación.","ref":"RD 311/2022, art. 33.7"},{"id":"ens-5-07","t":"multiple","d":2,"q":"Según el anexo III, ¿qué debe constatar la auditoría?","o":["Que la política define los roles de los responsables","Que se ha realizado un análisis de riesgos con revisión y aprobación anual","Que existe un sistema de gestión documentado aprobado regularmente por la dirección, con base en la Declaración de Aplicabilidad","Que todos los productos de seguridad son de fabricación nacional","Que existen procedimientos para resolver conflictos entre responsables"],"c":[0,1,2,4],"x":"El anexo III.1.1 enumera: roles en la política, resolución de conflictos, designación según diferenciación de responsabilidades, análisis de riesgos con revisión y aprobación anual, cumplimiento del anexo II y sistema de gestión documentado basado en la Declaración de Aplicabilidad. No exige productos nacionales.","ref":"RD 311/2022, anexo III.1.1"},{"id":"ens-5-08","t":"unica","d":2,"q":"¿De cuánto tiempo dispusieron los sistemas preexistentes para adecuarse al RD 311/2022?","o":["12 meses","18 meses","24 meses","36 meses"],"c":2,"x":"La disposición transitoria única dio veinticuatro meses desde la entrada en vigor (5 de mayo de 2022), incluidos los sistemas de contratistas privados. Los nuevos sistemas aplican el ENS desde su concepción.","ref":"RD 311/2022, disposición transitoria única"},{"id":"ens-5-09","t":"unica","d":2,"q":"En una autoevaluación de categoría BÁSICA, ¿quién puede realizarla?","o":["Solo una entidad de certificación acreditada","El mismo personal que administra el sistema o en quien este delegue","Exclusivamente el responsable de la seguridad","Un auditor externo independiente"],"c":1,"x":"El anexo III.2.1 dice que basta una autoevaluación realizada por el mismo personal que administra el sistema o en quien delegue. Debe documentarse si cada medida está implantada y sujeta a revisión, con sus evidencias.","ref":"RD 311/2022, anexo III.2.1"},{"id":"ens-5-10","t":"vf","d":1,"q":"Las entidades deben dar publicidad de sus declaraciones y certificaciones de conformidad con el ENS en sus portales de internet o sedes electrónicas.","c":true,"x":"Lo exige el artículo 38.2, en los términos de la Instrucción Técnica de Seguridad de conformidad. Por eso es habitual ver el distintivo ENS en las webs de proveedores del sector público.","ref":"RD 311/2022, art. 38.2"}]},{"id":"ens-6","nombre":"Análisis de riesgos con MAGERIT","resumen":"Activos, amenazas, salvaguardas, impacto y riesgo según la metodología MAGERIT v3 del Gobierno de España.","preguntas":[{"id":"ens-6-01","t":"unica","d":1,"q":"¿Qué es MAGERIT?","o":["Una norma ISO de gestión de riesgos","La metodología de análisis y gestión de riesgos de los sistemas de información elaborada por la Administración española","Una herramienta del CCN para auditar el ENS","El catálogo de medidas del anexo II"],"c":1,"x":"MAGERIT (versión 3) es la metodología pública de la Administración española para analizar y gestionar riesgos. La herramienta que la implementa es PILAR, del CCN. Se estructura en tres libros: método, catálogo de elementos y guía de técnicas.","ref":"MAGERIT v3, libros I a III"},{"id":"ens-6-02","t":"multiple","d":2,"q":"¿Cuáles de estos son tipos de activos del catálogo de MAGERIT?","o":["[D] Datos / Información","[S] Servicios","[P] Personal","[R] Riesgos","[L] Instalaciones"],"c":[0,1,2,4],"x":"El libro II cataloga, entre otros: [D] datos, [K] claves criptográficas, [S] servicios, [SW] software, [HW] hardware, [COM] redes, [Media] soportes, [AUX] equipamiento auxiliar, [L] instalaciones y [P] personal. Los riesgos no son un tipo de activo.","ref":"MAGERIT v3, libro II, cap. 2"},{"id":"ens-6-03","t":"unica","d":2,"q":"En el catálogo de amenazas de MAGERIT, ¿qué agrupa la categoría [E]?","o":["Desastres de origen eléctrico","Errores y fallos no intencionados","Ataques externos","Eventos ambientales"],"c":1,"x":"Las amenazas se agrupan en [N] desastres naturales, [I] de origen industrial, [E] errores y fallos no intencionados y [A] ataques intencionados. Por ejemplo, E.1 errores de los usuarios y A.5 suplantación de la identidad.","ref":"MAGERIT v3, libro II, cap. 5"},{"id":"ens-6-04","t":"unica","d":2,"q":"Un administrador borra por error una base de datos. ¿Qué categoría de amenaza de MAGERIT es?","o":["[A] Ataque intencionado","[E] Error o fallo no intencionado","[I] De origen industrial","[N] Desastre natural"],"c":1,"x":"Es un error no intencionado: E.2 «errores del administrador» o E.18 «destrucción de información». Si el borrado fuera deliberado, sería A.18 «destrucción de información», de la categoría de ataques.","ref":"MAGERIT v3, libro II, apdos. 5.3 y 5.4"},{"id":"ens-6-05","t":"unica","d":2,"q":"En MAGERIT, el impacto de una amenaza sobre un activo depende de…","o":["El valor del activo y la degradación que causa la amenaza","La probabilidad y la frecuencia de la amenaza","El coste de las salvaguardas","El número de vulnerabilidades del activo"],"c":0,"x":"Impacto = valor del activo × degradación que la amenaza causaría. El riesgo combina ese impacto con la probabilidad o frecuencia de que la amenaza se materialice.","ref":"MAGERIT v3, libro I (método)"},{"id":"ens-6-06","t":"unica","d":2,"q":"¿Qué es el riesgo residual?","o":["El riesgo antes de aplicar ninguna salvaguarda","El riesgo que queda después de aplicar las salvaguardas","El riesgo que se transfiere a un seguro","El riesgo de los activos sin valorar"],"c":1,"x":"El riesgo potencial o inherente es el que existe sin salvaguardas. El residual es el que permanece tras aplicarlas, y debe ser aceptado formalmente por quien corresponda. En el ENS de categoría ALTA, op.pl.1 R2 exige asumirlo formalmente.","ref":"MAGERIT v3, libro I · RD 311/2022, anexo II, op.pl.1 r2"},{"id":"ens-6-07","t":"unica","d":2,"q":"¿Cómo actúa una salvaguarda preventiva en MAGERIT?","o":["Reduce la degradación que causa la amenaza","Reduce la probabilidad o frecuencia de que la amenaza se materialice","Aumenta el valor del activo","Transfiere el riesgo a un tercero"],"c":1,"x":"Las salvaguardas preventivas actúan sobre la probabilidad: hacen menos frecuente la materialización. Las que limitan el daño (contención, recuperación) actúan sobre la degradación y, por tanto, sobre el impacto.","ref":"MAGERIT v3, libro I"},{"id":"ens-6-08","t":"unica","d":1,"q":"¿Qué escala usa el catálogo de MAGERIT para los criterios de valoración de los activos?","o":["De 0 a 10","De 1 a 5","Bajo, medio y alto únicamente","Porcentajes de 0 a 100"],"c":0,"x":"Las escalas estándar del libro II van de 0 a 10 con criterios por tipo de perjuicio (datos personales, obligaciones legales, seguridad, intereses comerciales…). Después se proyectan a los niveles BAJO, MEDIO y ALTO del ENS.","ref":"MAGERIT v3, libro II, cap. 4"},{"id":"ens-6-09","t":"multiple","d":3,"q":"¿Qué técnicas recoge el libro III de MAGERIT (Guía de técnicas)?","o":["Análisis mediante tablas","Árboles de ataque","Valoración Delphi","Pruebas de penetración automatizadas","Diagramas de Pareto"],"c":[0,1,2,4],"x":"El libro III recoge técnicas específicas (tablas, análisis algorítmico, árboles de ataque) y generales (técnicas gráficas como Pareto o radar, sesiones de trabajo y valoración Delphi). Las pruebas de penetración no forman parte de él.","ref":"MAGERIT v3, libro III"},{"id":"ens-6-10","t":"unica","d":3,"q":"Un análisis de riesgos identifica la amenaza A.5 sobre el servicio de sede electrónica. ¿Qué amenaza es y qué medida del ENS la mitiga principalmente?","o":["Suplantación de la identidad del usuario; los mecanismos de autenticación op.acc.5 y op.acc.6","Abuso de privilegios; op.acc.3 Segregación de funciones","Denegación de servicio; mp.s.4","Robo de equipos; mp.eq.3"],"c":0,"x":"A.5 es «suplantación de la identidad del usuario». Se mitiga sobre todo con autenticación robusta: op.acc.5 para usuarios externos (los ciudadanos de una sede) y op.acc.6 para usuarios de la organización. A.6 es abuso de privilegios y A.24, denegación de servicio.","ref":"MAGERIT v3, libro II, apdo. 5.4.3 · RD 311/2022, op.acc.5-6"}]},{"id":"ens-7","nombre":"Puente ENS ↔ ISO/IEC 27001","resumen":"Qué aprovecha el ENS de una certificación 27001 y en qué se diferencian, según la guía CCN-STIC 825.","preguntas":[{"id":"ens-7-01","t":"vf","d":1,"q":"Una certificación ISO/IEC 27001 sustituye a la certificación de conformidad con el ENS.","c":false,"x":"No la sustituye. La CCN-STIC 825 explica qué medidas son compatibles para aprovechar el trabajo, pero el ENS es un marco legal obligatorio con su propio procedimiento de conformidad (art. 38), y hay medidas sin equivalente en la ISO.","ref":"CCN-STIC 825, apdos. 4.2 y 5"},{"id":"ens-7-02","t":"unica","d":1,"q":"Según la CCN-STIC 825, ¿cuál es la diferencia de carácter entre ambos marcos?","o":["Los dos son voluntarios","La ISO/IEC 27001 es de adhesión voluntaria; el ENS es obligatorio para los sujetos de su ámbito","Los dos son obligatorios para el sector público","El ENS es voluntario para el sector privado en todo caso"],"c":1,"x":"La ISO es un estándar internacional de adhesión voluntaria. El ENS es un marco legal derivado de la Ley 40/2015, obligatorio para el sector público y para los proveedores privados que le presten servicios (art. 2.3).","ref":"CCN-STIC 825, apdo. 4.2"},{"id":"ens-7-03","t":"unica","d":2,"q":"¿Cuál es el ciclo de vigencia de cada certificación según la tabla comparativa de la CCN-STIC 825?","o":["ENS 2 años; ISO/IEC 27001 3 años con seguimientos anuales","Ambas 3 años","ENS 3 años; ISO 2 años","Ambas indefinidas mientras no haya incidentes"],"c":0,"x":"La certificación ENS sigue el ciclo de la auditoría bienal (art. 31). La ISO/IEC 27001 se certifica por 3 años con auditorías de seguimiento anuales y recertificación al final del ciclo.","ref":"CCN-STIC 825, apdo. 4.2 · RD 311/2022, art. 31"},{"id":"ens-7-04","t":"unica","d":2,"q":"En la CCN-STIC 825, ¿qué significa que una medida del ENS sea «parcialmente análoga» a un control ISO?","o":["Que no tiene relación","Que hay que complementar el control, o una de las normas es más exigente","Que son idénticas","Que la ISO la excluye"],"c":1,"x":"La guía usa tres niveles: análogo (lo mismo o asimilable), parcialmente análogo (hay que complementar o una norma exige más) y nula (una de las normas no contempla el control).","ref":"CCN-STIC 825, apdo. 5.2.3"},{"id":"ens-7-05","t":"unica","d":2,"q":"¿Con qué control principal de la ISO/IEC 27001:2022 relaciona la CCN-STIC 825 la medida op.cont.1 (Análisis de impacto)?","o":["5.29 Seguridad de la información durante la interrupción","8.13 Copias de seguridad de la información","5.24 Planificación de la gestión de incidentes","8.14 Redundancia"],"c":0,"x":"La guía asocia op.cont.1 con el control 5.29 como principal. op.cont.3 (pruebas) se asocia a 5.30 (preparación de las TIC para la continuidad) y op.cont.4 (medios alternativos) a 8.14 (redundancia), este último como parcialmente análogo.","ref":"CCN-STIC 825, apdo. 6.2 (op.cont)"},{"id":"ens-7-06","t":"vf","d":2,"q":"Para la CCN-STIC 825, la compatibilidad entre ENS e ISO/IEC 27001 es una relación aritmética de equivalencia uno a uno.","c":false,"x":"La guía lo advierte en su objeto: la compatibilidad no debe interpretarse como una relación aritmética de equivalencia, sino como una interpretación tras un análisis general del contenido de ambas normas.","ref":"CCN-STIC 825, apdo. 2"},{"id":"ens-7-07","t":"unica","d":2,"q":"¿Qué metodología de riesgos orienta cada marco según la tabla comparativa de la CCN-STIC 825?","o":["Ambos imponen MAGERIT","ENS se orienta a MAGERIT; la ISO a la ISO 31000 y la ISO/IEC 27005, aunque ambos admiten cualquier metodología","ENS impone ISO 31000 y la ISO impone MAGERIT","Ninguno habla de metodología"],"c":1,"x":"Los dos permiten cualquier metodología reconocida, pero el ENS se orienta hacia MAGERIT y la ISO hacia la ISO 31000, con referencias en la ISO/IEC 27005.","ref":"CCN-STIC 825, apdo. 4.2"},{"id":"ens-7-08","t":"unica","d":2,"q":"¿Cuántos controles nuevos introdujo el anexo A de la ISO/IEC 27001:2022 respecto a la versión de 2013, según la CCN-STIC 825?","o":["5","11","21","35"],"c":1,"x":"Son 11 controles nuevos: 5.7 inteligencia de amenazas, 5.23 servicios en la nube, 5.30 preparación TIC para la continuidad, 7.4 monitorización de la seguridad física, 8.9 gestión de la configuración, 8.10 eliminación de información, 8.11 enmascaramiento de datos, 8.12 prevención de fugas, 8.16 seguimiento de actividades, 8.23 filtrado web y 8.28 codificación segura.","ref":"CCN-STIC 825, apdo. 4.1.1"},{"id":"ens-7-09","t":"vf","d":2,"q":"La ISO/IEC 27002 es una norma certificable, igual que la ISO/IEC 27001.","c":false,"x":"La 27002 es un código de buenas prácticas, no una norma de requisitos, y por eso no es certificable. Sirve de guía para implantar los controles del anexo A de la 27001.","ref":"CCN-STIC 825, apdo. 4.1.2"},{"id":"ens-7-10","t":"unica","d":3,"q":"Una organización certificada en ISO/IEC 27001 quiere certificarse en el ENS de categoría ALTA. ¿Qué enfoque es correcto?","o":["Presentar el certificado ISO como evidencia suficiente de todas las medidas","Reutilizar los controles análogos como evidencia, completar los parcialmente análogos y cubrir las medidas sin equivalente, incluidas las dimensiones de autenticidad y trazabilidad","Empezar desde cero, porque nada de la ISO sirve","Esperar a que el CCN homologue el certificado ISO"],"c":1,"x":"Es el planteamiento de la CCN-STIC 825: aprovechar lo análogo, adaptar lo parcial y cubrir lo que la ISO no contempla. Por ejemplo, el ENS valora cinco dimensiones (la ISO tres) y tiene medidas sin equivalente en la ISO, que no se heredan de su certificación.","ref":"CCN-STIC 825, apdos. 5 y 5.1"}]}]},{"id":"iso27001","nombre":"ISO/IEC 27001:2022","corto":"27001","color":"iso","icono":"layers","descripcion":"El sistema de gestión de seguridad de la información (SGSI): estructura de la norma, cláusulas 4 a 10, los 93 controles del anexo A y cómo funciona la certificación.","fuente":"Redacción propia con referencia a las cláusulas de ISO/IEC 27001:2022 (y su modificación 1:2024), ISO/IEC 27002:2022, ISO/IEC 27006-1 e ISO 19011:2018","salas":[{"id":"iso-1","nombre":"Fundamentos y estructura","resumen":"La familia 27000, la estructura armonizada, qué cambió en 2022 y cómo se organiza el anexo A.","preguntas":[{"id":"iso-1-01","t":"unica","d":1,"q":"¿Qué norma de la familia 27000 establece los requisitos de un SGSI y permite certificarse?","o":["ISO/IEC 27000","ISO/IEC 27001","ISO/IEC 27002","ISO/IEC 27005"],"c":1,"x":"La 27001 contiene los requisitos y es la certificable. La 27000 da la visión general y el vocabulario, la 27002 es la guía de controles y la 27005 orienta la gestión de riesgos.","ref":"ISO/IEC 27001:2022, cap. 1 · familia ISO/IEC 27000"},{"id":"iso-1-02","t":"unica","d":1,"q":"¿Cuántos controles tiene el anexo A de la ISO/IEC 27001:2022 y en cuántos temas se agrupan?","o":["114 controles en 14 dominios","93 controles en 4 temas","93 controles en 14 dominios","73 controles en 3 marcos"],"c":1,"x":"La versión 2022 reorganizó el anexo A en 93 controles y 4 temas: organizacionales (37), de personas (8), físicos (14) y tecnológicos (34). La de 2013 tenía 114 controles en 14 dominios. 73 son las medidas del ENS.","ref":"ISO/IEC 27001:2022, anexo A"},{"id":"iso-1-03","t":"multiple","d":2,"q":"¿Cuáles de estos controles se incorporaron como nuevos en el anexo A de 2022?","o":["5.7 Inteligencia de amenazas","5.23 Seguridad en el uso de servicios en la nube","8.13 Copias de seguridad de la información","8.28 Codificación segura","5.1 Políticas de seguridad de la información"],"c":[0,1,3],"x":"Son 11 nuevos: 5.7, 5.23, 5.30, 7.4, 8.9, 8.10, 8.11, 8.12, 8.16, 8.23 y 8.28. Las copias de seguridad (8.13) y las políticas (5.1) ya existían en 2013, con otra numeración.","ref":"ISO/IEC 27001:2022, anexo A · CCN-STIC 825, apdo. 4.1.1"},{"id":"iso-1-04","t":"unica","d":2,"q":"¿Qué cláusulas de la ISO/IEC 27001 contienen requisitos auditables?","o":["De la 0 a la 10","De la 4 a la 10","Solo el anexo A","De la 1 a la 3"],"c":1,"x":"Las cláusulas 0 a 3 son introducción, objeto, referencias normativas y términos. Los requisitos del sistema de gestión están en las cláusulas 4 a 10; el anexo A es la lista de referencia de controles que se contrasta en 6.1.3.","ref":"ISO/IEC 27001:2022, cláusulas 4 a 10"},{"id":"iso-1-05","t":"unica","d":2,"q":"¿Por qué la 27001 tiene las mismas cláusulas principales que la ISO 9001 o la ISO 22301?","o":["Por casualidad editorial","Porque todas siguen la estructura armonizada (antes «Anexo SL») de las normas de sistemas de gestión","Porque la 27001 deriva de la 9001","Porque las publica el mismo comité técnico"],"c":1,"x":"Las normas ISO de sistemas de gestión comparten una estructura armonizada (Harmonized Structure, heredera del Anexo SL): contexto, liderazgo, planificación, apoyo, operación, evaluación y mejora. Eso facilita integrar varios sistemas de gestión.","ref":"ISO/IEC 27001:2022, introducción · CCN-STIC 825, apdo. 1"},{"id":"iso-1-06","t":"unica","d":2,"q":"¿Qué añadió la modificación 1 de 2024 (Amd 1:2024) a la ISO/IEC 27001:2022?","o":["Diez controles de IA en el anexo A","La consideración del cambio climático en el contexto (4.1) y en las partes interesadas (4.2)","Un nuevo capítulo de privacidad","La obligación de cifrar todos los datos"],"c":1,"x":"La modificación sobre acción climática, común a muchas normas de sistemas de gestión, pide determinar si el cambio climático es una cuestión pertinente (4.1) y señala que las partes interesadas pueden tener requisitos relacionados con él (4.2).","ref":"ISO/IEC 27001:2022/Amd 1:2024, cláusulas 4.1 y 4.2"},{"id":"iso-1-07","t":"unica","d":2,"q":"En la ISO/IEC 27002:2022, ¿qué valores toma el atributo «tipo de control»?","o":["Organizativo, físico y lógico","Preventivo, detectivo y correctivo","Identificar, proteger, detectar, responder y recuperar","Confidencialidad, integrida
